<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبۆرد - سیستەمی ڕێبین</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { padding: 30px; }
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            max-width: 1000px; 
            margin: 0 auto;
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center;
            cursor: pointer; 
            transition: 0.3s;
            text-decoration: none;
            color: #2c3e50;
            display: block;
        }
        .card:hover { 
            transform: translateY(-10px); 
            background: #27ae60; 
            color: white; 
        }
        .card i { font-size: 40px; margin-bottom: 15px; display: block; }
        .logout-btn { 
            background: #e74c3c; 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>بەخێربێیت کاک ڕێبین 👋</h1>
        <p>داشبۆردی سەرەکی سیستەم</p>
    </div>

    <div class="container">
        <div class="grid-container">
            
            <a href="krin.html" class="card">
                <h2>📥 بەشی کڕین</h2>
                <p>داخڵکردنی کاڵای نوێ</p>
            </a>

            <a href="sales.html" class="card">
                <h2>💰 بەشی فرۆشتن</h2>
                <p>دروستکردنی وەسڵی نوێ</p>
            </a>

            <a href="inventory.html" class="card">
                <h2>📦 کۆگا</h2>
                <p>سەیرکردنی مەوجود</p>
            </a>

        </div>

        <div style="text-align: center;">
            <button class="logout-btn" onclick="logout()">چوونە دەرەوە</button>
        </div>
    </div>

    <script>
        // پشکنینی لۆگین
        if (localStorage.getItem("rebeenAuth") !== "true") {
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.removeItem("rebeenAuth");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
