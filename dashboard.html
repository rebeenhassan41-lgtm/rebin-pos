<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەخێربێیت - سیستەمی ڕێبین</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .header { background: #2c3e50; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); background: #27ae60; color: white; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>بەخێربێیت کاک ڕێبین 👋</h1>
        <p>بۆ داشبۆردی سیستەمەکەت</p>
    </div>

    <div class="grid-container">
        <div class="card">
            <h2>📦 مەخزەن</h2>
            <p>سەیرکردنی کاڵاکان</p>
        </div>
        <div class="card">
            <h2>🧾 وەسڵ</h2>
            <p>دروستکردنی وەسڵی نوێ</p>
        </div>
        <div class="card">
            <h2>📊 ڕاپۆرت</h2>
            <p>فرۆشی ڕۆژانە</p>
        </div>
    </div>

    <button class="logout-btn" onclick="logout()">چوونە دەرەوە</button>

    <script>
        // گرنگ: پشکنینی لۆگین
        if (localStorage.getItem("rebeenAuth") !== "true") {
            window.location.href = "index.html"; // ئەگەر لۆگین نەبوو بگەڕێوە
        }

        function logout() {
            localStorage.removeItem("rebeenAuth");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
