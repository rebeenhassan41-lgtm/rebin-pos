<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبۆرد - سیستەمی ڕێبین</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .header { background: #2c3e50; color: white; padding: 25px; text-align: center; }
        .container { padding: 30px; }
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto;
        }
        .card { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); text-align: center;
            cursor: pointer; transition: 0.3s; text-decoration: none; color: #2c3e50;
            border-top: 5px solid #ccc;
        }
        .card:hover { transform: translateY(-10px); background: #f8f9fa; }
        .icon { font-size: 40px; margin-bottom: 10px; }
        .buy { border-top-color: #3498db; }
        .sell { border-top-color: #2ecc71; }
        .inv { border-top-color: #f1c40f; }
        .rep { border-top-color: #9b59b6; }
        .rec { border-top-color: #e67e22; }
        .pay { border-top-color: #e74c3c; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 12px 30px; border-radius: 10px; cursor: pointer; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>سیستەمی بەڕێوەبردنی ڕێبین 👋</h1>
    </div>

    <div class="container">
        <div class="grid-container">
            <a href="krin.html" class="card buy"><div class="icon">📥</div><h2>کڕین</h2></a>
            <a href="sales.html" class="card sell"><div class="icon">💰</div><h2>فرۆشتن</h2></a>
            <a href="inventory.html" class="card inv"><div class="icon">📦</div><h2>کۆگا</h2></a>
            <a href="report.html" class="card rep"><div class="icon">📊</div><h2>ڕاپۆرت</h2></a>
            <a href="qerzi_kriar.html" class="card rec"><div class="icon">🤝</div><h2>شایەنی وەرگرتنەوە</h2></a>
            <a href="qerzi_bazrgan.html" class="card pay"><div class="icon">💸</div><h2>شایەنی سەرف کردن</h2></a>
        </div>
        <div style="text-align: center;">
            <button class="logout-btn" onclick="logout()">🛑 چوونە دەرەوە</button>
        </div>
    </div>

    <script>
        if (localStorage.getItem("rebeenAuth") !== "true") {
            window.location.href = "index.html";
        }
        function logout() {
            localStorage.removeItem("rebeenAuth");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
