<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕێبین سیستم - داشبۆرد</title>
    <style>
        /* ستایلی داشبۆردەکەت لێرە دابنێ - من ستایلێکی سادە دادەنێم */
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7fe; margin: 0; padding: 20px; direction: rtl; }
        .header { background: #4260e7; color: white; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); background: #edf2f7; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>بەخێربێیت، <span id="displayUserName">...</span></h2>
            <p>بەشی بەڕێوەبردن</p>
        </div>
        <button class="logout-btn" onclick="logout()">چوونە دەرەوە</button>
    </div>

    <div class="grid">
        <div class="card" onclick="alert('کۆگا دەکرێتەوە...')">📦 کۆگا</div>
        <div class="card" onclick="alert('فرۆشتن دەکرێتەوە...')">💰 فرۆشتن</div>
        <div class="card" onclick="alert('ڕاپۆرتەکان دەکرێتەوە...')">📊 ڕاپۆرتەکان</div>
        <div id="adminLink" class="card" style="display:none; border: 2px dashed #4260e7;" onclick="window.location.href='login.html'">⚙️ ڕێکخستنی کارمەند</div>
    </div>

    <script>
        // پشکنینی لۆگین
        if (localStorage.getItem("rebeenAuth") !== "true") {
            window.location.href = "login.html";
        }

        // نیشاندانی ناوی بەکارهێنەر
        document.getElementById("displayUserName").innerText = localStorage.getItem("userName");

        // ئەگەر ئەدمین بوو، دوگمەی ڕێکخستنی کارمەندی پیشان بدە
        if (localStorage.getItem("userPosition") === "Admin") {
            document.getElementById("adminLink").style.display = "block";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
