<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕاپۆرتی گشتی - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #9b59b6; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header { background: var(--main); color: white; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-card h3 { margin: 0; color: #7f8c8d; font-size: 16px; }
        .stat-card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: var(--main); }
        .table-wrap { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        th { background: #f8f9fa; color: #2c3e50; }
        .btn-back { background: #e67e22; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; transition: 0.3s; text-decoration: none; }
        .btn-back:hover { background: #d35400; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0;">📊 ڕاپۆرتی گشتی سیستەم</h2>
        <button onclick="backToDash()" class="btn-back">🏠 گەڕانەوە بۆ داشبۆرد</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>کۆی بابەتەکان</h3>
            <p id="totalItems">0</p>
        </div>
        <div class="stat-card" style="border-top: 5px solid #27ae60;">
            <h3>کۆی کڕین (دۆلار)</h3>
            <p id="totalUSD">0 $</p>
        </div>
        <div class="stat-card" style="border-top: 5px solid #f1c40f;">
            <h3>کۆی کڕین (دینار)</h3>
            <p id="totalIQD">0 ع.د</p>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>بەروار</th>
                    <th>ناوی بابەت</th>
                    <th>وەسڵ</th>
                    <th>بڕ</th>
                    <th>نرخی یەکە</th>
                    <th>دراو</th>
                </tr>
            </thead>
            <tbody id="reportTable">
                <tr><td colspan="6">خەریکە داتاکان دەخوێنرێتەوە...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // پشکنینی لۆگین
    if (localStorage.getItem("rebeenAuth") !== "true") {
        window.location.href = "index.html";
    }

    // فەنکشنی گەڕانەوە بۆ داشبۆرد
    function backToDash() {
        window.location.replace("dashboard.html");
    }

    async function loadReport() {
        try {
            const { data, error } = await _supabase
                .from('invoices')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (data) {
                let totalUSD = 0;
                let totalIQD = 0;
                const tableBody = document.getElementById('reportTable');
                
                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6">هیچ داتایەک نەدۆزرایەوە</td></tr>';
                    return;
                }

                tableBody.innerHTML = data.map(item => {
                    const price = parseFloat(item.buy_price) || 0;
                    const qty = parseFloat(item.qty) || 0;
                    const total = price * qty;

                    if (item.currency === "USD") totalUSD += total;
                    else totalIQD += total;

                    return `
                        <tr>
                            <td>${new Date(item.created_at).toLocaleDateString('ku-IQ')}</td>
                            <td>${item.item_name || '---'}</td>
                            <td>${item.inv_no || '---'}</td>
                            <td>${qty}</td>
                            <td>${price.toLocaleString()}</td>
                            <td>${item.currency}</td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('totalItems').innerText = data.length;
                document.getElementById('totalUSD').innerText = totalUSD.toLocaleString() + " $";
                document.getElementById('totalIQD').innerText = totalIQD.toLocaleString() + " دینار";
            }
        } catch (err) {
            console.error("هەڵە لە بارکردنی داتا:", err);
            document.getElementById('reportTable').innerHTML = '<tr><td colspan="6" style="color:red;">کێشەیەک لە پەیوەندی سێرڤەر ڕوویدا</td></tr>';
        }
    }

    // دەستپێکردن
    window.onload = loadReport;
</script>

</body>
</html>
