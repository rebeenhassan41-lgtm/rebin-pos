<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕێبین سیستم - داشبۆرد</title>
    <style>
        :root { --p: #2c3e50; --s: #27ae60; --blue: #2980b9; --orange: #e67e22; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: auto; }
        
        .welcome-section { background: white; padding: 20px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .welcome-section h1 { color: var(--p); margin: 0; font-size: 24px; }
        .user-name { color: var(--blue); font-weight: bold; }

        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; text-decoration: none; color: var(--p); box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .card span { font-size: 50px; margin-bottom: 15px; }
        
        .krin { border-bottom: 6px solid var(--s); }
        .froshtn { border-bottom: 6px solid var(--orange); }
        .makhzan { border-bottom: 6px solid var(--blue); }
        .raport { border-bottom: 6px solid var(--p); }
        
        .logout-btn { margin-top: 40px; padding: 12px 25px; background: #e74c3c; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .logout-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <div class="welcome-section">
        <h1 id="welcomeText">بەخێربێیت بۆ ڕێبین سیستم</h1>
    </div>

    <div class="grid-menu">
        <a href="krin.html" class="card krin">
            <span>📥</span>
            <h3>کڕینی کاڵا</h3>
            <p>داخڵکردنی وەصڵی نوێ</p>
        </a>

        <a href="sales.html" class="card froshtn">
            <span>📤</span>
            <h3>فرۆشتنی کاڵا</h3>
            <p>دەرکردنی وەصڵی فرۆشتن</p>
        </a>

        <a href="inventory.html" class="card makhzan">
            <span>📦</span>
            <h3>مەخزەن</h3>
            <p>بینینی بڕی کاڵاکان</p>
        </a>

        <a href="reports.html" class="card raport">
            <span>📜</span>
            <h3>ڕاپۆرتەکان</h3>
            <p>کۆی کڕین و فرۆشتن</p>
        </a>
    </div>

    <button class="logout-btn" onclick="logout()">چوونە دەرەوە 🚪</button>
</div>

<script>
    // پشکنینی لۆگین
    if(localStorage.getItem("rebinAuth") !== "true") {
        window.location.href = "index.html";
    }

    // نیشاندانی ناوی بەکارهێنەر
    window.onload = function() {
        const user = localStorage.getItem("currentUser") || "بەکارهێنەر";
        document.getElementById("welcomeText").innerHTML = `بەخێربێیت بۆ ڕێبین سیستم ، کاک <span class="user-name">${user}</span>`;
    };

    function logout() {
        if(confirm("دڵنیای لە چوونە دەرەوە؟")) {
            localStorage.removeItem("rebinAuth");
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }
    }
</script>

</body>
</html>
