<script>
    function checkAuth() {
        // پشکنینی لۆگین
        if (localStorage.getItem("rebeenAuth") !== "true") {
            window.location.replace("login.html");
        } else {
            const name = localStorage.getItem("userName") || "بەکارهێنەر";
            const branchName = localStorage.getItem("userBranchName") || "نادیار";
            
            document.getElementById("userWelcome").innerText = `بەخێربێیت، ${name} 👋`;
            document.getElementById("branchDisplay").innerText = `لق: ${branchName}`;
            
            // بانگکردنی فەنکشنی مۆڵەتەکان بۆ شاردنەوەی دوگمەکان
            applyPermissions();
        }
    }

    function applyPermissions() {
        const permsRaw = localStorage.getItem("userPermissions");
        if (!permsRaw) return;

        const perms = JSON.parse(permsRaw);

        // شاردنەوەی بەشەکان ئەگەر مۆڵەتیان نەبوو
        if (perms.sales === false) document.querySelector('.sell').style.display = 'none';
        if (perms.reports === false) document.querySelector('.rep').style.display = 'none';
        if (perms.items === false) {
            document.querySelector('.item-add').style.display = 'none';
            document.querySelector('.inv').style.display = 'none';
        }

        // تەنها "بەڕێوەبەر" دەتوانێت کارمەند و لق ببینێت
        const position = localStorage.getItem("userPosition");
        if (position !== "بەڕێوەبەر") {
            document.querySelector('.user-add').style.display = 'none';
            document.querySelector('.branch-card').style.display = 'none';
        }
    }
    
    checkAuth();

    function logout() {
        if(confirm("دڵنیای لە چوونە دەرەوە؟")) {
            localStorage.clear(); 
            window.location.replace("login.html");
        }
    }

    function navTo(page) {
        window.location.href = page;
    }

    window.onpageshow = function(event) {
        if (event.persisted) window.location.reload();
    };
</script>
