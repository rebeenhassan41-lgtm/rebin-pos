<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕێبین سیستم - داشبۆرد</title>
    <style>
        :root { --p: #2c3e50; --s: #27ae60; --blue: #2980b9; --orange: #e67e22; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: auto; }
        
        .welcome-header { 
            background: linear-gradient(135deg, var(--p), var(--blue)); 
            color: white; 
            padding: 30px; 
            border-radius: 20px; 
            margin-bottom: 30px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .welcome-header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }

        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-top: 20px; }
        .card { 
            background: white; 
            padding: 35px 20px; 
            border-radius: 25px; 
            text-decoration: none; 
            color: var(--p); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            transition: all 0.3s ease; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .card span { font-size: 55px; margin-bottom: 15px; }
        .card h3 { margin: 10px 0; font-size: 20px; }
        .card p { margin: 0; color: #7f8c8d; font-size: 14px; }
        
        .krin { border-bottom: 8px solid var(--s); }
        .froshtn { border-bottom: 8px solid var(--orange); }
        .makhzan { border-bottom: 8px solid var(--blue); }
        .raport { border-bottom: 8px solid var(--p); }
        
        .logout-btn { 
            margin-top: 50px; 
            padding: 12px 30px; 
            background: #e74c3c; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }
        .logout-btn:hover { background: #c0392b; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <div class="welcome-header">
        <h1>بەخێربێیت بۆ ڕێبین سیستم</h1>
    </div>

    <div class="grid-menu">
        <a href="krin.html" class="card krin">
            <span>📥</span>
            <h3>کڕینی کاڵا</h3>
            <p>تۆمارکردنی وەصڵی نوێ</p>
        </a>

        <a href="sales.html" class="card froshtn">
            <span>📤</span>
            <h3>فرۆشتنی کاڵا</h3>
            <p>دەرکردنی وەصڵی فرۆشتن</p>
        </a>

        <a href="inventory.html" class="card makhzan">
            <span>📦</span>
            <h3>مەخزەن</h3>
            <p>بینینی بڕی کاڵاکان</p>
        </a>

        <a href="reports.html" class="card raport">
            <span>📜</span>
            <h3>ڕاپۆرتەکان</h3>
            <p>کۆی گشتی داتاکان</p>
        </a>
    </div>

    <button class="logout-btn" onclick="logout()">چوونە دەرەوە 🚪</button>
</div>

<script>
    // پاراستنی لاپەڕە
    if(localStorage.getItem("rebinAuth") !== "true") {
        window.location.href = "index.html";
    }

    function logout() {
        if(confirm("دڵنیای لە چوونە دەرەوە؟")) {
            localStorage.removeItem("rebinAuth");
            window.location.href = "index.html";
        }
    }
</script>

</body>
</html>
