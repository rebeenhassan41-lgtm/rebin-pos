<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوورەوە - Rebin System</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #2c3e50; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: white; 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            text-align: center; 
            width: 320px; 
        }
        h2 { color: #2c3e50; margin-bottom: 25px; font-size: 24px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            text-align: center; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            transition: 0.3s; 
            margin-top: 10px; 
        }
        button:hover { background: #219150; }
        #error { color: red; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔑 چوونەژوورەوە</h2>
        <input type="text" id="user" placeholder="ناوی بەکارهێنەر">
        <input type="password" id="pass" placeholder="پاسوۆرد">
        <button onclick="login()">داخڵبوون</button>
        <div id="error">ناو یان پاسوۆرد هەڵەیە!</div>
    </div>

    <script>
        function login() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();
            const errorDiv = document.getElementById('error');

            // پشکنینی ناو و پاسۆرد (rebeen / 6202)
            if(u === "rebeen" && p === "6202") {
                // پاشکەوتکردنی لۆگین
                localStorage.setItem("rebeenAuth", "true");
                
                // گواستنەوە بۆ لاپەڕەی داشبۆرد
                window.location.href = "dashboard.html";
            } else {
                errorDiv.style.display = "block";
                setTimeout(() => { errorDiv.style.display = "none"; }, 3000);
            }
        }

        // ئەگەر پێشتر لۆگین بوو بێت، با ڕاستەوخۆ بچێتە داشبۆرد
        window.onload = function() {
            if(localStorage.getItem("rebeenAuth") === "true") {
                window.location.href = "dashboard.html";
            }
        }
    </script>

</body>
</html>
