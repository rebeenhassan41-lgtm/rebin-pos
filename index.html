<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>چوونەژوورەوە - Rebin System</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; width: 320px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>بەخێرهاتی 👋</h2>
        <input type="password" id="passInput" placeholder="وشەی تێپەڕ بنووسە">
        <button onclick="checkLogin()">چوونەژوورەوە</button>
        <p id="msg" style="color: red; font-size: 13px;"></p>
    </div>

    <script>
        function checkLogin() {
            const pass = document.getElementById('passInput').value;
            // لێرە وشەی تێپەڕ دابنێ (بۆ نموونە: 1234)
            if (pass === "rebin2024") { 
                localStorage.setItem("rebeenAuth", "true");
                window.location.href = "dashboard.html";
            } else {
                document.getElementById('msg').innerText = "وشەی تێپەڕ هەڵەیە!";
            }
        }
    </script>
</body>
</html>
