<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>چوونەژوورەوە - Rebin System</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; width: 350px; }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>سیستەمی ڕێبین</h2>
        <input type="text" id="user" placeholder="ناوی بەکارهێنەر">
        <input type="password" id="pass" placeholder="پاسوۆرد">
        <button onclick="login()">چوونەژوورەوە</button>
    </div>

    <script>
        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === "rebeen" && p === "6202") {
                localStorage.setItem("rebeenAuth", "true");
                window.location.href = "dashboard.html";
            } else {
                alert("ناو یان پاسوۆرد هەڵەیە!");
            }
        }
    </script>
</body>
</html>
