<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕێبین سیستم | فرۆشتنی دانە و کارتۆن</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #1e293b; --s: #f59e0b; --success: #10b981; --bg: #f1f5f9; --blue: #3b82f6; --danger: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); direction: rtl; margin: 0; padding: 10px; }
        .pos-container { display: grid; grid-template-columns: 1fr 400px; gap: 15px; max-width: 1400px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .pos-header { background: var(--p); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .cart-table { width: 100%; border-collapse: collapse; }
        .cart-table th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #e2e8f0; }
        .cart-table td { padding: 10px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .scroll-area { max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        .total-box { background: var(--p); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .input-field { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .stock-badge { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; width: 80mm; margin: 0 auto; direction: rtl; font-family: Arial; } }
        .print-only { display: none; }
    </style>
</head>
<body>

<div class="pos-header no-print">
    <div><h2 style="margin:0;">🛒 فرۆشتنی ڕێبین (دانە و کارتۆن)</h2><span id="branchTag"></span></div>
    <button onclick="location.href='dashboard.html'" style="background:none; border:1px solid white; color:white; padding:5px 15px; border-radius:5px; cursor:pointer;">🏠 گەڕانەوە</button>
</div>

<div class="pos-container no-print">
    <div class="main-side">
        <div class="card">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="scanInp" class="input-field" style="margin-bottom:0;" placeholder="ناوى کاڵا یان بارکۆد..." autofocus onkeypress="if(event.key==='Enter') findProduct()">
                <button class="btn" style="background:var(--blue); width:auto; margin:0;" onclick="findProduct()">➕ زیادکردن</button>
            </div>
            
            <div class="scroll-area">
                <table class="cart-table">
                    <thead>
                        <tr><th>کاڵا</th><th>جۆر</th><th>بڕ</th><th>نرخ $</th><th>کۆ $</th><th>لادان</th></tr>
                    </thead>
                    <tbody id="cartBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="side-bar">
        <div class="card">
            <div class="total-box">
                <small>کۆی وەسڵ</small>
                <h1 id="grandTotalUSD">0.00 $</h1>
                <h2 id="grandTotalIQD" style="color:#facc15; margin:0;">0 دینار</h2>
            </div>
            <div class="rate-box" style="margin-bottom:15px; font-size:12px; text-align:center;">
                نرخی 100$: <input type="number" id="exRate" value="150000" style="width:80px; text-align:center;" oninput="renderCart()">
            </div>
            <input type="text" id="custName" class="input-field" placeholder="ناوی کڕیار">
            <select id="payMethod" class="input-field"><option value="Cash">💵 نەقد</option><option value="Debt">📝 قەرز</option></select>
            <button class="btn" style="background:var(--s);" onclick="completeSale(false)">💾 پاشەکەوتکردن</button>
            <button class="btn" style="background:var(--success);" onclick="completeSale(true)">🖨️ تەواوکردن و چاپ</button>
        </div>
    </div>
</div>

<div id="printSection" class="print-only">
    <center><h2>ڕێبین سیستم</h2><p id="pBranch"></p><hr></center>
    <div id="pItems"></div>
    <hr>
    <div id="pTotalUSD"></div>
    <div id="pTotalIQD"></div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let cart = [];
    const bId = localStorage.getItem("userBranchId");
    const bName = localStorage.getItem("userBranchName");
    document.getElementById('branchTag').innerText = "لق: " + (bName || "دیاری نەکراوە");

    async function findProduct() {
        const inp = document.getElementById('scanInp');
        const val = inp.value.trim();
        if(!val) return;

        const { data } = await _supabase.from('purchases').select('*').or(`barcode.eq."${val}",item_name.ilike."%${val}%"`).limit(1).maybeSingle();

        if(data) {
            if(data.quantity <= 0) return alert("ئەم کاڵایە لە مەخزەن نەماوە!");
            
            const exist = cart.find(i => i.id === data.id);
            if(exist) {
                if(exist.total_needed + 1 > data.quantity) return alert("بڕی پێویست لە مەخزەن نییە!");
                exist.qty++;
                exist.total_needed++;
            } else {
                cart.push({ ...data, qty: 1, sell_type: 'piece', total_needed: 1 });
            }
            inp.value = ""; renderCart();
        } else alert("کاڵاکە نەدۆزرایەوە!");
    }

    function renderCart() {
        const rate = (parseFloat(document.getElementById('exRate').value) || 0) / 100;
        const tbody = document.getElementById('cartBody');
        let totalUSD = 0;

        tbody.innerHTML = cart.map((item, idx) => {
            const price = item.sell_type === 'carton' ? (item.sale_price_retail * (item.pcs_in_carton || 1)) : item.sale_price_retail;
            const lineTotal = price * item.qty;
            totalUSD += lineTotal;
            
            return `<tr>
                <td style="text-align:right;">${item.item_name}<br><span class="stock-badge">مەخزەن: ${item.quantity}</span></td>
                <td>
                    <select onchange="updateType(${idx}, this.value)">
                        <option value="piece" ${item.sell_type==='piece'?'selected':''}>دانە</option>
                        <option value="carton" ${item.sell_type==='carton'?'selected':''}>کارتۆن</option>
                    </select>
                </td>
                <td><input type="number" value="${item.qty}" style="width:50px;" onchange="updateQty(${idx}, this.value)"></td>
                <td>$${price.toFixed(2)}</td>
                <td>$${lineTotal.toFixed(2)}</td>
                <td><button onclick="removeItem(${idx})" style="color:red; border:none; background:none; cursor:pointer;">🗑️</button></td>
            </tr>`;
        }).join('');

        document.getElementById('grandTotalUSD').innerText = totalUSD.toFixed(2) + " $";
        document.getElementById('grandTotalIQD').innerText = Math.round(totalUSD * rate).toLocaleString() + " دینار";
    }

    function updateType(idx, type) {
        cart[idx].sell_type = type;
        checkAndSync(idx);
    }

    function updateQty(idx, q) {
        cart[idx].qty = parseInt(q) || 1;
        checkAndSync(idx);
    }

    function checkAndSync(idx) {
        const item = cart[idx];
        const multiplier = item.sell_type === 'carton' ? (item.pcs_in_carton || 1) : 1;
        const total = item.qty * multiplier;

        if(total > item.quantity) {
            alert("بڕی داواکراو لە مەخزەن نییە! (تەنها " + item.quantity + " دانە هەیە)");
            item.qty = 1;
            item.total_needed = item.sell_type === 'carton' ? (item.pcs_in_carton || 1) : 1;
        } else {
            item.total_needed = total;
        }
        renderCart();
    }

    function removeItem(idx) { cart.splice(idx, 1); renderCart(); }

    async function completeSale(shouldPrint) {
        if(cart.length === 0) return;
        const totalUSD = cart.reduce((s, i) => s + ((i.sell_type === 'carton' ? i.sale_price_retail * i.pcs_in_carton : i.sale_price_retail) * i.qty), 0);
        
        // ١. تۆمارکردن
        const { data: saleData, error } = await _supabase.from('sales').insert([{
            customer_name: document.getElementById('custName').value || "کڕیاری گشتی",
            total_usd: totalUSD, pay_method: document.getElementById('payMethod').value,
            branch_id: bId, branch_name: bName
        }]).select();

        if(error) return alert("هەڵە لە پاشەکەوتکردن");

        // ٢. کەمکردنەوە لە مەخزەن (بە دانە)
        for(let item of cart) {
            await _supabase.from('purchases').update({ quantity: item.quantity - item.total_needed }).eq('id', item.id);
        }

        if(shouldPrint) {
            // بەشی چاپ لێرە ئامادە دەبێت و ویندۆو پرینت دەکرێت
            window.print();
        }
        location.reload();
    }
</script>
</body>
</html>
