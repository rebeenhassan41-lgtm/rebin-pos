<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕێبین سیستم - وەسڵی فرۆشتن</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #e67e22; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 10px; direction: rtl; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 15px; max-width: 950px; margin: auto; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 10px; border-radius: 10px; margin-bottom: 15px; gap: 10px; }
        .top-bar input, .top-bar select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; }
        .barcode-section { background: #fff; border: 2px solid var(--s); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .barcode-input { width: 100%; padding: 12px; font-size: 20px; text-align: center; border-radius: 8px; border: 1px solid #ddd; outline-color: var(--s); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: var(--p); color: white; padding: 12px; font-size: 14px; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; font-size: 15px; }
        .summary { margin-top: 20px; padding: 20px; background: var(--p); color: white; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .btn-done { background: var(--success); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-done:disabled { background: #7f8c8d; }
        @media print { .no-print { display: none !important; } .container { box-shadow: none; border: none; } body { background: white; } }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar no-print">
        <div><label>💵 دۆلار (100$):</label><input type="number" id="dollarRate" value="152000" style="width: 100px;"></div>
        <div><label>🛒 نرخ:</label>
            <select id="priceType" onchange="updateUI()">
                <option value="retail">فرۆشی تاک</option>
                <option value="wholesale">فرۆشی کۆ</option>
            </select>
        </div>
        <div><label>👥 کڕیار:</label><input type="text" id="customerName" placeholder="کڕیاری گشتی"></div>
        <button onclick="location.href='dashboard.html'" style="background:var(--s); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">🏠 گەڕانەوە</button>
    </div>

    <div class="barcode-section no-print">
        <input type="text" id="barcodeInput" class="barcode-input" placeholder="بارکۆد سکان بکە..." autofocus onkeypress="handleScan(event)">
    </div>

    <div id="printArea">
        <h2 style="text-align: center; margin-top: 0;">وەسڵی فرۆشتن</h2>
        <table>
            <thead>
                <tr>
                    <th>کاڵا</th>
                    <th>بڕ</th>
                    <th>نرخی فرۆشتن</th>
                    <th>کۆی گشتی</th>
                    <th class="no-print">کردار</th>
                </tr>
            </thead>
            <tbody id="invoiceBody"></tbody>
        </table>

        <div class="summary">
            <div>
                <div id="totalUSD" style="font-size: 22px; font-weight: bold;">کۆی گشتی: 0.00 $</div>
                <div id="totalIQD" style="font-size: 16px; opacity: 0.8;">بە دینار: 0 د.ع</div>
            </div>
            <div class="no-print">
                <select id="payMethod" style="padding: 12px; border-radius: 5px; margin-left: 10px;">
                    <option value="Cash">💰 نەختینە (کاش)</option>
                    <option value="Debt">🤝 بە قەرز</option>
                </select>
                <button class="btn-done" id="btnComplete" onclick="completeSale()">تەواوکردن و چاپ 🖨️</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let cart = [];

    async function handleScan(e) {
        if (e.key === 'Enter') {
            const bc = e.target.value.trim();
            if (!bc) return;
            const { data, error } = await _supabase.from('purchases').select('*').eq('barcode', bc).maybeSingle();
            if (data) {
                addItem(data);
                e.target.value = '';
            } else {
                alert("ئەم بارکۆدە لە کۆگا نییە!");
                e.target.value = '';
            }
        }
    }

    function addItem(item) {
        const type = document.getElementById('priceType').value;
        let salePrice = (type === 'retail') ? item.sale_price_retail : item.sale_price_wholesale;
        
        const exists = cart.find(c => c.barcode === item.barcode);
        if (exists) {
            exists.qty += 1;
        } else {
            cart.push({
                id: item.id,
                name: item.item_name,
                barcode: item.barcode,
                sale_price: salePrice,
                cost_price: item.cost_price_usd, // پاراستنی نرخی کڕین بۆ قازانج
                currency: item.currency,
                qty: 1
            });
        }
        updateUI();
    }

    function updateUI() {
        const body = document.getElementById('invoiceBody');
        const rate = parseFloat(document.getElementById('dollarRate').value) || 152000;
        let grandTotalUSD = 0;

        body.innerHTML = cart.map((item, idx) => {
            const lineTotal = item.sale_price * item.qty;
            // گۆڕینی نرخ بۆ دۆلار ئەگەر کاڵاکە بە دینار کڕابێت
            const lineTotalUSD = (item.currency === 'USD') ? lineTotal : (lineTotal / (rate/100));
            grandTotalUSD += lineTotalUSD;

            return `<tr>
                <td>${item.name}</td>
                <td><input type="number" value="${item.qty}" style="width:50px; text-align:center;" onchange="updateQty(${idx}, this.value)"></td>
                <td>${item.sale_price.toLocaleString()} ${item.currency === 'USD' ? '$' : 'د.ع'}</td>
                <td>${lineTotal.toLocaleString()}</td>
                <td class="no-print"><button onclick="removeItem(${idx})" style="color:red; border:none; background:none; cursor:pointer;">🗑️</button></td>
            </tr>`;
        }).join('');

        document.getElementById('totalUSD').innerText = `کۆی گشتی: ${grandTotalUSD.toFixed(2)} $`;
        document.getElementById('totalIQD').innerText = `بە دینار: ${(grandTotalUSD * (rate/100)).toLocaleString()} د.ع`;
    }

    function updateQty(idx, val) { cart[idx].qty = parseFloat(val) || 1; updateUI(); }
    function removeItem(idx) { cart.splice(idx, 1); updateUI(); }

    async function completeSale() {
        if (cart.length === 0) return alert("وەسڵەکە خاڵییە!");
        const btn = document.getElementById('btnComplete');
        btn.disabled = true;

        const customer = document.getElementById('customerName').value || "کڕیاری گشتی";
        const method = document.getElementById('payMethod').value;
        const totalSalesUSD = parseFloat(document.getElementById('totalUSD').innerText.replace(/[^0-9.]/g, ''));
        
        // حسابکردنی کۆی تێچوو (Cost) بۆ قازانج
        let totalCostUSD = 0;
        cart.forEach(item => { totalCostUSD += (item.cost_price * item.qty); });

        try {
            // ١. تۆمارکردنی فرۆشتن لە داتابەیس
            await _supabase.from('sales').insert([{
                customer_name: customer,
                total_usd: totalSalesUSD,
                total_cost_usd: totalCostUSD, // ئەمە بۆ قازانجەکە زۆر گرنگە
                pay_method: method
            }]);

            // ٢. ئەگەر قەرز بوو، تۆمارکردنی قەرز
            if (method === "Debt") {
                await _supabase.from('qerzi_kriar').insert([{
                    name: customer,
                    amount: totalSalesUSD,
                    currency: "USD",
                    note: "فرۆشتنی قەرز"
                }]);
            }

            // ٣. کەمکردنەوە لە کۆگا
            for (const item of cart) {
                const { data: stock } = await _supabase.from('purchases').select('quantity').eq('id', item.id).single();
                if (stock) {
                    await _supabase.from('purchases').update({ quantity: stock.quantity - item.qty }).eq('id', item.id);
                }
            }

            alert("سەرکەوتوو بوو ✅");
            window.print();
            location.reload();
        } catch (e) {
            alert("هەڵەیەک ڕوویدا");
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
