<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕێبین سیستم - فرۆشتنی پێشکەوتوو</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #e67e22; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; direction: rtl; }
        .container { background: white; padding: 25px; border-radius: 15px; max-width: 800px; margin: auto; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; background: #eee; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .entry-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 20px;}
        input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
        .btn-add { background: var(--p); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-save { background: var(--success); color: white; border: none; font-weight: bold; cursor: pointer; padding: 15px; margin-top: 20px; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f8f9fa; color: var(--p); padding: 12px; font-size: 14px; border-bottom: 2px solid var(--p); }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        .total-section { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px; text-align: left; }
        
        /* دیزاینی پرینت */
        @media print { 
            .no-print { display: none !important; } 
            body { background: white; padding: 0; }
            .container { box-shadow: none; width: 100%; max-width: 100%; border: none; }
            th { background: #eee !important; color: black !important; }
        }
    </style>
</head>
<body>

<div class="container" id="invoiceContent">
    <div class="no-print" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
        <button onclick="location.href='dashboard.html'" style="width:auto; background:var(--p); color:white;">⬅️ داشبۆرد</button>
        <h2 style="margin:0; color: var(--p);">سیستەمی ڕێبین</h2>
    </div>

    <div class="setup-grid">
        <div><label>ناوی کڕیار:</label><input type="text" id="customerName" placeholder="کڕیار"></div>
        <div><label>جۆری فرۆشتن:</label>
            <select id="saleType">
                <option value="نەقد">💰 نەقد</option>
                <option value="قەرز">🤝 قەرز</option>
            </select>
        </div>
        <div class="no-print"><label>100$ بە دینار:</label><input type="number" id="rateIQD" value="152000"></div>
    </div>

    <div class="entry-grid no-print">
        <div><label>کاڵا:</label><select id="itemSelect"></select></div>
        <div><label>کارتۆن:</label><input type="number" id="cartonQty" value="0"></div>
        <div><label>دانە:</label><input type="number" id="pieceQty" value="0"></div>
        <div><label>نرخ ($):</label><input type="number" id="sellPrice" placeholder="0.00"></div>
        <button class="btn-add" onclick="addToInvoice()">+ زیادکردن</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ناوی کاڵا</th>
                <th>بڕ</th>
                <th>نرخ ($)</th>
                <th>کۆی گشتی ($)</th>
            </tr>
        </thead>
        <tbody id="invoiceTable"></tbody>
    </table>

    <div class="total-section">
        <h3 id="totalUSD">کۆی گشتی: 0 $</h3>
        <h4 id="totalIQD" style="color: #8e44ad;">بە دینار: 0 د.ع</h4>
    </div>

    <button class="btn-save no-print" onclick="saveAndPrint()" id="saveBtn">💾 تۆمارکردن و پرینت</button>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let invoiceItems = [];
    let grandTotalUSD = 0;

    async function loadItemsFromDB() {
        const { data } = await _supabase.from('invoices').select('item_name');
        if (data) {
            let select = document.getElementById('itemSelect');
            select.innerHTML = '<option value="">هەڵبژاردنی کاڵا...</option>';
            let uniqueItems = [...new Set(data.map(i => i.item_name))];
            uniqueItems.forEach(name => {
                let opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
        }
    }

    function addToInvoice() {
        const name = document.getElementById('itemSelect').value;
        const cQty = parseFloat(document.getElementById('cartonQty').value) || 0;
        const pQty = parseFloat(document.getElementById('pieceQty').value) || 0;
        const price = parseFloat(document.getElementById('sellPrice').value) || 0;

        if (!name || (cQty === 0 && pQty === 0)) return;

        const total = (cQty + pQty) * price;
        invoiceItems.push({ name, cQty, pQty, price, total });
        updateTable();
        
        // پاککردنەوەی خانەکان بۆ کاڵای داهاتوو
        document.getElementById('cartonQty').value = 0;
        document.getElementById('pieceQty').value = 0;
        document.getElementById('sellPrice').value = "";
    }

    function updateTable() {
        const body = document.getElementById('invoiceTable');
        grandTotalUSD = 0;
        body.innerHTML = invoiceItems.map(i => {
            grandTotalUSD += i.total;
            return `<tr><td>${i.name}</td><td>${i.cQty} ک، ${i.pQty} د</td><td>${i.price} $</td><td>${i.total} $</td></tr>`;
        }).join('');

        const rate = document.getElementById('rateIQD').value;
        document.getElementById('totalUSD').innerText = `کۆی گشتی: ${grandTotalUSD.toLocaleString()} $`;
        document.getElementById('totalIQD').innerText = `بە دینار: ${(grandTotalUSD * (rate/100)).toLocaleString()} د.ع`;
    }

    async function saveAndPrint() {
        const cName = document.getElementById('customerName').value.trim();
        const sType = document.getElementById('saleType').value;
        
        if (!cName || invoiceItems.length === 0) {
            alert("تکایە ناوی کڕیار و کاڵاکان داخڵ بکە");
            return;
        }

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = "خەریکە تۆمار دەبێت...";

        // ١. ئەگەر قەرز بوو، بینێرە بۆ خشتەی قەرزی کڕیار
        if (sType === "قەرز") {
            const { error: qerzError } = await _supabase.from('qerzi_kriar').insert([{
                name: cName,
                amount: grandTotalUSD,
                currency: "USD",
                note: "وەسڵی فرۆشتنی قەرز - " + new Date().toLocaleDateString()
            }]);
            
            if (qerzError) {
                alert("کێشە لە ناردنی قەرز هەبوو: " + qerzError.message);
                btn.disabled = false;
                return;
            }
        }

        // ٢. لێرە دەتوانیت کۆدی سەیڤکردنی وەسڵەکە بۆ خشتەی sales زیاد بکەیت ئەگەر هەتبێت

        // ٣. پرینتکردن
        alert(sType === "قەرز" ? "وەسڵەکە بە قەرز تۆمارکرا. ئێستا پرینت دەکرێت." : "وەسڵەکە بە نەقد تۆمارکرا.");
        window.print();
        
        // ٤. نوێکردنەوەی لاپەڕە بۆ وەسڵێکی نوێ
        location.reload();
    }

    window.onload = loadItemsFromDB;
</script>
</body>
</html>
