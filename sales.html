<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>وەسڵی فرۆشتن - Rebin System</title>
    <style>
        :root { --p: #2c3e50; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; text-align: right; }
        .box { background: white; padding: 25px; border-radius: 20px; max-width: 900px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .input-group { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        input, button { padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; width: 100%; box-sizing: border-box; }
        button { background: var(--danger); color: white; cursor: pointer; border: none; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--p); color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
        .back-btn { display: inline-block; margin-bottom: 15px; text-decoration: none; background: var(--p); color: white; padding: 8px 15px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="box">
    <a href="dashboard.html" class="back-btn">⬅️ گەڕانەوە</a>
    <h2>📤 وەسڵی فرۆشتن (کەمکردنەوە لە مەخزەن)</h2>
    
    <div class="input-group">
        <div><label>ناوی کاڵا</label><input type="text" id="itemName" placeholder="ناوی کاڵا بنووسە"></div>
        <div><label>بڕی فرۆشراو (دانە)</label><input type="number" id="sellQty" placeholder="0"></div>
        <div style="display: flex; align-items: flex-end;">
            <button onclick="makeSale()">فرۆشتن و کەمکردن ⬇️</button>
        </div>
    </div>

    <table id="salesTable">
        <thead>
            <tr>
                <th>ناوی کاڵا</th>
                <th>بڕی فرۆشراو</th>
                <th>بارودۆخ</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    function makeSale() {
        const name = document.getElementById('itemName').value.trim();
        const qty = parseInt(document.getElementById('sellQty').value) || 0;

        if (!name || qty <= 0) {
            alert("تکایە ناوی کاڵا و بڕی فرۆشتن بنووسە");
            return;
        }

        // ١. وەرگرتنی مەخزەن
        let stock = JSON.parse(localStorage.getItem('rebinStock')) || {};

        // ٢. پشکنین: ئایا کاڵاکە لە مەخزەن هەیە؟
        if (!stock[name]) {
            alert("ئەم کاڵایە لە مەخزەن بوونی نییە!");
            return;
        }

        // ٣. پشکنین: ئایا بڕی پێویستمان هەیە؟
        if (stock[name].totalPcs < qty) {
            alert("بڕی پێویست لە مەخزەن نییە! تەنها " + stock[name].totalPcs + " دانە ماوە.");
            return;
        }

        // ٤. کەمکردنەوە لە مەخزەن
        stock[name].totalPcs -= qty;

        // ٥. سەیڤکردنەوەی مەخزەن
        localStorage.setItem('rebinStock', JSON.stringify(stock));

        // ٦. زیادکردن بۆ خشتەی وەسڵەکە
        const tbody = document.querySelector('#salesTable tbody');
        const row = `<tr>
            <td><b>${name}</b></td>
            <td>${qty} دانە</td>
            <td style="color:green;">✅ فرۆشرا</td>
        </tr>`;
        tbody.innerHTML = row + tbody.innerHTML;

        // پاککردنەوە
        document.getElementById('itemName').value = "";
        document.getElementById('sellQty').value = "";
        
        alert("فرۆشتن سەرکەوتوو بوو و لە مەخزەن کەمکرایەوە.");
    }
</script>

</body>
</html>
