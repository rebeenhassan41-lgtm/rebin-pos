<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەڕێوەبردنی بەکارهێنەران</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; direction: rtl; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #27ae60; color: white; }
        .user-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .online { background-color: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .offline { background-color: #95a5a6; }
        .perm-box { font-size: 12px; background: #f9f9f9; padding: 5px; border-radius: 5px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👤 بەکارهێنەری نوێ</h2>
        <input type="text" id="fullName" placeholder="ناوی تەواو">
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر">
        <input type="password" id="password" placeholder="پاسوۆرد">
        <input type="tel" id="phone" placeholder="ژمارەی مۆبایل">
        <select id="position">
            <option value="بەڕێوەبەر">بەڕێوەبەر</option>
            <option value="کارمەند">کارمەند</option>
        </select>
        <button class="btn btn-add" onclick="createUser()">تۆمارکردن ✅</button>
    </div>

    <div class="card">
        <h2>👥 لیستی بەکارهێنەران</h2>
        <div id="userList">خەریکی بارکردنە...</div>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function fetchUsers() {
        const { data, error } = await _supabase.from('system_users').select('*');
        if (error) return;

        const listDiv = document.getElementById('userList');
        listDiv.innerHTML = '';

        data.forEach(user => {
            // پشکنینی ئۆنلاین بوون (ئەگەر کەمتر لە ٥ خولەک پێش ئێستا چالاک بووبێت)
            const lastSeen = new Date(user.last_seen);
            const isOnline = (new Date() - lastSeen) < 300000; 

            listDiv.innerHTML += `
                <div class="user-item">
                    <div>
                        <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                        <strong>${user.full_name}</strong> (${user.position})
                        <div class="perm-box">
                            مۆڵەت: ${user.permissions?.can_sell ? 'فرۆشتن ✅' : 'فرۆشتن ❌'} | 
                            ${user.permissions?.can_report ? 'ڕاپۆرت ✅' : 'ڕاپۆرت ❌'}
                        </div>
                    </div>
                    <button onclick="deleteUser('${user.id}')" style="color:red; border:none; background:none; cursor:pointer;">سڕینەوە</button>
                </div>
            `;
        });
    }

    async function createUser() {
        const name = document.getElementById('fullName').value;
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const pos = document.getElementById('position').value;

        const { error } = await _supabase.from('system_users').insert([{
            full_name: name, username: user, password: pass, position: pos,
            permissions: { can_sell: true, can_buy: true, can_report: (pos === 'بەڕێوەبەر') }
        }]);

        if (!error) { alert("دروستکرا!"); fetchUsers(); }
    }

    async function deleteUser(id) {
        if(confirm('دڵنیای لە سڕینەوەی؟')) {
            await _supabase.from('system_users').delete().eq('id', id);
            fetchUsers();
        }
    }

    // نوێکردنەوەی لیستەکە هەموو ١٠ چرکەیەک بۆ ئۆنلاین بوون
    fetchUsers();
    setInterval(fetchUsers, 10000);
</script>
</body>
</html>
