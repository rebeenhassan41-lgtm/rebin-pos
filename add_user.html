<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>زیادکردنی بەکارهێنەر</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 20px; }
        .form-card { max-width: 450px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 15px; background: #2c3e50; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; margin-top: 20px; font-weight: bold; }
        .btn-back { background: #eee; color: #333; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-back">🔙 گەڕانەوە</a>

    <div class="form-card">
        <h2 style="text-align:center; margin-top:0;">👤 زیادکردنی بەکارهێنەری نوێ</h2>
        
        <input type="text" id="fullName" placeholder="ناوی سیانی">
        <input type="text" id="phone" placeholder="ژمارەی مۆبایل">
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر (Username)">
        <input type="password" id="password" placeholder="پاسوۆرد">

        <button class="btn-save" onclick="createUser()">تۆمارکردن ✅</button>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function createUser() {
        const name = document.getElementById('fullName').value;
        const phone = document.getElementById('phone').value;
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if(!name || !user || !pass) return alert("تکایە خانەکان پڕ بکەرەوە!");

        const { error } = await _supabase.from('system_users').insert([{
            full_name: name,
            username: user,
            password: pass,
            phone_number: phone
        }]);

        if(!error) {
            alert("بەکارهێنەر بە سەرکەوتوویی دروست کرا ✅");
            location.href = 'dashboard.html';
        } else {
            alert("هەڵە: " + error.message);
        }
    }
</script>
</body>
</html>
