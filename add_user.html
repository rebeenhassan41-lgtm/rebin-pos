<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زیادکردنی بەکارهێنەر</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 15px; margin: 0; }
        .form-card { max-width: 400px; margin: 20px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--p); font-size: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--p); font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        .btn-save { width: 100%; padding: 15px; background: var(--p); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 18px; margin-top: 25px; font-weight: bold; }
        .btn-back { background: #eee; color: #333; padding: 10px 20px; border-radius: 8px; text-decoration: none; display: inline-block; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-back">🔙 گەڕانەوە</a>

    <div class="form-card">
        <h2>👤 بەکارهێنەری نوێ</h2>
        
        <label>ناوی تەواو:</label>
        <input type="text" id="fullName" placeholder="بۆ نموونە: ئەحمەد عەلی">

        <label>ژمارەی مۆبایل:</label>
        <input type="tel" id="phone" placeholder="0750xxxxxxx">

        <label>ناوی بەکارهێنەر (بۆ چوونە ژوورەوە):</label>
        <input type="text" id="username" placeholder="username">

        <label>پاسوۆرد:</label>
        <input type="password" id="password" placeholder="******">

        <label>پۆزیشن (Position):</label>
        <select id="position">
            <option value="بەڕێوەبەر">بەڕێوەبەر (Admin)</option>
            <option value="کارمەند">کارمەند (Staff)</option>
            <option value="کاشێر">کاشێر (Cashier)</option>
        </select>

        <button class="btn-save" id="saveBtn" onclick="createUser()">تۆمارکردن ✅</button>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function createUser() {
        const name = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const pos = document.getElementById('position').value;
        const btn = document.getElementById('saveBtn');

        if(!name || !user || !pass) return alert("تکایە خانە گرنگەکان پڕ بکەرەوە!");

        btn.disabled = true;
        btn.innerText = "خەریکی تۆمارکردنە...";

        const { error } = await _supabase.from('system_users').insert([{
            full_name: name,
            phone_number: phone,
            username: user,
            password: pass,
            position: pos
        }]);

        if(!error) {
            alert("بەکارهێنەر (" + name + ") بە سەرکەوتوویی دروست کرا ✅");
            location.href = 'dashboard.html';
        } else {
            alert("هەڵە: " + error.message);
            btn.disabled = false;
            btn.innerText = "تۆمارکردن ✅";
        }
    }
</script>
</body>
</html>
