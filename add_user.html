<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R - کارمەندان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #3498db; --success: #27ae60; --warn: #f39c12; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; direction: rtl; padding: 15px; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn-back { background: var(--p); color: white; padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: fit-content; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1.5px solid #eee; border-radius: 10px; font-size: 16px; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--s); }
        .btn-save { width: 100%; padding: 14px; background: var(--success); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 17px; font-weight: bold; }
        .btn-save:disabled { background: #ccc; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #fafafa; border-radius: 12px; margin-bottom: 10px; border: 1px solid #eee; }
        .edit-btn { color: var(--warn); cursor: pointer; border: none; background: none; font-size: 18px; }
        .del-btn { color: var(--danger); cursor: pointer; border: none; background: none; font-size: 18px; }
        .perm-btn { color: var(--s); cursor: pointer; border: none; background: none; font-size: 18px; }

        /* ستایلی پەنجەرەی مۆڵەتەکان */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 15% auto; padding: 25px; border-radius: 20px; width: 85%; max-width: 380px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); position: relative; }
        .perm-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f2f6; }
        .perm-item span { font-weight: 600; color: #34495e; }
    </style>
</head>
<body>

    <div class="header-nav">
        <div>
            <h2 style="margin:0; font-size: 18px;">👥 بەڕێوەبردنی کارمەندان</h2>
            <small id="bName" style="color: #666;">لق: باردەکرێت...</small>
        </div>
        <a href="dashboard.html" class="btn-back">🏠 سەرەکی</a>
    </div>

    <div class="container">
        <div class="card">
            <h3 id="formTitle" style="margin-top:0;">👤 زیادکردنی نوێ</h3>
            <input type="text" id="fullName" placeholder="ناوی تەواو">
            <input type="text" id="username" placeholder="ناوی بەکارهێنەر">
            <input type="password" id="password" placeholder="پاسوۆرد">
            <select id="position">
                <option value="کارمەند">کارمەند</option>
                <option value="بەڕێوەبەر">بەڕێوەبەر</option>
            </select>
            <button class="btn-save" id="mainBtn" onclick="createUser()">تۆمارکردن ✅</button>
            <button id="cancelBtn" style="display:none; width:100%; margin-top:10px; border:none; background:none; cursor:pointer; color: #666;" onclick="resetForm()">پاشگەزبوونەوە</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">📋 لیستی کارمەندان</h3>
            <div id="userList">خەریکی بارکردنە...</div>
        </div>
    </div>

    <div id="permModal" class="modal">
        <div class="modal-content">
            <h3 style="text-align: center; margin-top: 0;">🛡️ مۆڵەتەکان</h3>
            <div id="permList">
                <div class="perm-item"><span>🛒 فرۆشتن</span> <input type="checkbox" id="p_sales" style="transform: scale(1.3);"></div>
                <div class="perm-item"><span>📊 ڕاپۆرتەکان</span> <input type="checkbox" id="p_reports" style="transform: scale(1.3);"></div>
                <div class="perm-item"><span>📦 کاڵاکان</span> <input type="checkbox" id="p_items" style="transform: scale(1.3);"></div>
                <div class="perm-item"><span>🗑️ سڕینەوە</span> <input type="checkbox" id="p_delete" style="transform: scale(1.3);"></div>
            </div>
            <button class="btn-save" style="margin-top: 20px;" onclick="savePermissions()">پاشەکەوتکردن ✅</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--danger); margin-top:15px; cursor:pointer; font-weight:bold;">داخستن</button>
        </div>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    
    let editingId = null;
    let currentUserIdForPerms = null;

    const rawBranchId = localStorage.getItem("userBranchId");
    const currentBranchId = (rawBranchId && rawBranchId !== "null") ? rawBranchId : null;
    const currentBranchName = localStorage.getItem("userBranchName") || "نادیار";
    
    document.getElementById('bName').innerText = "لق: " + currentBranchName;

    async function fetchUsers() {
        if(!currentBranchId) {
            document.getElementById('userList').innerText = "هەڵە: ناسنامەی لق نەدۆزرایەوە.";
            return;
        }

        const { data, error } = await _supabase
            .from('system_users')
            .select('*')
            .eq('branch_id', currentBranchId)
            .order('created_at', { ascending: false });

        if (error) {
            document.getElementById('userList').innerText = "هەڵە لە هێنانی داتا.";
            return;
        }

        const listDiv = document.getElementById('userList');
        listDiv.innerHTML = data.length === 0 ? "هیچ کارمەندێک نییە" : "";
        
        data.forEach(user => {
            listDiv.innerHTML += `
                <div class="user-item">
                    <div>
                        <b>${user.full_name}</b><br>
                        <small style="color:#888;">@${user.username} | ${user.position}</small>
                    </div>
                    <div>
                        <button class="perm-btn" onclick="openPermissions('${user.id}')" title="مۆڵەت">🛡️</button>
                        <button class="edit-btn" onclick="prepareEdit('${user.id}', '${user.full_name}', '${user.username}', '${user.password}', '${user.position}')" title="دەستکاری">⚙️</button>
                        <button class="del-btn" onclick="deleteUser('${user.id}')" title="سڕینەوە">🗑️</button>
                    </div>
                </div>`;
        });
    }

    async function createUser() {
        const name = document.getElementById('fullName').value.trim();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const pos = document.getElementById('position').value;

        if(!name || !user || !pass) return alert("تکایە هەموو خانەکان پڕ بکەرەوە");
        if(!currentBranchId) return alert("هەڵە: ناسنامەی لق بەردەست نییە.");

        const btn = document.getElementById('mainBtn');
        btn.disabled = true;

        if(editingId) {
            const { error } = await _supabase.from('system_users').update({ 
                full_name: name, username: user, password: pass, position: pos 
            }).eq('id', editingId);
            
            if(error) alert("هەڵە: " + error.message);
            else { alert("گۆڕانکارییەکان سەرکەوتوو بوون ✅"); resetForm(); fetchUsers(); }
        } else {
            const { error } = await _supabase.from('system_users').insert([{ 
                full_name: name, 
                username: user, 
                password: pass, 
                position: pos, 
                branch_id: parseInt(currentBranchId),
                permissions: { sales: true, reports: false, items: true, delete: false } // مۆڵەتی سەرەتایی
            }]);
            
            if(error) alert("هەڵە: " + error.message);
            else { alert("کارمەند زیادکرا ✅"); resetForm(); fetchUsers(); }
        }
        btn.disabled = false;
    }

    // --- فەنکشنەکانی مۆڵەت (Permissions) ---
    async function openPermissions(userId) {
        currentUserIdForPerms = userId;
        document.getElementById('permModal').style.display = 'block';

        const { data, error } = await _supabase.from('system_users')
            .select('permissions')
            .eq('id', userId)
            .single();

        if (data && data.permissions) {
            const p = data.permissions;
            document.getElementById('p_sales').checked = !!p.sales;
            document.getElementById('p_reports').checked = !!p.reports;
            document.getElementById('p_items').checked = !!p.items;
            document.getElementById('p_delete').checked = !!p.delete;
        } else {
            // ئەگەر بەتاڵ بوو، هەمووی لادە
            document.querySelectorAll('#permList input').forEach(i => i.checked = false);
        }
    }

    async function savePermissions() {
        const perms = {
            sales: document.getElementById('p_sales').checked,
            reports: document.getElementById('p_reports').checked,
            items: document.getElementById('p_items').checked,
            delete: document.getElementById('p_delete').checked
        };

        const { error } = await _supabase.from('system_users')
            .update({ permissions: perms })
            .eq('id', currentUserIdForPerms);

        if (!error) {
            alert("مۆڵەتەکان نوێکرانەوە ✅");
            closeModal();
        } else {
            alert("کێشەیەک ڕوویدا: " + error.message);
        }
    }

    function closeModal() { document.getElementById('permModal').style.display = 'none'; }

    // --- فەنکشنەکانی تر ---
    function prepareEdit(id, name, user, pass, pos) {
        editingId = id;
        document.getElementById('fullName').value = name;
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
        document.getElementById('position').value = pos;
        document.getElementById('formTitle').innerText = "🔄 دەستکاری کارمەند";
        document.getElementById('mainBtn').innerText = "پاشەکەوتکردن";
        document.getElementById('mainBtn').style.background = "var(--warn)";
        document.getElementById('cancelBtn').style.display = "block";
        window.scrollTo(0,0);
    }

    function resetForm() {
        editingId = null;
        document.getElementById('fullName').value = '';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('formTitle').innerText = "👤 زیادکردنی نوێ";
        document.getElementById('mainBtn').innerText = "تۆمارکردن ✅";
        document.getElementById('mainBtn').style.background = "var(--success)";
        document.getElementById('cancelBtn').style.display = "none";
    }

    async function deleteUser(id) {
        if(confirm("ئایا دڵنیای لە سڕینەوە؟")) {
            const { error } = await _supabase.from('system_users').delete().eq('id', id);
            if(!error) fetchUsers();
        }
    }

    window.onload = fetchUsers;
</script>
</body>
</html>
