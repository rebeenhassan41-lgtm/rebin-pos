<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕاپۆرتی کڕینەکان - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #eef2f3; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-card h3 { margin: 0; color: #7f8c8d; font-size: 14px; }
        .stat-card p { margin: 5px 0 0; font-size: 20px; font-weight: bold; color: var(--main); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: var(--main); color: white; padding: 12px; text-align: center; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        tr:hover { background: #f9f9f9; }
        .search-box { margin-bottom: 20px; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📊 ڕاپۆرتی گشتی کڕین</h2>
        <a href="index.html" style="text-decoration:none; color:var(--accent);">گەڕانەوە</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>کۆی گشتی تێچووی کڕین</h3>
            <p id="totalBuy">0</p>
        </div>
        <div class="stat-card">
            <h3>ژمارەی وەسڵەکان</h3>
            <p id="invCount">0</p>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="بگەڕێ بۆ ناوی بابەت یان بازرگان..." onkeyup="filterTable()">

    <table id="reportTable">
        <thead>
            <tr>
                <th>بەروار</th>
                <th>وەسڵ</th>
                <th>بازرگان</th>
                <th>ناوی بابەت</th>
                <th>بڕ</th>
                <th>نرخی کڕین</th>
                <th>کۆی گشتی</th>
            </tr>
        </thead>
        <tbody id="reportData"></tbody>
    </table>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function loadFullReport() {
        const { data, error } = await _supabase
            .from('invoices')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        let totalBuy = 0;
        const body = document.getElementById('reportData');
        body.innerHTML = data.map(i => {
            const rowTotal = (i.qty || 0) * (i.buy_price || 0);
            totalBuy += rowTotal;
            return `
                <tr>
                    <td>${new Date(i.created_at).toLocaleDateString('ku-IQ')}</td>
                    <td>${i.inv_no || '-'}</td>
                    <td>${i.merchant || '-'}</td>
                    <td>${i.item_name || '-'}</td>
                    <td>${i.qty || 0}</td>
                    <td>${(i.buy_price || 0).toLocaleString()}</td>
                    <td style="font-weight:bold;">${rowTotal.toLocaleString()} ${i.currency}</td>
                </tr>
            `;
        }).join('');

        document.getElementById('totalBuy').innerText = totalBuy.toLocaleString() + " (تێکەڵ)";
        document.getElementById('invCount').innerText = data.length;
    }

    function filterTable() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let rows = document.getElementById("reportData").getElementsByTagName("tr");
        for (let row of rows) {
            row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
        }
    }

    window.onload = loadFullReport;
</script>

</body>
</html>
