<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕاپۆرتی گشتی - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #9b59b6; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header { background: var(--main); color: white; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: var(--main); }
        .btn-back { background: #e67e22; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0;">📊 ڕاپۆرتی گشتی</h2>
        <button onclick="forceBack()" class="btn-back">🏠 گەڕانەوە بۆ داشبۆرد</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>کۆی بابەتەکان</h3><p id="totalItems">0</p></div>
        <div class="stat-card"><h3>کۆی (دۆلار)</h3><p id="totalUSD">0 $</p></div>
        <div class="stat-card"><h3>کۆی (دینار)</h3><p id="totalIQD">0 ع.د</p></div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>بەروار</th>
                    <th>ناوی بابەت</th>
                    <th>وەسڵ</th>
                    <th>بڕ</th>
                    <th>نرخ</th>
                    <th>دراو</th>
                </tr>
            </thead>
            <tbody id="reportTable"></tbody>
        </table>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // پشکنینی لۆگین
    if (localStorage.getItem("rebeenAuth") !== "true") {
        window.location.href = "index.html";
    }

    // فەنکشنی گەڕانەوەی بەهێز
    function forceBack() {
        // هەوڵی یەکەم
        window.location.href = "dashboard.html";
        
        // ئەگەر یەکەم شکستی هێنا، هەوڵی دووەم دوای نیو چرکە
        setTimeout(function(){
            window.location.href = "./dashboard.html";
        }, 500);

        // ئەگەر هەر نەبوو، گەڕانەوەی مێژوویی
        setTimeout(function(){
            window.history.back();
        }, 1000);
    }

    async function loadReport() {
        const { data, error } = await _supabase.from('invoices').select('*').order('created_at', { ascending: false });
        if (data) {
            let totalUSD = 0, totalIQD = 0;
            document.getElementById('reportTable').innerHTML = data.map(item => {
                const total = (item.buy_price || 0) * (item.qty || 0);
                if (item.currency === "USD") totalUSD += total; else totalIQD += total;
                return `<tr>
                    <td>${new Date(item.created_at).toLocaleDateString('ku-IQ')}</td>
                    <td>${item.item_name}</td>
                    <td>${item.inv_no}</td>
                    <td>${item.qty}</td>
                    <td>${item.buy_price}</td>
                    <td>${item.currency}</td>
                </tr>`;
            }).join('');
            document.getElementById('totalItems').innerText = data.length;
            document.getElementById('totalUSD').innerText = totalUSD.toLocaleString() + " $";
            document.getElementById('totalIQD').innerText = totalIQD.toLocaleString() + " دینار";
        }
    }
    loadReport();
</script>
</body>
</html>
