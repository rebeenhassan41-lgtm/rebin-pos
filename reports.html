<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕاپۆرتی پێشکەوتوو - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #eef2f3; padding: 15px; border-radius: 10px; text-align: center; border-top: 4px solid var(--accent); }
        .stat-card h3 { margin: 0; color: #7f8c8d; font-size: 14px; }
        .stat-card p { margin: 5px 0 0; font-size: 18px; font-weight: bold; color: var(--main); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; cursor: pointer; }
        th { background: var(--main); color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        tr:hover { background: #f1f9ff; }
        .search-box { margin-bottom: 20px; width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        /* Modal Style - پەنجەرەی وردەکاری */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 25px; width: 90%; max-width: 500px; border-radius: 15px; position: relative; }
        .close { position: absolute; left: 20px; top: 15px; font-size: 25px; cursor: pointer; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; }
        .detail-row b { color: #555; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📊 ڕاپۆرتی وردی کڕین</h2>
        <a href="index.html" style="text-decoration:none; color:var(--accent); font-weight:bold;">گەڕانەوە</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card" style="border-color: #27ae60;">
            <h3>کۆی گشتی (دۆلار)</h3>
            <p id="totalUSD">$0</p>
        </div>
        <div class="stat-card" style="border-color: #f39c12;">
            <h3>کۆی گشتی (دینار)</h3>
            <p id="totalIQD">0 IQD</p>
        </div>
        <div class="stat-card">
            <h3>ژمارەی وەسڵەکان</h3>
            <p id="invCount">0</p>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="بگەڕێ بۆ وەسڵ، بابەت، یان بازرگان..." onkeyup="filterTable()">

    <table id="reportTable">
        <thead>
            <tr>
                <th>بەروار</th>
                <th>وەسڵ #</th>
                <th>بابەت</th>
                <th>کۆی گشتی</th>
            </tr>
        </thead>
        <tbody id="reportData"></tbody>
    </table>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 style="text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px;">📄 وردەکاری وەسڵ</h3>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allData = [];

    async function loadFullReport() {
        const { data, error } = await _supabase.from('invoices').select('*').order('created_at', { ascending: false });
        if (error) return;
        allData = data;
        renderTable(data);
    }

    function renderTable(data) {
        let usd = 0, iqd = 0;
        const body = document.getElementById('reportData');
        
        body.innerHTML = data.map(i => {
            const rowTotal = (i.qty || 0) * (i.buy_price || 0);
            if(i.currency === 'USD') usd += rowTotal;
            else iqd += rowTotal;

            return `
                <tr onclick="showDetails(${i.id})">
                    <td>${new Date(i.created_at).toLocaleDateString('ku-IQ')}</td>
                    <td>${i.inv_no || '-'}</td>
                    <td>${i.item_name || '-'}</td>
                    <td style="font-weight:bold; color:${i.currency === 'USD' ? '#27ae60' : '#f39c12'}">
                        ${rowTotal.toLocaleString()} ${i.currency}
                    </td>
                </tr>
            `;
        }).join('');

        document.getElementById('totalUSD').innerText = "$" + usd.toLocaleString();
        document.getElementById('totalIQD').innerText = iqd.toLocaleString() + " IQD";
        document.getElementById('invCount').innerText = data.length;
    }

    function showDetails(id) {
        const item = allData.find(i => i.id === id);
        const modalBody = document.getElementById('modalBody');
        modalBody.innerHTML = `
            <div class="detail-row"><b>ڕێکەوت:</b> <span>${new Date(item.created_at).toLocaleString('ku-IQ')}</span></div>
            <div class="detail-row"><b>ژمارەی وەسڵ:</b> <span>${item.inv_no}</span></div>
            <div class="detail-row"><b>بازرگان:</b> <span>${item.merchant || 'دیاری نەکراوە'}</span></div>
            <div class="detail-row"><b>ناوی بابەت:</b> <span>${item.item_name}</span></div>
            <div class="detail-row"><b>بارکۆد:</b> <span>${item.barcode || '-'}</span></div>
            <div class="detail-row"><b>بڕ (کارتۆن):</b> <span>${item.qty}</span></div>
            <div class="detail-row"><b>دانە لە کارتۆن:</b> <span>${item.pcs}</span></div>
            <div class="detail-row"><b>نرخی کڕین:</b> <span>${item.buy_price.toLocaleString()} ${item.currency}</span></div>
            <div class="detail-row" style="background:#f9f9f9; font-weight:bold;"><b>کۆی گشتی:</b> <span>${(item.qty * item.buy_price).toLocaleString()} ${item.currency}</span></div>
        `;
        document.getElementById('detailsModal').style.display = "block";
    }

    function closeModal() { document.getElementById('detailsModal').style.display = "none"; }
    window.onclick = function(event) { if (event.target.className === 'modal') closeModal(); }

    function filterTable() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        const filtered = allData.filter(i => 
            (i.item_name && i.item_name.toLowerCase().includes(input)) || 
            (i.inv_no && i.inv_no.toLowerCase().includes(input)) ||
            (i.merchant && i.merchant.toLowerCase().includes(input))
        );
        renderTable(filtered);
    }

    window.onload = loadFullReport;
</script>
</body>
</html>
