<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕاپۆرتی گشتی - Rebin System</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; padding: 20px; direction: rtl; }
        .box { background: white; padding: 20px; border-radius: 15px; max-width: 800px; margin: auto; text-align: center; }
        .stat { font-size: 24px; margin: 20px; color: #2c3e50; }
        .back-btn { padding: 10px 20px; background: #2c3e50; color: white; text-decoration: none; border-radius: 8px; }
    </style>
</head>
<body>
<div class="box">
    <h1>📈 ڕاپۆرتی کورتی مەخزەن</h1>
    <div id="result" class="stat">چاوەڕێ بکە...</div>
    <br><br>
    <a href="dashboard.html" class="back-btn">گەڕانەوە</a>
</div>

<script>
    function showReport() {
        const stock = JSON.parse(localStorage.getItem('rebinStock')) || {};
        let totalItems = Object.keys(stock).length;
        let totalQty = 0;
        
        for (let item in stock) {
            totalQty += stock[item].totalPcs;
        }

        document.getElementById('result').innerHTML = `
            کۆی جۆری کاڵاکان: ${totalItems} <br>
            کۆی هەموو دانەکان لە مەخزەن: ${totalQty} دانە
        `;
    }
    window.onload = showReport;
</script>
</body>
</html>
