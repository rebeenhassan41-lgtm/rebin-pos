<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەڕێوەبردنی قەرزی بازرگان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --danger: #e74c3c; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-right: 8px solid var(--danger); }
        .cleared { border-right-color: var(--success) !important; background: #f0fff4; }
        .flex-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 2px; }
        .btn-pay { background: var(--success); color: white; }
        .btn-print { background: var(--main); color: white; }
        
        /* شێوازی پرنت */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; direction: rtl; }
            .no-print { display: none; }
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center;">📊 لیستی قەرزی بازرگانەکان</h2>
    <div id="debtList">بار دەکرێت...</div>
</div>

<div id="payModal" class="modal">
    <div class="modal-content">
        <h3 id="mName">پارەدان</h3>
        <p style="font-size:12px; color:red;">* ئەگەر بە دینار پارە بدەیت، خۆی لە دۆلارەکەی دەشکێنێتەوە بەپێی نرخی وەسڵەکە.</p>
        <label>بڕی دۆلار $</label><input type="number" id="pUSD" value="0">
        <label>بڕی دینار (ع.د)</label><input type="number" id="pIQD" value="0">
        <button class="btn btn-pay" onclick="processPayment()" style="width:100%;">تۆمارکردن ✅</button>
        <button class="btn" onclick="closeModal()" style="width:100%; margin-top:5px;">پاشگەزبوونەوە</button>
    </div>
</div>

<div id="printArea" style="display:none; padding:30px; border:1px solid #000;">
    <h2 style="text-align:center;">وەسڵی کڕین (قەرز)</h2>
    <hr>
    <div id="printDetails"></div>
    <br><br>
    <p style="text-align:left;">واژووی بازرگان: ____________</p>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let activeId = null;
    let activeRate = 1500;

    async function loadDebts() {
        const { data } = await _supabase.from('merchant_debts').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('debtList');
        list.innerHTML = "";

        data.forEach(d => {
            const isCleared = (d.amount_usd <= 0 && d.amount_iqd <= 0);
            list.innerHTML += `
                <div class="card ${isCleared ? 'cleared' : ''}">
                    <div class="flex-row">
                        <div><b>👤 ${d.merchant_name}</b> <br> <small>${new Date(d.created_at).toLocaleString('ku-IQ')}</small></div>
                        <div style="text-align:left;">
                            <span style="color:green; font-weight:bold;">$${d.amount_usd.toFixed(2)}</span><br>
                            <small>${d.amount_iqd.toLocaleString()} IQD</small>
                        </div>
                    </div>
                    <p style="font-size:13px; color:#555;">📦 ${d.items_details}</p>
                    <div class="flex-row no-print">
                        <button class="btn btn-print" onclick="printInvoice('${d.id}')">🖨️ پرنت</button>
                        <button class="btn btn-pay" onclick="openModal('${d.id}', '${d.merchant_name}', ${d.dollar_rate_at_time || 1500})">💰 پارەدان</button>
                    </div>
                </div>
            `;
        });
    }

    function openModal(id, name, rate) {
        activeId = id;
        activeRate = rate;
        document.getElementById('mName').innerText = "پارەدان بۆ: " + name;
        document.getElementById('payModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('payModal').style.display = 'none'; }

    async function processPayment() {
        const pUSD = parseFloat(document.getElementById('pUSD').value) || 0;
        const pIQD = parseFloat(document.getElementById('pIQD').value) || 0;

        const { data: debt } = await _supabase.from('merchant_debts').select('*').eq('id', activeId).single();

        // لێرە فۆرمۆڵەی سکاندنەوەی دینار بۆ دۆلار جێگیر کراوە
        // بڕی دینارە دراوەکە دابەشی نرخی دۆلاری کاتی وەسڵەکە دەکەین
        const convertedUSD = pIQD / activeRate;
        const totalDeductionUSD = pUSD + convertedUSD;

        const newUSD = debt.amount_usd - totalDeductionUSD;
        const newIQD = debt.amount_iqd; // لێرە قەرزەکە تەنها لە دۆلارەکە کەمدەکەینەوە وەک داوات کردبوو

        await _supabase.from('merchant_debts').update({
            amount_usd: newUSD < 0 ? 0 : newUSD,
            amount_iqd: 0 // ئەگەر دینارەکەی دابوو، قەرزەکە لێرە ساف دەبێت
        }).eq('id', activeId);

        alert("پارەکە وەرگیرا و لە دۆلارەکەی شکایەوە ✅");
        closeModal();
        loadDebts();
    }

    async function printInvoice(id) {
        const { data: d } = await _supabase.from('merchant_debts').select('*').eq('id', id).single();
        const area = document.getElementById('printArea');
        const details = document.getElementById('printDetails');
        
        details.innerHTML = `
            <p><b>بازرگان:</b> ${d.merchant_name}</p>
            <p><b>بەرواری وەسڵ:</b> ${new Date(d.created_at).toLocaleString('ku-IQ')}</p>
            <p><b>وردەکاری:</b> ${d.items_details}</p>
            <p><b>نرخی دۆلار لە کاتی کڕین:</b> 100$ = ${d.dollar_rate_at_time || 1500} دینار</p>
            <hr>
            <h3>ماوەی قەرز: $${d.amount_usd.toFixed(2)}</h3>
        `;
        
        area.style.display = 'block';
        window.print();
        area.style.display = 'none';
    }

    window.onload = loadDebts;
</script>
</body>
</html>
