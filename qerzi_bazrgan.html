<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابی بازرگانەکان - Rebin POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --danger: #e74c3c; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        .header { background: var(--main); color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        
        /* بەشی کۆی گشتی */
        .summary-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .box { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .box h3 { margin: 0; font-size: 14px; color: #666; }
        .box p { margin: 10px 0 0; font-size: 22px; font-weight: bold; }

        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-right: 8px solid var(--danger); }
        .card.cleared { border-right-color: var(--success); opacity: 0.8; }
        
        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-pay { background: var(--success); color: white; }
        .btn-view { background: var(--main); color: white; }
        
        /* مۆدێڵ (پەنجەرەی پۆپ ئەپ) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 500px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0;">📊 بەڕێوەبردنی قەرزی بازرگانەکان</h2>
    <p id="currentTime"></p>
</div>

<div class="container">
    <div class="summary-boxes">
        <div class="box"><h3 style="color:var(--danger)">کۆی گشتی قەرز ($)</h3><p id="totalUSD">0.00</p></div>
        <div class="box"><h3 style="color:var(--danger)">کۆی گشتی قەرز (د.ع)</h3><p id="totalIQD">0</p></div>
    </div>

    <div id="debtList">بار دەکرێت...</div>
</div>

<div id="payModal" class="modal">
    <div class="modal-content">
        <h3>💰 واسڵکردنی پارە</h3>
        <p id="payMerchantName" style="font-weight:bold;"></p>
        <label>بڕی دۆلار:</label>
        <input type="number" id="payUSD" value="0">
        <label>بڕی دینار:</label>
        <input type="number" id="payIQD" value="0">
        <button class="btn btn-pay" onclick="submitPayment()" style="width:100%; padding:15px;">تۆمارکردن ✅</button>
        <button class="btn" onclick="closeModal()" style="width:100%; margin-top:10px;">داخستن</button>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let selectedMerchant = "";
    let selectedDebtId = "";

    async function loadData() {
        // ١. هێنانەوەی هەموو قەرزەکان
        const { data: debts } = await _supabase.from('merchant_debts').select('*').order('created_at', { ascending: false });
        
        // ٢. هێنانەوەی هەموو پارەدانەکان بۆ حسابکردنی ماوە
        const { data: payments } = await _supabase.from('merchant_payments').select('*');

        const listDiv = document.getElementById('debtList');
        listDiv.innerHTML = "";
        
        let gTotalUSD = 0, gTotalIQD = 0;

        debts.forEach(debt => {
            // حسابکردنی کۆی پارە دراوەکان بۆ ئەم بازرگانە (لێرەدا وەک نموونە سادەمان کردووە)
            const isCleared = (debt.amount_usd <= 0 && debt.amount_iqd <= 0);
            
            gTotalUSD += debt.amount_usd;
            gTotalIQD += debt.amount_iqd;

            listDiv.innerHTML += `
                <div class="card ${isCleared ? 'cleared' : ''}">
                    <div class="flex-row">
                        <div>
                            <span style="font-size:12px; color:#888;">${new Date(debt.created_at).toLocaleDateString('ku-IQ')}</span>
                            <div style="font-size:18px; font-weight:bold;">👤 ${debt.merchant_name}</div>
                        </div>
                        <div style="text-align:left">
                            <div style="color:var(--danger); font-weight:bold;">$${debt.amount_usd}</div>
                            <div style="color:#2980b9; font-weight:bold;">${debt.amount_iqd.toLocaleString()} IQD</div>
                        </div>
                    </div>
                    <div style="margin-top:10px; background:#f9f9f9; padding:8px; border-radius:6px; font-size:13px;">
                        📦 <b>وردەکاری:</b> ${debt.items_details}
                    </div>
                    <div class="flex-row" style="margin-top:15px;">
                        <span style="font-weight:bold; color:${isCleared ? 'green' : 'orange'}">
                            ${isCleared ? '✅ ساف بووە' : '⏳ ماوە'}
                        </span>
                        <div>
                            <button class="btn btn-pay" onclick="openPayModal('${debt.id}', '${debt.merchant_name}')">پارەدان 💸</button>
                        </div>
                    </div>
                </div>
            `;
        });

        document.getElementById('totalUSD').innerText = `$${gTotalUSD.toFixed(2)}`;
        document.getElementById('totalIQD').innerText = `${gTotalIQD.toLocaleString()} IQD`;
    }

    function openPayModal(id, name) {
        selectedDebtId = id;
        selectedMerchant = name;
        document.getElementById('payMerchantName').innerText = name;
        document.getElementById('payModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('payModal').style.display = 'none';
    }

    async function submitPayment() {
        const pUSD = parseFloat(document.getElementById('payUSD').value) || 0;
        const pIQD = parseFloat(document.getElementById('payIQD').value) || 0;

        if(pUSD === 0 && pIQD === 0) return alert("بڕی پارە دیاری بکە");

        // ١. تۆمارکردنی وەسڵی پارەدانەکە
        await _supabase.from('merchant_payments').insert([{
            merchant_name: selectedMerchant,
            amount_paid_usd: pUSD,
            amount_paid_iqd: pIQD
        }]);

        // ٢. کەمکردنەوەی بڕەکە لە خشتەی قەرزەکان (Update)
        // تێبینی: ئەمە قەرزەکە ناهێڵێت، تەنها بڕەکەی کەم دەکاتەوە
        const { data: currentDebt } = await _supabase.from('merchant_debts').select('*').eq('id', selectedDebtId).single();
        
        await _supabase.from('merchant_debts').update({
            amount_usd: currentDebt.amount_usd - pUSD,
            amount_iqd: currentDebt.amount_iqd - pIQD
        }).eq('id', selectedDebtId);

        alert("پارەکە وەرگیرا و لە قەرزەکە کەمکرایەوە ✅");
        closeModal();
        loadData();
    }

    window.onload = loadData;
</script>
</body>
</html>
