<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قەرزی بازرگان - Rebin POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; direction: rtl; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 15px; }
        .debt-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-right: 5px solid #e74c3c; }
        .merchant-name { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .amounts { display: flex; gap: 20px; margin-top: 10px; font-size: 16px; }
        .usd { color: #27ae60; font-weight: bold; }
        .iqd { color: #2980b9; font-weight: bold; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        button { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .pay-btn { background: #2ecc71; color: white; }
        .view-btn { background: #f1c40f; color: #333; }
        .back-btn { background: #95a5a6; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 14px; }
        
        /* Modal Style بۆ وەسڵەکە */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 15% auto; padding: 20px; width: 85%; border-radius: 10px; }
    </style>
</head>
<body>

<div class="header">
    <a href="dashboard.html" class="back-btn">گەڕانەوە</a>
    <h2 style="margin:0;">💸 قەرزی بازرگانەکان</h2>
    <div></div>
</div>

<div class="container" id="debtList">
    <p style="text-align:center;">خەریکە قەرزەکان بار دەکرێن...</p>
</div>

<div id="receiptModal" class="modal">
    <div class="modal-content">
        <h3 id="mName">ناوی بازرگان</h3>
        <hr>
        <div id="itemsList"></div>
        <hr>
        <button onclick="closeModal()" style="background:#e74c3c; color:white; width:100%;">داخستن</button>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // کلیلە ئەسڵییەکەت لێرە دابنێ
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function fetchDebts() {
        const { data, error } = await _supabase
            .from('merchant_debts')
            .select('*')
            .order('created_at', { ascending: false });

        const listDiv = document.getElementById('debtList');
        listDiv.innerHTML = '';

        if (data.length === 0) {
            listDiv.innerHTML = '<p style="text-align:center;">هیچ قەرزێک نییە</p>';
            return;
        }

        data.forEach(debt => {
            listDiv.innerHTML += `
                <div class="debt-card">
                    <div class="merchant-name">${debt.merchant_name}</div>
                    <div class="amounts">
                        <span class="usd">$${debt.amount_usd}</span>
                        <span class="iqd">${debt.amount_iqd.toLocaleString()} IQD</span>
                    </div>
                    <div class="actions">
                        <button class="pay-btn" onclick="payDebt('${debt.id}')">پارەدان ✅</button>
                        <button class="view-btn" onclick="viewReceipt('${debt.merchant_name}', '${debt.items_details}')">بینینی وەسڵ 📄</button>
                    </div>
                </div>
            `;
        });
    }

    async function payDebt(id) {
        if (confirm("ئایا دڵنیایت کە ئەم قەرزە درایەوە و دەسڕێتەوە؟")) {
            const { error } = await _supabase.from('merchant_debts').delete().eq('id', id);
            if (!error) fetchDebts();
        }
    }

    function viewReceipt(name, details) {
        document.getElementById('mName').innerText = "وەسڵی: " + name;
        document.getElementById('itemsList').innerText = details || "هیچ وردەکارییەک نییە";
        document.getElementById('receiptModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('receiptModal').style.display = 'none';
    }

    window.onload = fetchDebts;
</script>

</body>
</html>
