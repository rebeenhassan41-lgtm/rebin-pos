<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قەرزی بازرگان - Rebin POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; direction: rtl; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 15px; max-width: 800px; margin: auto; }
        .debt-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-right: 6px solid #e74c3c; position: relative; }
        .merchant-name { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .amounts { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; font-size: 16px; }
        .usd { color: #27ae60; font-weight: bold; }
        .iqd { color: #2980b9; font-weight: bold; }
        .details { font-size: 13px; color: #666; margin-top: 8px; font-style: italic; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .pay-btn { background: #2ecc71; color: white; flex: 1; }
        .pay-btn:hover { background: #27ae60; }
        .back-btn { background: #e67e22; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 14px; }
        .no-data { text-align: center; padding: 50px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="header">
    <a href="dashboard.html" class="back-btn">🏠 داشبۆرد</a>
    <h2 style="margin:0;">💸 قەرزی بازرگانەکان</h2>
    <div></div>
</div>

<div class="container" id="debtList">
    <div class="no-data">خەریکە قەرزەکان بار دەکرێن...</div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function fetchDebts() {
        const listDiv = document.getElementById('debtList');
        
        try {
            const { data, error } = await _supabase
                .from('merchant_debts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!data || data.length === 0) {
                listDiv.innerHTML = '<div class="no-data">📭 هیچ قەرزێکی تۆمارکراو نییە</div>';
                return;
            }

            listDiv.innerHTML = '';
            data.forEach(debt => {
                const date = new Date(debt.created_at).toLocaleDateString('ku-IQ');
                listDiv.innerHTML += `
                    <div class="debt-card">
                        <div style="font-size: 12px; color: #999; float: left;">${date}</div>
                        <div class="merchant-name">👤 ${debt.merchant_name || 'بازرگانی بێناو'}</div>
                        <div class="amounts">
                            ${debt.amount_usd > 0 ? `<span class="usd">بڕی دۆلار: $${debt.amount_usd.toLocaleString()}</span>` : ''}
                            ${debt.amount_iqd > 0 ? `<span class="iqd">بڕی دینار: ${debt.amount_iqd.toLocaleString()} IQD</span>` : ''}
                        </div>
                        <div class="details">📝 وەسڵ: ${debt.items_details || 'بێ وردەکاری'}</div>
                        <div class="actions">
                            <button class="pay-btn" onclick="payDebt('${debt.id}')">پارەدان و سڕینەوە ✅</button>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            listDiv.innerHTML = `<div class="no-data" style="color:red;">هەڵە لە بارکردن: ${err.message}</div>`;
        }
    }

    async function payDebt(id) {
        if (confirm("ئایا دڵنیایت کە ئەم قەرزە دراوەتەوە؟")) {
            const { error } = await _supabase
                .from('merchant_debts')
                .delete()
                .eq('id', id);

            if (error) {
                alert("کێشە لە سڕینەوە: " + error.message);
            } else {
                fetchDebts();
            }
        }
    }

    // بانگکردنی فەنکشنەکە لەکاتی کردنەوەی لاپەڕە
    window.onload = fetchDebts;
</script>

</body>
</html>
