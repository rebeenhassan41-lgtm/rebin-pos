<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕاپۆرتی گشتی ڕێبین</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --success: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { font-size: 14px; margin: 0; color: #666; }
        .amount { font-size: 20px; font-weight: bold; display: block; margin-top: 10px; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th { background: var(--p); color: white; padding: 12px; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        .buy-row { border-right: 5px solid var(--danger); }
        .sell-row { border-right: 5px solid var(--success); }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <h2>📊 ڕاپۆرتی چالاکییەکان</h2>
        <select id="timeRange" onchange="loadData()" style="padding:10px; border-radius:8px;">
            <option value="today">ئەمڕۆ</option>
            <option value="week">ئەم هەفتەیە</option>
            <option value="month">ئەم مانگە</option>
            <option value="year">ئەم ساڵ</option>
        </select>
    </div>

    <div class="grid-stats">
        <div class="card"><h3>کۆی فرۆشتن</h3><span class="amount" id="tSales" style="color:var(--success);">0 $</span></div>
        <div class="card"><h3>کۆی کڕین</h3><span class="amount" id="tPurchases" style="color:var(--danger);">0 $</span></div>
        <div class="card"><h3>قازانجی فرۆشتن</h3><span class="amount" id="tProfit" style="color:blue;">0 $</span></div>
        <div class="card"><h3>داهاتی پوختە</h3><span class="amount" id="tNet" style="color:var(--p);">0 $</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>بەروار</th>
                <th>جۆر</th>
                <th>کڕیار/بازرگان</th>
                <th>کۆی گشتی ($)</th>
                <th>شێواز</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function loadData() {
        const range = document.getElementById('timeRange').value;
        let start = new Date();
        if(range === 'today') start.setHours(0,0,0,0);
        else if(range === 'week') start.setDate(start.getDate() - 7);
        else if(range === 'month') start.setMonth(start.getMonth() - 1);
        else start.setFullYear(start.getFullYear() - 1);

        const { data: sales } = await _supabase.from('sales').select('*').gte('created_at', start.toISOString());
        const { data: buys } = await _supabase.from('purchases').select('*').gte('created_at', start.toISOString());

        let ts = 0, tp = 0, tprof = 0;
        let html = "";

        if(buys) buys.forEach(b => {
            tp += (b.total_price_usd || 0);
            html += `<tr class="buy-row"><td>${new Date(b.created_at).toLocaleDateString()}</td><td>📥 کڕین</td><td>${b.supplier_name}</td><td>${b.total_price_usd}</td><td>${b.is_debt ? 'قەرز' : 'نەقد'}</td></tr>`;
        });

        if(sales) sales.forEach(s => {
            ts += s.total_usd;
            tprof += (s.total_usd - s.total_cost_usd);
            html += `<tr class="sell-row"><td>${new Date(s.created_at).toLocaleDateString()}</td><td>💰 فرۆشتن</td><td>${s.customer_name}</td><td>${s.total_usd}</td><td>${s.pay_method === 'Cash' ? 'نەقد' : 'قەرز'}</td></tr>`;
        });

        document.getElementById('tSales').innerText = ts.toFixed(2) + " $";
        document.getElementById('tPurchases').innerText = tp.toFixed(2) + " $";
        document.getElementById('tProfit').innerText = tprof.toFixed(2) + " $";
        document.getElementById('tNet').innerText = (ts - tp).toFixed(2) + " $";
        document.getElementById('tbody').innerHTML = html;
    }
    window.onload = loadData;
</script>
</body>
</html>
