<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R - ڕاپۆرتی گشتی</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #1a1a2e; --accent: #3498db; --success: #2ecc71; 
            --danger: #e74c3c; --warning: #f1c40f; --bg: #f0f2f5; 
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; direction: rtl; color: #333; padding-bottom: 40px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 15px; }
        
        /* Header */
        .dashboard-header { 
            background: var(--primary); color: white; padding: 25px; 
            border-radius: 20px; margin-bottom: 25px; display: flex; 
            justify-content: space-between; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Stats Cards */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 12px; margin-bottom: 25px; 
        }
        .stat-card { 
            background: white; padding: 18px; border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-bottom: 4px solid; 
            text-align: center; transition: 0.3s;
        }
        .stat-card:active { transform: scale(0.98); }
        .stat-card h3 { margin: 0; font-size: 12px; color: #7f8c8d; margin-bottom: 8px; }
        .stat-card .value { font-size: 20px; font-weight: bold; color: var(--primary); }

        /* Controls */
        .filter-section { 
            background: white; padding: 20px; border-radius: 20px; 
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .date-inputs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .date-inputs input, .date-inputs select { 
            flex: 1; padding: 12px; border: 1px solid #ddd; 
            border-radius: 10px; font-family: inherit; font-size: 14px;
        }

        /* Tabs */
        .tabs-container { 
            overflow-x: auto; white-space: nowrap; padding-bottom: 10px; 
            display: flex; gap: 8px; margin-bottom: 15px;
        }
        .tab { 
            padding: 10px 20px; background: #e0e6ed; border-radius: 10px; 
            border: none; font-weight: bold; cursor: pointer; color: #555;
        }
        .tab.active { background: var(--accent); color: white; }

        /* Table */
        .table-wrap { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f8f9fa; padding: 15px; border-bottom: 2px solid #eee; text-align: center; }
        td { padding: 15px; text-align: center; border-bottom: 1px solid #f9f9f9; }
        
        .type-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .sales-bg { background: #dcfce7; color: #166534; }
        .buy-bg { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-header">
        <div>
            <h2 style="margin:0;">📊 ڕاپۆرتی گشتی</h2>
            <small id="branchInfo" style="opacity: 0.8;">لقی ...</small>
        </div>
        <a href="dashboard.html" style="color:white; font-size:24px; text-decoration:none;">🏠</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card" style="border-color: var(--success);">
            <h3>کۆی فرۆشتن</h3>
            <span class="value" id="tSales">0 $</span>
        </div>
        <div class="stat-card" style="border-color: var(--accent);">
            <h3>قازانج</h3>
            <span class="value" id="tProfit" style="color:var(--success)">0 $</span>
        </div>
        <div class="stat-card" style="border-color: var(--danger);">
            <h3>قەرزی بازرگان</h3>
            <span class="value" id="tPayable">0 $</span>
        </div>
        <div class="stat-card" style="border-color: var(--warning);">
            <h3>قەرزی کڕیار</h3>
            <span class="value" id="tReceivable">0 $</span>
        </div>
    </div>

    <div class="filter-section">
        <div class="date-inputs">
            <input type="date" id="dateFrom">
            <input type="date" id="dateTo">
            <button onclick="loadData()" style="background:var(--primary); color:white; border:none; padding:12px 25px; border-radius:10px; cursor:pointer; font-weight:bold;">نوێکردنەوە</button>
        </div>
        
        <div class="tabs-container">
            <button class="tab active" onclick="setTab('all', this)">هەموو</button>
            <button class="tab" onclick="setTab('sales', this)">فرۆشتن</button>
            <button class="tab" onclick="setTab('purchases', this)">کڕین</button>
            <button class="tab" onclick="setTab('debts_in', this)">قەرزی کڕیار</button>
            <button class="tab" onclick="setTab('debts_out', this)">قەرزی بازرگان</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>بەروار</th>
                    <th>جۆر</th>
                    <th>ناو</th>
                    <th>بڕ ($)</th>
                </tr>
            </thead>
            <tbody id="reportTbody">
                <tr><td colspan="4">خەریکە داتا دەخوێنرێتەوە...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentTab = 'all';
    const branchId = localStorage.getItem("userBranchId");

    // ڕێکخستنی بەروار بۆ ئەمڕۆ
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateFrom').value = today;
    document.getElementById('dateTo').value = today;

    function setTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadData();
    }

    async function loadData() {
        document.getElementById('branchInfo').innerText = "لق: " + (localStorage.getItem("userBranchName") || "گشتی");
        const from = document.getElementById('dateFrom').value + "T00:00:00";
        const to = document.getElementById('dateTo').value + "T23:59:59";
        
        let ts=0, tprof=0, tRec=0, tPay=0;
        let dataList = [];

        // هێنانی فرۆشتنەکان
        let qSales = _supabase.from('sales').select('*').gte('created_at', from).lte('created_at', to);
        if(branchId) qSales = qSales.eq('branch_id', branchId);
        const { data: sales } = await qSales;
        
        if(sales) sales.forEach(s => {
            ts += s.total_usd;
            tprof += (s.total_usd - (s.cost_usd || 0));
            if(currentTab==='all' || currentTab==='sales') {
                dataList.push({date: s.created_at, type: 'فرۆشتن', name: s.customer_name, amt: s.total_usd, cls: 'sales-bg'});
            }
        });

        // هێنانی قەرزی کڕیار (تەنها ئەوانەی ساف نەکراون)
        let qReceiv = _supabase.from('qerzi_kriar').select('*').gt('amount', 0);
        if(branchId) qReceiv = qReceiv.eq('branch_id', branchId);
        const { data: dIn } = await qReceiv;
        if(dIn) dIn.forEach(q => {
            tRec += q.amount;
            if(currentTab==='debts_in') dataList.push({date: q.created_at, type: 'قەرز', name: q.name, amt: q.amount, cls: 'buy-bg'});
        });

        // هێنانی قەرزی بازرگان
        let qPayab = _supabase.from('merchant_debts').select('*').gt('amount_usd', 0);
        if(branchId) qPayab = qPayab.eq('branch_id', branchId);
        const { data: dOut } = await qPayab;
        if(dOut) dOut.forEach(q => {
            tPay += q.amount_usd;
            if(currentTab==='debts_out') dataList.push({date: q.created_at, type: 'بازرگان', name: q.merchant_name, amt: q.amount_usd, cls: 'buy-bg'});
        });

        // نیشاندان لە خشتە
        dataList.sort((a,b) => new Date(b.date) - new Date(a.date));
        let html = dataList.map(d => `
            <tr>
                <td style="font-size:11px;">${new Date(d.date).toLocaleDateString('ku-IQ')}</td>
                <td><span class="type-badge ${d.cls}">${d.type}</span></td>
                <td>${d.name}</td>
                <td style="font-weight:bold;">$${d.amt.toFixed(2)}</td>
            </tr>
        `).join('');

        document.getElementById('tSales').innerText = "$" + ts.toLocaleString();
        document.getElementById('tProfit').innerText = "$" + tprof.toLocaleString();
        document.getElementById('tReceivable').innerText = "$" + tRec.toLocaleString();
        document.getElementById('tPayable').innerText = "$" + tPay.toLocaleString();
        document.getElementById('reportTbody').innerHTML = html || "<tr><td colspan='4'>هیچ داتایەک نییە</td></tr>";
    }

    window.onload = loadData;
</script>
</body>
</html>
