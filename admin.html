<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ڕێبین سیستم | بەڕێوەبەری گشتی</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #e67e22; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        .sidebar { width: 250px; background: var(--main); height: 100vh; position: fixed; color: white; padding: 20px; box-sizing: border-box; }
        .main-content { margin-right: 250px; padding: 25px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--main); border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { background: var(--success); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border-bottom: 1px solid #eee; padding: 15px; text-align: center; }
        th { background: #f8f9fa; color: #666; font-size: 13px; }
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; color: white; }
        .role-Admin { background: #e74c3c; }
        .role-Staff { background: #3498db; }
        .logout-btn { background: #e74c3c; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="margin-top:0;">ڕێبین سیستم</h2>
    <p id="adminNameDisplay" style="font-size: 14px; color: #bdc3c7;">بەخێربێیت</p>
    <hr style="border: 0; border-top: 1px solid #3e4f5f; margin: 20px 0;">
    <ul style="list-style: none; padding: 0;">
        <li style="padding: 12px 0;">📊 داشبۆردی گشتی</li>
        <li style="padding: 12px 0; color: var(--accent);">🏢 بەڕێوەبردنی لقەکان</li>
        <li style="padding: 12px 0;">👤 بەکارهێنەران</li>
    </ul>
    <button class="logout-btn" onclick="logout()">چوونە دەرەوە</button>
</div>

<div class="main-content">
    <div class="card">
        <div class="section-title">🏢 زیادکردنی لقی نوێ</div>
        <div class="form-grid">
            <div>
                <label>ناوی لق</label>
                <input type="text" id="branchName" placeholder="بۆ نموونە: لقی سلێمانی">
            </div>
            <div style="align-self: flex-end;">
                <button onclick="addBranch()">تۆمارکردنی لق ✅</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">👤 دروستکردنی ئەکاونتی نوێ</div>
        <div class="form-grid">
            <div>
                <label>ناوی تەواو</label>
                <input type="text" id="fName">
            </div>
            <div>
                <label>ناوی بەکارهێنەر (Login Name)</label>
                <input type="text" id="uName">
            </div>
            <div>
                <label>کۆدی نهێنی</label>
                <input type="password" id="uPass">
            </div>
            <div>
                <label>لق</label>
                <select id="uBranch"></select>
            </div>
            <div>
                <label>پێرمشن (دەسەڵات)</label>
                <select id="uRole">
                    <option value="Admin">Admin (هەموو دەسەڵاتێک)</option>
                    <option value="Staff" selected>Staff (کاشێر)</option>
                </select>
            </div>
        </div>
        <button style="background: var(--main); margin-top: 10px;" onclick="addUser()">دروستکردنی بەکارهێنەر 👤</button>
    </div>

    <div class="card">
        <div class="section-title">📋 لیستی بەکارهێنەرانی سیستم</div>
        <table id="userTable">
            <thead>
                <tr>
                    <th>ناوی تەواو</th>
                    <th>بەکارهێنەر</th>
                    <th>لق</th>
                    <th>دەسەڵات</th>
                    <th>کردار</th>
                </tr>
            </thead>
            <tbody id="userListBody"></tbody>
        </table>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // پشکنینی چوونە ژوورەوە
    window.onload = function() {
        if (localStorage.getItem("rebeenAuth") !== "true") {
            window.location.replace("index.html"); // ئەگەر لۆگین نەبوو بگەڕێوە
        }
        document.getElementById('adminNameDisplay').innerText = "بەخێربێیت: " + localStorage.getItem("userName");
        loadBranches();
        loadUsers();
    };

    async function addBranch() {
        const name = document.getElementById('branchName').value;
        if(!name) return;
        const { error } = await _supabase.from('branches').insert([{ branch_name: name }]);
        if(!error) { alert("لقەکە زیاد کرا ✅"); loadBranches(); }
    }

    async function loadBranches() {
        const { data } = await _supabase.from('branches').select('*');
        const select = document.getElementById('uBranch');
        select.innerHTML = data.map(b => `<option value="${b.id}">${b.branch_name}</option>`).join('');
    }

    async function addUser() {
        const f = document.getElementById('fName').value;
        const u = document.getElementById('uName').value;
        const p = document.getElementById('uPass').value;
        const b = document.getElementById('uBranch').value;
        const r = document.getElementById('uRole').value;

        if(!f || !u || !p) return alert("تکایە هەموو خانەکان پڕ بکەرەوە");

        const { error } = await _supabase.from('system_users').insert([{
            full_name: f, username: u, password: p, branch_id: b, position: r
        }]);
        
        if(!error) { alert("بەکارهێنەر دروست کرا ✅"); loadUsers(); }
        else { console.error(error); alert("هەڵە ڕوویدا!"); }
    }

    async function loadUsers() {
        const { data } = await _supabase.from('system_users').select('*, branches(branch_name)');
        document.getElementById('userListBody').innerHTML = data.map(u => `
            <tr>
                <td>${u.full_name}</td>
                <td>${u.username}</td>
                <td>${u.branches ? u.branches.branch_name : 'بێ لق'}</td>
                <td><span class="badge role-${u.position}">${u.position}</span></td>
                <td><button onclick="deleteUser(${u.id})" style="background:none; color:red; border:none; cursor:pointer;">🗑️ سڕینەوە</button></td>
            </tr>
        `).join('');
    }

    async function deleteUser(id) {
        if(confirm("دڵنیای لە سڕینەوەی ئەم بەکارهێنەرە؟")) {
            await _supabase.from('system_users').delete().eq('id', id);
            loadUsers();
        }
    }

    function logout() {
        localStorage.clear();
        window.location.replace("index.html");
    }
</script>
</body>
</html>
