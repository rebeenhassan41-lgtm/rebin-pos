<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R - چوونە ژوورەوە</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #4260e7; --s: #3498db; --bg: #f4f7fe; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; direction: rtl; overflow: hidden;
        }
        .login-box { 
            background: #ffffff; 
            padding: 45px 35px; 
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            width: 88%; max-width: 380px; text-align: center;
            border-bottom: 8px solid var(--p);
        }
        .logo-circle {
            width: 75px; height: 75px; background: linear-gradient(135deg, var(--p), var(--s));
            border-radius: 22px; margin: 0 auto 25px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 38px; font-weight: bold;
            box-shadow: 0 10px 20px rgba(66, 96, 231, 0.2);
        }
        h2 { color: #2c3e50; margin-bottom: 30px; font-size: 24px; font-weight: 800; }
        input { 
            width: 100%; padding: 16px; margin-bottom: 15px; 
            border: 2px solid #edf2f7; border-radius: 15px; 
            box-sizing: border-box; font-size: 16px; 
            text-align: center; outline: none; transition: 0.3s;
            background: #f8fafc;
        }
        input:focus { border-color: var(--p); background: #fff; box-shadow: 0 0 0 4px rgba(66, 96, 231, 0.1); }
        button { 
            width: 100%; padding: 16px; background: var(--p); 
            color: white; border: none; border-radius: 15px; 
            cursor: pointer; font-size: 18px; font-weight: bold; 
            transition: 0.3s; margin-top: 10px;
            box-shadow: 0 4px 12px rgba(66, 96, 231, 0.3);
        }
        button:active { transform: scale(0.98); }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        #errorMsg { 
            color: #e53e3e; font-size: 14px; margin-bottom: 15px; 
            display: none; background: #fff5f5; padding: 12px; 
            border-radius: 12px; border: 1px solid #feb2b2;
            font-weight: bold;
        }
        .footer-text { margin-top: 25px; color: #a0aec0; font-size: 13px; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-circle">R</div>
        <h2>بەخێربێیتەوە</h2>
        <div id="errorMsg"></div>
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر" autocomplete="off">
        <input type="password" id="password" placeholder="پاسوۆرد">
        <button id="loginBtn" onclick="login()">چوونە ژوورەوە</button>
        <div class="footer-text">وەشانی 2.0 - سیستەمی بەڕێوەبردن</div>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');

        if (!u || !p) {
            showError("تکایە خانەکان پڕ بکەرەوە");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = "خەریکی پشکنینە... ⏳";
        err.style.display = "none";

        try {
            // هێنانی زانیاری بەکارهێنەر و لقەکەی
            const { data, error } = await _supabase
                .from('system_users')
                .select('*, branches(id, branch_name)')
                .eq('username', u)
                .eq('password', p)
                .maybeSingle();

            if (error || !data) {
                showError("ناوی بەکارهێنەر یان پاسوۆرد هەڵەیە! ❌");
                btn.disabled = false;
                btn.innerText = "چوونە ژوورەوە";
                return;
            }

            // پاشەکەوتکردنی زانیارییەکان
            localStorage.setItem("rebeenAuth", "true");
            localStorage.setItem("userName", data.full_name || u);
            localStorage.setItem("userPosition", data.position || "Staff");

            // چارەسەری کێشەی null لە branch_id (ئەگەر نەبوو وەک 1 پاشەکەوتی دەکات)
            const bId = data.branch_id ? data.branch_id.toString() : "1";
            localStorage.setItem("userBranchId", bId);
            
            // دیاریکردنی ناوی لق
            const bName = (data.branches && data.branches.branch_name) ? data.branches.branch_name : "لقی سەرەکی";
            localStorage.setItem("userBranchName", bName);
            
            // چوون بەرەو داشبۆرد
            window.location.replace("dashboard.html");

        } catch (e) {
            console.error(e);
            showError("پەیوەندی ئینتەرنێت جێگیر نییە");
            btn.disabled = false;
            btn.innerText = "چوونە ژوورەوە";
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.innerText = msg;
        err.style.display = "block";
    }

    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
