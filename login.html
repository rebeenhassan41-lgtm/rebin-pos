<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونە ژوورەوە - ڕێبین سیستم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; direction: rtl; }
        .login-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        h2 { color: var(--p); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; background: var(--s); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #ccc; }
        #errorMsg { color: #e74c3c; font-size: 14px; margin-bottom: 10px; display: none; background: #fdf2f2; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>چوونە ژوورەوە 🔐</h2>
        <div id="errorMsg"></div>
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر" autocomplete="off">
        <input type="password" id="password" placeholder="پاسوۆرد">
        <button id="loginBtn" onclick="login()">چوونە ژوورەوە</button>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');

        if (!u || !p) {
            err.innerText = "تکایە هەموو خانەکان پڕ بکەرەوە";
            err.style.display = "block";
            return;
        }

        btn.disabled = true;
        btn.innerText = "خەریکی پشکنینە...";
        err.style.display = "none";

        try {
            // گەڕان لە داتابەیس و هێنانی زانیاری لقەکان لە هەمان کاتدا
            const { data, error } = await _supabase
                .from('system_users')
                .select(`
                    *,
                    branches ( id, branch_name )
                `)
                .eq('username', u)
                .eq('password', p)
                .single(); // تەنها یەک دانەمان دەوێت

            if (error || !data) {
                err.innerText = "ناوی بەکارهێنەر یان پاسوۆرد هەڵەیە! ❌";
                err.style.display = "block";
                btn.disabled = false;
                btn.innerText = "چوونە ژوورەوە";
                return;
            }

            // سەرکەوتوو بوو - پاشەکەوتکردنی زانیارییەکان لە مێمۆری براوزەر
            localStorage.setItem("rebeenAuth", "true");
            localStorage.setItem("userName", data.full_name);
            localStorage.setItem("userPosition", data.position);
            
            // خەزنکردنی ID و ناوی لق بۆ پەنجەرەی فرۆشتن
            localStorage.setItem("userBranchId", data.branch_id);
            const bName = data.branches ? data.branches.branch_name : "لقی نەناسراو";
            localStorage.setItem("userBranchName", bName);
            
            // گواستنەوە بۆ داشبۆرد
            window.location.replace("dashboard.html");

        } catch (e) {
            console.error(e);
            err.innerText = "هەڵەیەک ڕوویدا: " + (e.message || "پەیوەندی دروست نەبوو");
            err.style.display = "block";
            btn.disabled = false;
            btn.innerText = "چوونە ژوورەوە";
        }
    }

    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
