<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونە ژوورەوە - ڕێبین سیستم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; direction: rtl; }
        .login-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; }
        .error { color: #e74c3c; font-size: 14px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>چوونە ژوورەوە 🔐</h2>
        <div id="errorMsg" class="error">ناو یان پاسوۆرد هەڵەیە!</div>
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر" autofocus>
        <input type="password" id="password" placeholder="پاسوۆرد">
        <button id="loginBtn" onclick="login()">چوونە ژوورەوە</button>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function login() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');

        if(!user || !pass) return;

        btn.disabled = true;
        btn.innerText = "خەریکی پشکنینە...";
        err.style.display = "none";

        // پشکنین لە داتابەیس
        const { data, error } = await _supabase
            .from('system_users')
            .select('*')
            .eq('username', user)
            .eq('password', pass)
            .maybeSingle();

        if (data) {
            // ئەگەر ناو و پاسوۆرد ڕاست بوو
            localStorage.setItem("rebeenAuth", "true");
            localStorage.setItem("userName", data.full_name);
            localStorage.setItem("userPosition", data.position);
            
            window.location.replace("dashboard.html");
        } else {
            // ئەگەر هەڵە بوو
            err.style.display = "block";
            btn.disabled = false;
            btn.innerText = "چوونە ژوورەوە";
        }
    }

    // کارکردن بە دوگمەی Enter
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
