<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R - چوونە ژوورەوە</title>
    <meta name="apple-mobile-web-app-title" content="R">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/192/r.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/r.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #4260e7; --s: #3498db; --bg: #f8f9fa; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            direction: rtl; 
            overflow: hidden;
        }
        .login-box { 
            background: rgb(29, 25, 25); 
            padding: 40px 30px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            width: 85%; 
            max-width: 360px; 
            text-align: center; 
            border-bottom: 6px solid var(--s);
        }
        .logo-circle {
            width: 80px; height: 80px; background: var(--p);
            border-radius: 50%; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 40px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }
        h2 { color: var(--p); margin-bottom: 25px; font-size: 22px; }
        input { 
            width: 100%; padding: 15px; margin-bottom: 15px; 
            border: 2px solid #eee; border-radius: 12px; 
            box-sizing: border-box; font-size: 16px; 
            text-align: center; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--s); background: #f0f7ff; }
        button { 
            width: 100%; padding: 15px; background: var(--s); 
            color: white; border: none; border-radius: 12px; 
            cursor: pointer; font-size: 18px; font-weight: bold; 
            transition: 0.3s; margin-top: 10px;
        }
        button:active { transform: scale(0.96); opacity: 0.9; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #errorMsg { 
            color: #e74c3c; font-size: 14px; margin-bottom: 15px; 
            display: none; background: #fdf2f2; padding: 10px; 
            border-radius: 10px; border: 1px solid #fab1a0;
        }
        .footer-text { margin-top: 20px; color: #bdc3c7; font-size: 12px; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-circle">R</div>
        <h2>RS</h2>
        <div id="errorMsg"></div>
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر" autocomplete="off">
        <input type="password" id="password" placeholder="پاسوۆرد">
        <button id="loginBtn" onclick="login()">چوونە ژوورەوە</button>
        <div class="footer-text">وەشانی 2026 - گەشەپێدراوە بۆ مۆبایل</div>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');

        if (!u || !p) {
            showError("تکایە هەموو خانەکان پڕ بکەرەوە");
            return;
        }

        btn.disabled = true;
        btn.innerText = "خەریکی پشکنینە...";
        err.style.display = "none";

        try {
            // هێنانی یوزەر و بەستنەوەی بە خشتەی لقەکان (Branches)
            const { data, error } = await _supabase
                .from('system_users')
                .select('*, branches(id, branch_name)')
                .eq('username', u)
                .eq('password', p)
                .maybeSingle();

            if (error || !data) {
                showError("ناوی بەکارهێنەر یان پاسوۆرد هەڵەیە! ❌");
                btn.disabled = false;
                btn.innerText = "چوونە ژوورەوە";
                return;
            }

            // پاشەکەوتکردنی زانیارییەکان بۆ ئەوەی هەموو لاپەڕەکان بیناسنەوە
            localStorage.setItem("rebeenAuth", "true");
            localStorage.setItem("userName", data.full_name);
            localStorage.setItem("userPosition", data.position);
            localStorage.setItem("userBranchId", data.branch_id);
            
            const bName = data.branches ? data.branches.branch_name : "لقی سەرەکی";
            localStorage.setItem("userBranchName", bName);
            
            // چوون بەرەو داشبۆرد
            window.location.replace("dashboard.html");

        } catch (e) {
            showError("پەیوەندی ئینتەرنێت جێگیر نییە");
            btn.disabled = false;
            btn.innerText = "چوونە ژوورەوە";
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.innerText = msg;
        err.style.display = "block";
    }

    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
