<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونە ژوورەوە - Rebin POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 90%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #219150; }
        #msg { margin-top: 15px; font-size: 14px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🔑 چوونە ژوورەوە</h2>
    <input type="text" id="email" placeholder="ناوی بەکارهێنەر">
    <input type="password" id="password" placeholder="وشەی نهێنی">
    <button onclick="login()">چوونە ژوورەوە</button>
    <div id="msg"></div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // --- چاکسازی بۆ گیتھەب و مۆبایل ---
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        // ئەگەر لەڕێی Logout هاتبێت یان نیشانەی لۆگ ئاوتی پێبێت
        if (window.location.hash === "#logout" || urlParams.has('logout')) {
            localStorage.clear();
            sessionStorage.clear();
            document.cookie = "rebeenAuth=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            // پاککردنەوەی ناونیشانی لاپەڕەکە
            history.replaceState(null, null, window.location.pathname);
            return;
        }

        // ئەگەر پێشتر داخل بوو، یەکسەر بڕۆ بۆ داشبۆرد
        if (localStorage.getItem("rebeenAuth") === "true") {
            window.location.replace("dashboard.html");
        }
    };

    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');

        if (!email || !password) {
            msg.style.color = "orange";
            msg.innerText = "تکایە خانەکان پڕ بکەرەوە";
            return;
        }

        msg.style.color = "blue";
        msg.innerText = "خەریکە دەپشکنرێت...";

        if ((email === "rebeen" && password === "12345678") || (email === "a" && password === "a")) {
            setAuthAndRedirect();
            return; 
        }

        try {
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                msg.style.color = "red";
                msg.innerText = "هەڵە: " + error.message;
            } else {
                setAuthAndRedirect();
            }
        } catch (e) {
            msg.style.color = "red";
            msg.innerText = "کێشەی پەیوەندی هەیە";
        }
    }

    function setAuthAndRedirect() {
        localStorage.setItem("rebeenAuth", "true");
        document.cookie = "rebeenAuth=true; path=/; max-age=86400; SameSite=Lax";
        
        document.getElementById('msg').style.color = "green";
        document.getElementById('msg').innerText = "سەرکەوتوو بوو! گواستنەوە...";
        
        setTimeout(() => {
            window.location.replace("dashboard.html");
        }, 300);
    }
</script>
</body>
</html>
