<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونە ژوورەوە</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #4260e7; --bg: #f4f7fe; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; direction: rtl; }
        .login-box { background: white; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .logo { width: 70px; height: 70px; background: var(--p); color: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; margin: 0 auto 25px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #edf2f7; border-radius: 12px; text-align: center; outline: none; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--p); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">R</div>
        <h2 style="margin-bottom: 25px; color: #2d3748;">بەخێربێیتەوە</h2>
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر">
        <input type="password" id="password" placeholder="پاسوۆرد">
        <button id="loginBtn" onclick="login()">چوونە ژوورەوە</button>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');

        if(!u || !p) return alert("تکایە خانەکان پڕ بکەرەوە");
        btn.disabled = true; btn.innerText = "پشکنین...";

        try {
            const { data, error } = await _supabase
                .from('system_users')
                .select('*')
                .eq('username', u)
                .eq('password', p)
                .maybeSingle();

            if (error || !data) {
                alert("ناو یان پاسۆرد هەڵەیە!");
                btn.disabled = false; btn.innerText = "چوونە ژوورەوە";
                return;
            }

            // زانیارییەکان پاشەکەوت بکە بۆ ئەوەی داشبۆردەکەت نەیانفەوتێنێت
            localStorage.setItem("rebeenAuth", "true");
            localStorage.setItem("userPosition", data.position);
            localStorage.setItem("userName", data.full_name);
            localStorage.setItem("userBranchId", data.branch_id);

            // ئەمە گرنگترین دێڕە: ڕاستەوخۆ دەتباتەوە بۆ ئەو داشبۆردەی کە پێشتر هەتبوو
            window.location.href = "dashboard.html";

        } catch (err) {
            alert("هەڵە لە پەیوەندی داتابەیس!");
            btn.disabled = false; btn.innerText = "چوونە ژوورەوە";
        }
    }
</script>
</body>
</html>
