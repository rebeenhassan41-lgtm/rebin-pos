<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R - بەڕێوەبردن</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #4260e7; --bg: #f4f7fe; --success: #27ae60; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; direction: rtl; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #edf2f7; border-radius: 10px; text-align: center; outline: none; }
        button { width: 100%; padding: 12px; background: var(--p); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #adminPanel { display: none; max-width: 800px; width: 100%; }
        .admin-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: right; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

    <div id="loginSection" class="card">
        <h2 style="color:var(--p)">چوونە ژوورەوە</h2>
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر">
        <input type="password" id="password" placeholder="پاسوۆرد">
        <button id="loginBtn" onclick="login()">چوونە ژوورەوە</button>
    </div>

    <div id="adminPanel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>⚙️ کۆنتڕۆڵی ڕێبین سیستم</h2>
            <button onclick="logout()" style="width:auto; background:#e74c3c;">Logout</button>
        </div>

        <div class="admin-card">
            <b style="color:var(--p)">🏢 زیادکردنی لق</b>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="branchName" placeholder="ناوی لق">
                <button onclick="addBranch()" style="width:120px; background:var(--success);">تۆمارکردن</button>
            </div>
        </div>

        <div class="admin-card">
            <b style="color:var(--p)">👤 دروستکردنی بەکارهێنەر</b>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                <input type="text" id="fName" placeholder="ناوی تەواو">
                <input type="text" id="uName" placeholder="ناوی لۆگین">
                <input type="password" id="uPass" placeholder="پاسوۆرد">
                <select id="uBranch"></select>
                <select id="uRole">
                    <option value="Staff">کاشێر (Staff)</option>
                    <option value="Admin">بەڕێوەبەر (Admin)</option>
                </select>
                <button onclick="addUser()" style="grid-column: span 2;">دروستکردن ✅</button>
            </div>
        </div>

        <div class="admin-card">
            <b style="color:var(--p)">📋 لیستی بەکارهێنەران</b>
            <table>
                <thead><tr><th>ناو</th><th>لق</th><th>پلە</th><th>سڕینەوە</th></tr></thead>
                <tbody id="userListBody"></tbody>
            </table>
        </div>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        
        const { data, error } = await _supabase.from('system_users').select('*, branches(branch_name)').eq('username', u).eq('password', p).maybeSingle();

        if (error || !data) {
            alert("ناوی بەکارهێنەر یان پاسۆرد هەڵەیە!");
            return;
        }

        localStorage.setItem("rebeenAuth", "true");
        localStorage.setItem("userPosition", data.position);
        localStorage.setItem("userName", data.full_name);

        if (data.position === "Admin") {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('adminPanel').style.display = "block";
            loadBranches();
            loadUsers();
        } else {
            window.location.replace("dashboard.html");
        }
    }

    async function addBranch() {
        const name = document.getElementById('branchName').value;
        await _supabase.from('branches').insert([{ branch_name: name }]);
        document.getElementById('branchName').value = "";
        loadBranches();
    }

    async function loadBranches() {
        const { data } = await _supabase.from('branches').select('*');
        document.getElementById('uBranch').innerHTML = data.map(b => `<option value="${b.id}">${b.branch_name}</option>`).join('');
    }

    async function addUser() {
        const f = document.getElementById('fName').value;
        const u = document.getElementById('uName').value;
        const p = document.getElementById('uPass').value;
        const b = document.getElementById('uBranch').value;
        const r = document.getElementById('uRole').value;
        
        await _supabase.from('system_users').insert([{ full_name: f, username: u, password: p, branch_id: b, position: r }]);
        alert("دروست کرا!");
        loadUsers();
    }

    async function loadUsers() {
        const { data } = await _supabase.from('system_users').select('*, branches(branch_name)');
        document.getElementById('userListBody').innerHTML = data.map(u => `
            <tr>
                <td>${u.full_name}</td>
                <td>${u.branches ? u.branches.branch_name : 'بێ لق'}</td>
                <td>${u.position}</td>
                <td><button onclick="deleteUser(${u.id})" style="background:none; color:red; width:auto; margin:0;">🗑️</button></td>
            </tr>
        `).join('');
    }

    async function deleteUser(id) {
        if(confirm("دڵنیای؟")) {
            await _supabase.from('system_users').delete().eq('id', id);
            loadUsers();
        }
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
