<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونە ژوورەوە - Rebin POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        #msg { margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🔑 چوونە ژوورەوە</h2>
    <input type="email" id="email" placeholder="ئیمەیڵ">
    <input type="password" id="password" placeholder="وشەی نهێنی">
    <button onclick="login()">چوونە ژوورەوە</button>
    <div id="msg"></div>
</div>

<script>
    // کۆنفیگۆریشن
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');

        msg.style.color = "blue";
        msg.innerText = "خەریکە دەپشکنرێت...";

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
            msg.style.color = "red";
            // لێرەدا هەڵەکەمان پێ دەڵێت
            if (error.message.includes("Email not confirmed")) {
                msg.innerText = "هەڵە: دەبێت لە ناو Supabase بژاردەی Confirm Email بکوژێنیتەوە!";
            } else if (error.message.includes("Invalid login credentials")) {
                msg.innerText = "هەڵە: ئیمەیڵ یان پاسۆردەکە هەڵەیە.";
            } else {
                msg.innerText = "کێشە: " + error.message;
            }
        } else {
            msg.style.color = "green";
            msg.innerText = "سەرکەوتوو بوو! خەریکە دەچێتە ژوورەوە...";
            setTimeout(() => { window.location.href = "index.html"; }, 1000);
        }
    }
</script>
</body>
</html>
