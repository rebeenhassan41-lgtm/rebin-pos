<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بەڕێوەبردنی لقەکان - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 20px; }
        #status { padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: bold; }
        .error { background: #ffcccc; color: #cc0000; border: 1px solid #cc0000; }
        .success { background: #d1f7d1; color: #006600; border: 1px solid #006600; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: var(--s); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<div id="status">خەریکە پەیوەندی دەپشکنرێت...</div>

<div class="card">
    <h2>🏢 دروستکردنی لقی نوێ</h2>
    <input type="text" id="branchName" placeholder="ناوی لق">
    <input type="text" id="branchLoc" placeholder="ناونیشان">
    <button onclick="addBranch()">تۆمارکردنی لق ✅</button>
</div>

<div class="card">
    <h2>📍 لیست و دۆخی لقەکان</h2>
    <div id="branchList">هیچ لقێک نییە</div>
</div>

<script>
    // لێرە لینک و کلیلەکان بە وردی دابنێ
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function init() {
        const stat = document.getElementById('status');
        try {
            // تاقیکردنەوەی خوێندنەوە لە خشتەکە
            const { data, error } = await _supabase.from('branches').select('*');
            
            if (error) {
                stat.innerText = "❌ هەڵە لە داتابەیس: " + error.message;
                stat.className = "status error";
                console.error(error);
            } else {
                stat.innerText = "✅ پەیوەندی جێگیرە! خشتەی لقەکان دۆزرایەوە.";
                stat.className = "status success";
                renderBranches(data);
            }
        } catch (err) {
            stat.innerText = "❌ پەیوەندی ئینتەرنێت نییە یان کێشەی کۆد هەیە.";
            stat.className = "status error";
        }
    }

    async function addBranch() {
        const name = document.getElementById('branchName').value.trim();
        const loc = document.getElementById('branchLoc').value.trim();
        
        if(!name) return alert("تکایە ناو بنووسە");

        const { data, error } = await _supabase.from('branches').insert([{ branch_name: name, location: loc }]).select();
        
        if(error) {
            alert("هەڵە لە پاشەکەوتکردن: " + error.message);
        } else {
            alert("لقەکە بە سەرکەوتوویی دروستکرا ✅");
            location.reload();
        }
    }

    function renderBranches(data) {
        const list = document.getElementById('branchList');
        if(data.length === 0) {
            list.innerHTML = "تا ئێستا هیچ لقێک دروست نەکراوە.";
            return;
        }
        list.innerHTML = data.map(b => `<div style="padding:10px; border-bottom:1px solid #eee;">📍 ${b.branch_name} - ${b.location || 'بێ ناونیشان'}</div>`).join('');
    }

    window.onload = init;
</script>
</body>
</html>
