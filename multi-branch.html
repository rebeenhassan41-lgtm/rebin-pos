<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R - بەڕێوەبردنی لقەکان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f0f2f5; --success: #2ecc71; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 500px; margin: auto; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h3 { margin-top: 0; color: var(--primary); font-size: 18px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: var(--accent); }
        button { width: 100%; padding: 15px; background: var(--success); color: white; border: none; cursor: pointer; border-radius: 12px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:active { transform: scale(0.95); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { font-size: 13px; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .branch-item { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 5px solid var(--accent); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0;">🏢 بەڕێوەبردنی لقەکان</h2>
    </div>

    <div id="statusMsg" class="status">خەریکە پشکنین دەکرێت...</div>

    <div class="box">
        <h3>➕ زیادکردنی لقی نوێ</h3>
        <input type="text" id="bName" placeholder="ناوی لق بنووسە (بۆ نموونە: لقی هەولێر)">
        <button id="saveBtn" onclick="saveBranch()">تۆمارکردنی لق ✅</button>
    </div>

    <div class="box">
        <h3>📍 لقە تۆمارکراوەکان</h3>
        <div id="bList">بار دەکرێت...</div>
    </div>

    <a href="dashboard.html" class="back-link">🏠 گەڕانەوە بۆ داشبۆرد</a>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function checkStatus() {
        const msg = document.getElementById('statusMsg');
        try {
            // پشکنینی هەبوونی خشتەکە و بارکردنی داتا
            const { data, error } = await _supabase
                .from('branches')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                msg.className = "status err";
                msg.innerText = "❌ کێشە لە داتابەیس: " + error.message;
                console.error("Supabase Error:", error);
            } else {
                msg.className = "status ok";
                msg.innerText = `✅ پەیوەندی چالاکە (${data.length} لق هەیە)`;
                showList(data);
            }
        } catch (e) {
            msg.className = "status err";
            msg.innerText = "❌ هەڵەی چاوەڕواننەکراو: " + e.message;
        }
    }

    async function saveBranch() {
        const nameInput = document.getElementById('bName');
        const name = nameInput.value.trim();
        const btn = document.getElementById('saveBtn');

        if (!name) return alert("تکایە ناوی لق بنووسە");

        btn.disabled = true;
        btn.innerText = "خەریکی تۆمارکردنە...";

        const { error } = await _supabase
            .from('branches')
            .insert([{ branch_name: name }]);
        
        btn.disabled = false;
        btn.innerText = "تۆمارکردنی لق ✅";

        if (error) {
            alert("⚠️ هەڵە لە تۆمارکردن: " + error.message);
            console.error(error);
        } else {
            nameInput.value = "";
            checkStatus(); // نوێکردنەوەی لیستەکە
        }
    }

    function showList(data) {
        const list = document.getElementById('bList');
        if (!data || data.length === 0) {
            list.innerHTML = "<p style='color:#888; text-align:center;'>هیچ لقێک تۆمار نەکراوە</p>";
            return;
        }
        list.innerHTML = data.map(b => `
            <div class="branch-item">
                <div>
                    <strong style="display:block;">📍 ${b.branch_name}</strong>
                    <small style="color:#94a3b8; font-size:11px;">کۆد: ${b.id}</small>
                </div>
                <span style="color:#2ecc71;">✓</span>
            </div>
        `).join('');
    }

    // دەستپێکردن
    checkStatus();
</script>
</body>
</html>
