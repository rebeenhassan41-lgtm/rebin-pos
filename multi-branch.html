<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بەڕێوەبردنی لقەکان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; direction: rtl; padding: 20px; background: #f0f2f5; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2ecc71; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        #debug { margin-top: 20px; padding: 10px; border-radius: 5px; font-size: 13px; white-space: pre-wrap; direction: ltr; text-align: left; }
        .err { background: #ffdada; color: #a30000; border: 1px solid #a30000; }
        .ok { background: #d4ffd4; color: #006400; border: 1px solid #006400; }
    </style>
</head>
<body>

<div class="box">
    <h3>🏢 دروستکردنی لق</h3>
    <div id="debug">خەریکە پەیوەندی دەپشکنرێت...</div>
    <hr>
    <input type="text" id="bName" placeholder="ناوی لق بنووسە...">
    <button onclick="saveBranch()">تۆمارکردن</button>
    <div id="bList" style="margin-top: 15px;"></div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function check() {
        const dbg = document.getElementById('debug');
        try {
            // پشکنینی خشتەی لقەکان
            const { data, error } = await _supabase.from('branches').select('*');
            if (error) {
                dbg.className = "err";
                dbg.innerText = "Error: " + error.message + "\nCode: " + error.code;
            } else {
                dbg.className = "ok";
                dbg.innerText = "✅ پەیوەندی داتابەیس دروستە.\nژمارەی لقەکان: " + data.length;
                showList(data);
            }
        } catch (e) {
            dbg.className = "err";
            dbg.innerText = "Connection Failed: " + e.message;
        }
    }

    async function saveBranch() {
        const name = document.getElementById('bName').value;
        if(!name) return alert("ناو بنووسە");

        const { error } = await _supabase.from('branches').insert([{ branch_name: name }]);
        if(error) {
            alert("هەڵە لە کاتی پاشەکەوتکردن: " + error.message);
        } else {
            alert("سەرکەوتوو بوو ✅");
            check();
        }
    }

    function showList(data) {
        const list = document.getElementById('bList');
        list.innerHTML = data.map(b => `<div style="padding:5px; border-bottom:1px solid #eee;">📍 ${b.branch_name}</div>`).join('');
    }

    check();
</script>
</body>
</html>
