<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بەڕێوەبردنی لقەکان - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid var(--s); padding-bottom: 10px; color: var(--p); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: var(--s); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .balance-box { background: #e8f4fd; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="grid">
    <div class="card">
        <h2>🏢 دروستکردنی لقی نوێ</h2>
        <input type="text" id="branchName" placeholder="ناوی لق (بۆ نموونە: لقی هەولێر)">
        <input type="text" id="branchLoc" placeholder="ناونیشان">
        <button onclick="addBranch()">تۆمارکردنی لق</button>
        
        <div id="branchList" style="margin-top:20px;">
            </div>
    </div>

    <div class="card">
        <h2>💸 ئاڵوگۆڕی پارە لە نێوان لقەکان</h2>
        <label>لە لقی:</label>
        <select id="fromBranch"></select>
        
        <label>بۆ لقی:</label>
        <select id="toBranch"></select>
        
        <label>بڕی پارە ($):</label>
        <input type="number" id="transferAmount" placeholder="0.00">
        
        <button onclick="transferMoney()" style="background:#27ae60;">ئەنجامدانی گواستنەوە 🔃</button>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function addBranch() {
        const name = document.getElementById('branchName').value;
        const loc = document.getElementById('branchLoc').value;
        
        const { data, error } = await _supabase.from('branches').insert([{ branch_name: name, location: loc }]).select();
        if(!error) {
            // دروستکردنی سندوق بۆ لقە نوێیەکە
            await _supabase.from('cashboxes').insert([{ branch_id: data[0].id, balance_usd: 0 }]);
            alert("لقەکە دروستکرا ✅");
            location.reload();
        }
    }

    async function loadBranches() {
        const { data } = await _supabase.from('branches').select('*');
        const list = document.getElementById('branchList');
        const fromSel = document.getElementById('fromBranch');
        const toSel = document.getElementById('toBranch');

        data.forEach(b => {
            list.innerHTML += `<div class="balance-box">📍 ${b.branch_name}</div>`;
            fromSel.innerHTML += `<option value="${b.id}">${b.branch_name}</option>`;
            toSel.innerHTML += `<option value="${b.id}">${b.branch_name}</option>`;
        });
    }

    async function transferMoney() {
        const from = document.getElementById('fromBranch').value;
        const to = document.getElementById('toBranch').value;
        const amount = parseFloat(document.getElementById('transferAmount').value);

        if(from === to) return alert("ناتوانیت بۆ هەمان لق پارە بنێریت!");

        // ١. کەمکردنەوە لە سندوقی یەکەم
        const { data: box1 } = await _supabase.from('cashboxes').select('*').eq('branch_id', from).single();
        if(box1.balance_usd < amount) return alert("پارەی پێویست لەم سندوقەدا نییە!");

        await _supabase.from('cashboxes').update({ balance_usd: box1.balance_usd - amount }).eq('branch_id', from);

        // ٢. زیادکردن بۆ سندوقی دووەم
        const { data: box2 } = await _supabase.from('cashboxes').select('*').eq('branch_id', to).single();
        await _supabase.from('cashboxes').update({ balance_usd: box2.balance_usd + amount }).eq('branch_id', to);

        // ٣. تۆمارکردنی گواستنەوەکە
        await _supabase.from('money_transfers').insert([{ from_branch_id: from, to_branch_id: to, amount_usd: amount }]);

        alert("گواستنەوەکە سەرکەوتوو بوو 🚀");
    }

    window.onload = loadBranches;
</script>
</body>
</html>
