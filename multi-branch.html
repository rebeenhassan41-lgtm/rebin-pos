<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R - بەڕێوەبردنی لقەکان</title>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f0f2f5; --success: #2ecc71; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 500px; margin: auto; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 15px; background: var(--success); color: white; border: none; cursor: pointer; border-radius: 12px; font-weight: bold; font-size: 16px; }
        button:disabled { background: #ccc; }
        .status { font-size: 13px; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; border: 1px solid transparent; }
        .err { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .ok { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .branch-item { background: #f8fafc; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-right: 5px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h2 style="margin:0;">🏢 بەڕێوەبردنی لقەکان</h2></div>
    <div id="statusMsg" class="status">⏳ خەریکە دەبەسترێتەوە بە سێرڤەر...</div>

    <div class="box">
        <input type="text" id="bName" placeholder="ناوی لق بنووسە...">
        <button id="saveBtn" onclick="saveBranch()">تۆمارکردن ✅</button>
    </div>

    <div class="box">
        <h3>📍 لقەکان</h3>
        <div id="bList">بار دەکرێت...</div>
    </div>
    <a href="dashboard.html" style="display:block; text-align:center; color:#666; text-decoration:none; margin-top:20px;">🏠 گەڕانەوە</a>
</div>

<script>
    // زانیارییەکانی Supabase
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    
    let _supabase;

    async function init() {
        const msg = document.getElementById('statusMsg');
        
        // ١. پشکنینی ئەوەی ئایا کتێبخانەی Supabase بار بووە؟
        if (typeof supabase === 'undefined') {
            msg.className = "status err";
            msg.innerText = "❌ هەڵە: کتێبخانەی داتابەیس بار نەبووە. تکایە ئینتەرنێتەکەت بپشکنە.";
            return;
        }

        _supabase = supabase.createClient(SB_URL, SB_KEY);
        loadData();
    }

    async function loadData() {
        const msg = document.getElementById('statusMsg');
        const list = document.getElementById('bList');
        
        try {
            const { data, error } = await _supabase.from('branches').select('*').order('id');

            if (error) {
                msg.className = "status err";
                msg.innerText = "❌ هەڵەی داتابەیس: " + error.message;
            } else {
                msg.className = "status ok";
                msg.innerText = "✅ پەیوەندی چالاکە - " + data.length + " لق هەیە";
                list.innerHTML = data.length ? data.map(b => `
                    <div class="branch-item">
                        <span>📍 ${b.branch_name}</span>
                        <small>ID: ${b.id}</small>
                    </div>
                `).join('') : "هیچ لقێک نییە";
            }
        } catch (e) {
            msg.className = "status err";
            msg.innerText = "❌ کێشەی پەیوەندی (Network Error)";
        }
    }

    async function saveBranch() {
        const nameInput = document.getElementById('bName');
        const name = nameInput.value.trim();
        if(!name) return;

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;

        const { error } = await _supabase.from('branches').insert([{ branch_name: name }]);

        if(error) {
            alert("هەڵە: " + error.message);
        } else {
            nameInput.value = "";
            loadData();
        }
        btn.disabled = false;
    }

    // دەستپێکردن بە دڵنیاییەوە
    window.addEventListener('load', init);
</script>
</body>
</html>
