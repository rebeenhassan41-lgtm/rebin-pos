<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فایلی بازرگانان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #1abc9c; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; margin: 0; padding: 20px; }
        .wrapper { display: grid; grid-template-columns: 350px 1fr; gap: 20px; max-width: 1300px; margin: auto; }
        
        /* ستایلی فۆرم */
        .card-form { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: fit-content; position: sticky; top: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-add { width: 100%; padding: 12px; background: var(--s); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* ستایلی لیستی فایلەکان */
        .card-list { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .sup-card { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 10px;
            transition: 0.3s; cursor: pointer; background: #fff;
        }
        .sup-card:hover { border-color: var(--s); background: #f0fdfa; transform: scale(1.01); }
        .sup-name { font-weight: bold; color: var(--p); font-size: 16px; margin: 0; }
        .sup-meta { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
        .badge { background: #e8f8f5; color: #1abc9c; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        
        .search-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; outline: none; }
        .search-input:focus { border-color: var(--s); }
    </style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center; max-width:1300px; margin: 0 auto 20px auto;">
    <h2 style="color:var(--p); margin:0;">🗂️ بەڕێوەبردنی فایلەکانی بازرگان</h2>
    <button onclick="location.href='dashboard.html'" style="padding:8px 15px; border-radius:8px; border:1px solid #ddd; background:white; cursor:pointer;">🏠 سەرەکی</button>
</div>

<div class="wrapper">
    <div class="card-form">
        <h3 style="margin-top:0; font-size:18px;">📝 ناساندنی نوێ</h3>
        <input type="text" id="name" placeholder="ناوی بازرگان">
        <input type="text" id="phone" placeholder="ژمارەی مۆبایل">
        <select id="cat">
            <option value="گشتی">پیشە: گشتی</option>
            <option value="خۆراک">خۆراک</option>
            <option value="پێڵاو">پێڵاو</option>
            <option value="کارەبایی">کارەبایی</option>
        </select>
        <input type="text" id="addr" placeholder="ناونیشان (شار/گەڕەک)">
        <button class="btn-add" onclick="saveSup()">تۆمارکردن لە فایل ✅</button>
    </div>

    <div class="card-list">
        <input type="text" class="search-input" id="search" placeholder="🔍 گەڕان بەپێی ناو یان مۆبایل..." oninput="doSearch()">
        <div id="list">
            <p style="text-align:center; color:#999;">خەریکە بار دەکرێت...</p>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let sups = [];

    async function getSups() {
        const { data } = await _supabase.from('suppliers').select('*').order('created_at', { ascending: false });
        sups = data || [];
        showList(sups);
    }

    function showList(data) {
        const div = document.getElementById('list');
        div.innerHTML = data.map(s => `
            <div class="sup-card" onclick="location.href='suppliers.html?name=${encodeURIComponent(s.name)}'">
                <div>
                    <p class="sup-name">${s.name}</p>
                    <p class="sup-meta">📞 ${s.phone || '---'} | 📍 ${s.address || '---'}</p>
                </div>
                <span class="badge">${s.category || 'گشتی'}</span>
            </div>
        `).join('');
    }

    function doSearch() {
        const txt = document.getElementById('search').value.toLowerCase();
        const filtered = sups.filter(s => s.name.toLowerCase().includes(txt) || (s.phone && s.phone.includes(txt)));
        showList(filtered);
    }

    async function saveSup() {
        const n = document.getElementById('name').value;
        const p = document.getElementById('phone').value;
        const c = document.getElementById('cat').value;
        const a = document.getElementById('addr').value;

        if(!n) return alert("ناو پێویستە!");

        const { error } = await _supabase.from('suppliers').insert([{ name: n, phone: p, category: c, address: a }]);
        if(!error) {
            alert("سەرکەوتوو بوو");
            location.reload();
        }
    }

    window.onload = getSups;
</script>
</body>
</html>
