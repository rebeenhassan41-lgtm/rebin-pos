<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R - کەشف حیسابی بازرگانان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #1a1a2e; --s: #3498db; --bg: #f0f2f5; --danger: #e74c3c; --success: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); direction: rtl; margin: 0; padding: 10px; }
        
        .top-bar { max-width: 1200px; margin: 0 auto 15px auto; display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .layout { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 300px 1fr; gap: 15px; }
        @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

        /* Sidebar */
        .sidebar { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: calc(100vh - 120px); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: var(--p); color: white; font-weight: bold; text-align: center; }
        .sup-list { overflow-y: auto; flex: 1; }
        .sup-item { padding: 15px; border-bottom: 1px solid #f1f1f1; cursor: pointer; transition: 0.2s; border-right: 4px solid transparent; }
        .sup-item:hover { background: #f8faff; border-right-color: var(--s); }
        .sup-item.active { background: #eef6ff; border-right-color: var(--s); font-weight: bold; }

        /* Main Content */
        .main-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-height: 70vh; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat-box { padding: 15px; background: #f8f9fa; border-radius: 12px; text-align: center; border: 1px solid #eee; }
        .stat-box small { font-size: 11px; color: #777; display: block; margin-bottom: 5px; }
        .stat-box b { font-size: 18px; color: var(--p); }

        /* Invoice Styling */
        .invoice-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 10px;
            border-right: 5px solid #ddd;
        }
        .inv-debt { border-right-color: var(--danger); background: #fffcfc; }
        .inv-paid { border-right-color: var(--success); background: #fcfdfc; }
        
        .badge { padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; }
        .bg-red { background: #fee2e2; color: #dc2626; }
        .bg-green { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="top-bar">
    <h3 style="margin:0; color:var(--p);">📋 حیساباتی بازرگانان</h3>
    <a href="dashboard.html" style="text-decoration:none; background:var(--p); color:white; padding:8px 15px; border-radius:8px; font-size:14px;">🏠 سەرەتا</a>
</div>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-header">لیستی بازرگانان</div>
        <div id="supplierList" class="sup-list">
            <p style="text-align:center; padding:20px; color:#999;">بار دەکرێت...</p>
        </div>
    </div>

    <div class="main-card" id="detailsArea">
        <div style="text-align:center; margin-top:100px; color:#aaa;">
            <img src="https://cdn-icons-png.flaticon.com/512/1532/1532624.png" width="80" style="opacity: 0.2;">
            <h3>تکایە ناوی بازرگانێک هەڵبژێرە</h3>
            <p>بۆ بینینی وردەکاری کڕین و قەرزەکان</p>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // ١. هێنانی بازرگانەکان
    async function loadSuppliers() {
        const { data: suppliers } = await _supabase.from('suppliers').select('*').order('name');
        const listDiv = document.getElementById('supplierList');
        
        if (suppliers) {
            listDiv.innerHTML = suppliers.map(s => `
                <div class="sup-item" onclick="viewProfile('${s.name}', this)">
                    <div style="font-weight:bold;">${s.name}</div>
                    <div style="font-size:11px; color:#888;">📦 ${s.category || 'گشتی'}</div>
                </div>
            `).join('');
        }
    }

    // ٢. بینینی کەشف حیساب
    async function viewProfile(name, element) {
        document.querySelectorAll('.sup-item').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        const detailsArea = document.getElementById('detailsArea');
        detailsArea.innerHTML = "<p style='text-align:center;'>خەریکە زانیارییەکان دەهێنرێن...</p>";

        // هێنانی وەسڵەکانی کڕین بۆ ئەم بازرگانە
        const { data: purchases } = await _supabase.from('purchases')
            .select('*')
            .eq('supplier_name', name)
            .order('created_at', { ascending: false });

        let totalAmount = 0;
        let debtAmount = 0;

        let itemsHtml = purchases.map(p => {
            totalAmount += p.total_price_usd;
            if(p.is_debt) debtAmount += p.total_price_usd;

            return `
                <div class="invoice-item ${p.is_debt ? 'inv-debt' : 'inv-paid'}">
                    <div>
                        <div style="font-weight:bold;">${p.item_name}</div>
                        <small style="color:#888;">📅 ${new Date(p.created_at).toLocaleDateString('ku-IQ')}</small>
                    </div>
                    <div style="text-align:left;">
                        <div style="font-weight:bold; color:var(--p);">$${p.total_price_usd.toLocaleString()}</div>
                        <span class="badge ${p.is_debt ? 'bg-red' : 'bg-green'}">${p.is_debt ? 'قەرز' : 'نەقد'}</span>
                    </div>
                </div>
            `;
        }).join('');

        detailsArea.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #f1f1f1; padding-bottom:10px;">
                <h2 style="margin:0; color:var(--s);">${name}</h2>
                <button onclick="window.print()" style="background:#eee; border:none; padding:5px 12px; border-radius:5px; cursor:pointer;">🖨️ چاپ</button>
            </div>

            <div class="stats-grid">
                <div class="stat-box"><small>کۆی گشتی کڕین</small><b>$${totalAmount.toLocaleString()}</b></div>
                <div class="stat-box" style="border-bottom-color:var(--danger)"><small>قەرزی ماوە</small><b style="color:var(--danger)">$${debtAmount.toLocaleString()}</b></div>
                <div class="stat-box"><small>ژمارەی وەسڵەکان</small><b>${purchases.length}</b></div>
            </div>

            <h4 style="margin-bottom:10px; color:#555;">📜 مێژووی مامەڵەکان</h4>
            <div style="max-height: 450px; overflow-y: auto; padding-left:5px;">
                ${itemsHtml || '<p style="text-align:center; padding:40px; color:#999;">هیچ وەسڵێک نەدۆزرایەوە.</p>'}
            </div>
        `;
    }

    window.onload = loadSuppliers;
</script>
</body>
</html>
