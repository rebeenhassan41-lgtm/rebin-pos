<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>R</title>
    <meta name="apple-mobile-web-app-title" content="R">
    <meta name="application-name" content="R">
    
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/192/r.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/r.png">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #1abc9c; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 15px; margin: 0; }
        .wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1300px; margin: auto; }
        .card-form { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: fit-content; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-family: inherit; font-size: 15px; }
        .btn-add { width: 100%; padding: 14px; background: var(--s); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .card-list { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .sup-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 10px; cursor: pointer; background: #fff; transition: 0.2s; }
        .sup-card:active { transform: scale(0.98); }
        .badge { background: #e8f8f5; color: #1abc9c; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .branch-info { font-size: 12px; color: #7f8c8d; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center; max-width:1300px; margin: 0 auto 20px auto; padding: 0 5px;">
    <div>
        <h2 style="margin:0;">🗂️ ناساندنی بازرگان</h2>
        <small id="branchNameDisplay" class="branch-info">بار دەکرێت...</small>
    </div>
    <button onclick="location.href='dashboard.html'" style="padding:10px 15px; border-radius:8px; border:1px solid #ddd; background:white; cursor:pointer; font-weight:bold;">🏠 سەرەکی</button>
</div>

<div class="wrapper">
    <div class="card-form">
        <h3 style="margin-top:0; border-bottom: 2px solid var(--s); padding-bottom: 10px;">📝 فایلی نوێ</h3>
        <input type="text" id="name" placeholder="ناوی بازرگان">
        <input type="text" id="phone" placeholder="ژمارەی مۆبایل">
        <select id="cat">
            <option value="گشتی">پیشە: گشتی</option>
            <option value="خۆراک">خۆراک</option>
            <option value="دەرمان">دەرمان</option>
            <option value="کۆسمێتیک">کۆسمێتیک</option>
        </select>
        <input type="text" id="addr" placeholder="ناونیشان">
        <button id="saveBtn" class="btn-add" onclick="saveSup()">تۆمارکردن ✅</button>
    </div>

    <div class="card-list">
        <input type="text" id="search" placeholder="🔍 گەڕان لەناو بازرگانان..." oninput="doSearch()" style="width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd;">
        <div id="list">خەریکە بار دەکرێت...</div>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // زانیاری لق
    const userBranchId = localStorage.getItem("userBranchId");
    const userBranchName = localStorage.getItem("userBranchName") || "نادیار";
    document.getElementById('branchNameDisplay').innerText = "لق: " + userBranchName;

    let sups = [];

    async function getSups() {
        if(!userBranchId) return;
        // تەنها ئەو بازرگانانە بهێنە کە هی ئەم لقەن
        const { data } = await _supabase
            .from('suppliers')
            .select('*')
            .eq('branch_id', userBranchId)
            .order('name');
        sups = data || [];
        showList(sups);
    }

    function showList(data) {
        const div = document.getElementById('list');
        if(data.length === 0) {
            div.innerHTML = "<p style='text-align:center; color:#999;'>هیچ فایلێک نییە</p>";
            return;
        }
        div.innerHTML = data.map(s => `
            <div class="sup-card" onclick="location.href='supplier_details.html?id=${s.id}'">
                <div>
                    <strong>${s.name}</strong>
                    <div style="font-size:12px; color:#666;">📞 ${s.phone || '---'}</div>
                </div>
                <span class="badge">${s.category || 'گشتی'}</span>
            </div>
        `).join('');
    }

    function doSearch() {
        const txt = document.getElementById('search').value.toLowerCase();
        showList(sups.filter(s => s.name.toLowerCase().includes(txt)));
    }

    async function saveSup() {
        const name = document.getElementById('name').value.trim();
        const btn = document.getElementById('saveBtn');
        
        if(!name) return alert("تکایە ناو بنووسە");
        if(!userBranchId) return alert("لقی تۆ دیار نییە، دووبارە لۆگین بکەوە");

        btn.disabled = true;
        btn.innerText = "خەریکە...";

        const { error } = await _supabase.from('suppliers').insert([{ 
            name: name, 
            phone: document.getElementById('phone').value, 
            category: document.getElementById('cat').value, 
            address: document.getElementById('addr').value,
            branch_id: userBranchId // تۆمارکردنی ئایدی لق
        }]);

        if(!error) { 
            alert("بازرگان (" + name + ") بە سەرکەوتوویی تۆمارکرا"); 
            location.reload(); 
        } else {
            alert("هەڵە: " + error.message);
            btn.disabled = false;
            btn.innerText = "تۆمارکردن ✅";
        }
    }

    window.onload = getSups;
</script>
</body>
</html>
