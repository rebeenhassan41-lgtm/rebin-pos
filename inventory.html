<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مەخزەنی ڕێبین سیستم</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; direction: rtl; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
        h1 { color: #2c3e50; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #3498db; color: white; text-decoration: none; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 مەخزەنی گشتی کاڵاکان</h1>
        <a href="dashboard.html" class="back-btn">گەڕانەوە بۆ داشبۆرد</a>
        <table>
            <thead>
                <tr>
                    <th>ناوی کاڵا</th>
                    <th>کۆنترۆڵ (کارتۆن)</th>
                    <th>کۆی دانەکان</th>
                    <th>نرخی کڕین</th>
                    <th>دراو</th>
                </tr>
            </thead>
            <tbody id="inventoryTable">
                </tbody>
        </table>
    </div>

    <script>
        function loadInventory() {
            // خوێندنەوەی داتا لەو شوێنەی لاپەڕەی کڕین لێی سەیڤ دەکات
            const stock = JSON.parse(localStorage.getItem('rebinStock')) || {};
            const table = document.getElementById('inventoryTable');
            table.innerHTML = "";

            const items = Object.keys(stock);
            if (items.length === 0) {
                table.innerHTML = "<tr><td colspan='5'>هیچ کاڵایەک لە مەخزەن نییە.</td></tr>";
                return;
            }

            items.forEach(item => {
                let data = stock[item];
                let boxes = Math.floor(data.totalPcs / (data.pcsPerBox || 1));
                
                table.innerHTML += `
                    <tr>
                        <td><b>${item}</b></td>
                        <td>${boxes} کارتۆن</td>
                        <td style="color:green; font-weight:bold;">${data.totalPcs} دانە</td>
                        <td>${data.price}</td>
                        <td>${data.curr || 'IQD'}</td>
                    </tr>`;
            });
        }
        window.onload = loadInventory;
    </script>
</body>
</html>
