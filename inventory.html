<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R - کۆگای لق</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 10px; margin: 0; direction: rtl; }
        .container { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        
        /* ستایلی کارتی مەخزەن */
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .stock-card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 12px; text-align: center; position: relative; border-bottom: 4px solid #ddd; }
        .stock-card h3 { margin: 0 0 10px 0; font-size: 16px; color: var(--primary); }
        .qty-badge { font-size: 24px; font-weight: bold; color: var(--accent); display: block; margin: 5px 0; }
        .branch-badge { background: #e67e22; color: white; padding: 2px 8px; border-radius: 5px; font-size: 11px; }
        
        .search-area { margin-bottom: 20px; }
        .search-area input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #ddd; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: white; }
        .back-btn { text-decoration: none; background: var(--primary); color: white; padding: 8px 15px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2 style="margin:0; font-size: 18px;">🏬 دۆخی کۆگا (مەخزەن)</h2>
            <small id="currentBranchDisplay" class="branch-badge">لق: ---</small>
        </div>
        <a href="dashboard.html" class="back-btn">🏠 سەرەکی</a>
    </div>

    <div class="search-area">
        <div style="margin-bottom: 10px; display: flex; gap: 10px;">
            <button class="tab-btn active" onclick="switchView('stock')">📦 بڕی کاڵاکان</button>
            <button class="tab-btn" onclick="switchView('history')">📜 مێژووی کڕین</button>
        </div>
        <input type="text" id="searchInput" placeholder="بگەڕێ بۆ کاڵا..." oninput="filterData()">
    </div>

    <div id="mainDisplay">
        <p style="text-align:center;">خەریکە زانیارییەکان دەهێنرێن...</p>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentView = 'stock';
    let allStock = [];
    let allHistory = [];
    
    const branchId = localStorage.getItem("userBranchId");
    const branchName = localStorage.getItem("userBranchName") || "نادیار";

    async function loadData() {
        if(!branchId) return alert("تکایە سەرەتا لقێک هەڵبژێرە");
        document.getElementById('currentBranchDisplay').innerText = "لق: " + branchName;

        // 1. هێنانی بڕی کاڵاکان لەم لقەدا (Inventory)
        // تێبینی: دەبێت خشتەی inventory ت هەبێت کە item_name و quantity و branch_id تێدایە
        const { data: stockData, error: e1 } = await _supabase
            .from('inventory')
            .select('*')
            .eq('branch_id', branchId);

        // 2. هێنانی مێژووی کڕینەکان
        const { data: historyData, error: e2 } = await _supabase
            .from('purchases')
            .select('*')
            .eq('branch_id', branchId)
            .order('created_at', { ascending: false });

        if (!e1) allStock = stockData;
        if (!e2) allHistory = historyData;

        render();
    }

    function render() {
        const container = document.getElementById('mainDisplay');
        container.innerHTML = "";

        if (currentView === 'stock') {
            if(allStock.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>هیچ کاڵایەک لە مەخزەنی ئەم لقەدا نییە</p>";
                return;
            }
            let html = '<div class="stock-grid">';
            allStock.forEach(item => {
                html += `
                    <div class="stock-card">
                        <h3>${item.item_name}</h3>
                        <span class="qty-badge">${item.quantity}</span>
                        <small style="color:#888;">کۆتا نوێکردنەوە: ${new Date(item.updated_at || item.created_at).toLocaleDateString('ku-IQ')}</small>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        } else {
            // لێرەدا کۆدی گروپبەندی وەسڵەکانت دادەنێیت کە پێشتر ناردت (History)
            renderHistory(container);
        }
    }

    // فەنکشنی گروپبەندی وەسڵەکان (کۆدەکەی خۆت)
    function renderHistory(container) {
        if(allHistory.length === 0) {
            container.innerHTML = "<p style='text-align:center;'>مێژووی کڕین نییە</p>";
            return;
        }
        // ... لێرەدا هەمان ئەو لۆجیکەی خۆت دادەنێیتەوە بۆ پیشاندانی وەسڵەکان ...
        container.innerHTML = "<p style='text-align:center;'>لیستی وەسڵەکان لێرەدا دەبێت (وەک کۆدەکەی پێشووت)</p>";
    }

    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        render();
    }

    window.onload = loadData;
</script>
</body>
</html>
