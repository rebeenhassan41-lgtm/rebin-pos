<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مەخزەنی گشتی - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 10px; margin: 0; text-align: right; direction: rtl; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .back-btn { text-decoration: none; background: var(--primary); color: white; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { background: var(--primary); color: white; padding: 12px; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        .currency-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; color: white; }
        .usd { background: #27ae60; } .iqd { background: #2980b9; }
        .delete-btn { background: #e74c3c; border: none; cursor: pointer; padding: 5px 10px; border-radius: 5px; color: white; }
        
        @media (max-width: 600px) {
            th, td { padding: 8px; font-size: 12px; }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 مەخزەنی گشتی</h1>
        <a href="dashboard.html" class="back-btn">گەڕانەوە</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>کاڵا</th>
                <th>کۆگای ماوە</th>
                <th>نرخی کڕین</th>
                <th>دراو</th>
                <th>کردار</th>
            </tr>
        </thead>
        <tbody id="inventoryTable">
            <tr><td colspan="5">خەریکە بار دەکرێت...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // پشکنینی لۆگین بۆ مۆبایل و کۆمپیوتەر
    const isAuth = localStorage.getItem("rebeenAuth") === "true" || document.cookie.includes("rebeenAuth=true");
    if (!isAuth) { window.location.href = "index.html"; }

    async function loadInventory() {
        // وەرگرتنی داتا لە خشتەی invoices (کە کڕینەکانت لێیە)
        const { data, error } = await _supabase.from('invoices').select('*');
        const table = document.getElementById('inventoryTable');
        
        if (error) {
            table.innerHTML = "<tr><td colspan='5'>هەڵە لە بارکردن</td></tr>";
            return;
        }

        if (data.length === 0) {
            table.innerHTML = "<tr><td colspan='5'>مەخزەن بەتاڵە</td></tr>";
            return;
        }

        table.innerHTML = data.map(item => `
            <tr>
                <td><b>${item.item_name}</b></td>
                <td><span style="color:green; font-weight:bold;">${item.quantity}</span> دانە</td>
                <td>${Number(item.buy_price).toLocaleString()}</td>
                <td><span class="currency-badge usd">${item.currency || 'USD'}</span></td>
                <td>
                    <button class="delete-btn" onclick="deleteItem(${item.id})">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    async function deleteItem(id) {
        if(confirm("ئایا دڵنیای لە سڕینەوە؟")) {
            const { error } = await _supabase.from('invoices').delete().eq('id', id);
            if(!error) loadInventory();
        }
    }

    window.onload = loadInventory;
</script>
</body>
</html>
