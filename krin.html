<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ڕێبین سیستم | بەڕێوەبردنی نرخ و مێژوو</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f1f2f6; --danger: #e74c3c; --warning: #f39c12; --purple: #8e44ad; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .header-box { background: var(--main); color: white; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; }
        label { display: block; font-size: 11px; margin-bottom: 5px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; }
        .read-only-input { background: #e9ecef; color: #333; font-weight: bold; border: 1px solid #ddd; }
        .item-section { background: #fffde7; border-right: 5px solid var(--warning); }
        .history-section { background: #f0f7ff; border: 1px solid #accent; border-radius: 12px; padding: 10px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: #eee; padding: 10px; border: 1px solid #ddd; }
        td { padding: 8px; border: 1px solid #eee; text-align: center; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        .btn-finish { background: var(--success); color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 18px; margin-top: 20px; }
        .btn-back { background: var(--danger); color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <a href="dashboard.html" class="btn-back">🔙 گەڕانەوە</a>
        <h2 style="margin:0; font-size: 18px;">📥 وەسڵی کڕین + مێژووی نرخ</h2>
        <div style="display: flex; align-items: center; gap: 10px;">
            <label style="color: white; margin: 0;">💵 $100 =</label>
            <input type="number" id="dollarRate" value="150000" oninput="updateAllCalculations()" style="width: 90px; padding: 5px;">
        </div>
    </div>

    <div class="form-grid item-section">
        <div style="grid-column: span 2;">
            <label>🔍 گەڕان بە ناو یان بارکۆد</label>
            <input type="text" id="searchInp" placeholder="لێرە بنووسە..." autofocus onkeypress="if(event.key==='Enter') fetchProductInfo()">
        </div>
        <div style="grid-column: span 2;">
            <label>📦 ناوی کاڵا</label>
            <input type="text" id="itemName" class="read-only-input" readonly>
        </div>
    </div>

    <div id="historyDiv" class="history-section" style="display:none;">
        <label style="color: var(--accent);">🕒 مێژووی کڕینەکانی پێشووی ئەم بابەتە:</label>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>مێژوو</th>
                    <th>تێچووی دانە ($)</th>
                    <th>بڕی کڕدراو</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <div class="form-grid item-section">
        <div><label>📦 کارتۆن</label><input type="number" id="cartonQty" value="0" oninput="calcTotal()"></div>
        <div><label>🔢 لە کارتۆندا</label><input type="number" id="pcsPerCarton" value="1" oninput="calcTotal()"></div>
        <div><label>➕ زیادە</label><input type="number" id="extraPcs" value="0" oninput="calcTotal()"></div>
        <div><label>🧮 کۆی دانە</label><input type="number" id="totalQty" class="read-only-input" readonly></div>
        <div>
            <label>💵 تێچوو ($)</label>
            <input type="number" id="buyPriceUSD" value="0" step="0.01" oninput="conv('buy', 'USD')">
        </div>
        <div><label>🇮🇶 تێچوو (دینار)</label><input type="number" id="buyPriceIQD" value="0" oninput="conv('buy', 'IQD')"></div>
    </div>

    <div class="form-grid" style="background: #e8f5e9;">
        <div><label>💰 فرۆشی تاک ($)</label><input type="number" id="sellPriceUSD" value="0" step="0.01" oninput="conv('sell', 'USD')"></div>
        <div><label>🟣 فرۆشی جوملە ($)</label><input type="number" id="wholeUSD" value="0" step="0.01" oninput="conv('whole', 'USD')"></div>
    </div>
    
    <button onclick="addToTempList()" id="addBtn" class="btn-add" disabled>خستنە ناو وەسڵ ➕</button>

    <table id="mainTable">
        <thead>
            <tr>
                <th>کاڵا</th>
                <th>کۆی دانە</th>
                <th>تێچوو</th>
                <th>کۆی گشتی</th>
                <th>لابردن</th>
            </tr>
        </thead>
        <tbody id="tempListBody"></tbody>
    </table>

    <button id="finishBtn" onclick="finishInvoice()" class="btn-finish">پاشەکەوتکردنی وەسڵ 💾</button>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let tempItems = [];
    let currentProduct = null;
    const userBranchId = localStorage.getItem("userBranchId");

    async function fetchProductInfo() {
        const val = document.getElementById('searchInp').value.trim();
        if(!val) return;

        // گەڕان بە ناو یان بارکۆد
        const { data, error } = await _supabase.from('purchases').select('*')
            .or(`barcode.eq."${val}",item_name.ilike."%${val}%"`)
            .eq('branch_id', userBranchId).limit(1).maybeSingle();

        if (data) {
            currentProduct = data;
            // ئەمە ئەو بەشەیە کە داوات کردبوو: بارکۆدەکە دەنوسێتەوە لە جێی سێرچەکە
            document.getElementById('searchInp').value = data.barcode;
            document.getElementById('itemName').value = data.item_name;
            document.getElementById('pcsPerCarton').value = data.pcs_in_carton || 1;
            document.getElementById('buyPriceUSD').value = data.buy_price || 0;
            document.getElementById('sellPriceUSD').value = data.sell_price || 0;
            document.getElementById('wholeUSD').value = data.wholesale_price || 0;
            
            document.getElementById('addBtn').disabled = false;
            updateAllCalculations();
            
            // پیشاندانی مێژوو
            showHistory(data.id);
            
            document.getElementById('cartonQty').focus();
        } else {
            alert("کاڵاکە نەدۆزرایەوە!");
        }
    }

    async function showHistory(productId) {
        // لێرەدا وا دادەنێین مێژوو لە خشتەیەک بە ناوی 'purchase_history' یان هەر لە 'purchases' خۆیەتی
        // بۆ نموونە لێرە تەنها نرخی ئێستای پیشان دەدەین وەک مێژوو (چونکە تەنها یەک ڕیکۆردمان هەیە لەم نموونەیەدا)
        document.getElementById('historyDiv').style.display = 'block';
        document.getElementById('historyBody').innerHTML = `
            <tr>
                <td>ئێستا</td>
                <td style="color:red; font-weight:bold;">$${currentProduct.buy_price}</td>
                <td>${currentProduct.quantity || 0} موجود</td>
            </tr>
        `;
    }

    function conv(field, unit) {
        const rate = (parseFloat(document.getElementById('dollarRate').value) || 150000) / 100;
        let usdId = field === 'buy' ? 'buyPriceUSD' : (field === 'sell' ? 'sellPriceUSD' : 'wholeUSD');
        let iqdId = field === 'buy' ? 'buyPriceIQD' : '';

        if(unit === 'USD') {
            if(iqdId) {
                const usd = parseFloat(document.getElementById(usdId).value) || 0;
                document.getElementById(iqdId).value = Math.round(usd * rate);
            }
        } else {
            const iqd = parseFloat(document.getElementById(iqdId).value) || 0;
            document.getElementById(usdId).value = (iqd / rate).toFixed(2);
        }
    }

    function calcTotal() {
        const c = parseFloat(document.getElementById('cartonQty').value) || 0;
        const p = parseFloat(document.getElementById('pcsPerCarton').value) || 1;
        const e = parseFloat(document.getElementById('extraPcs').value) || 0;
        document.getElementById('totalQty').value = (c * p) + e;
    }

    function updateAllCalculations() {
        conv('buy', 'USD'); calcTotal();
    }

    function addToTempList() {
        const qty = parseFloat(document.getElementById('totalQty').value) || 0;
        if(qty <= 0) return alert("بڕ دابنێ");

        tempItems.push({
            id: currentProduct.id,
            item_name: currentProduct.item_name,
            total_qty: qty,
            buy_price: parseFloat(document.getElementById('buyPriceUSD').value),
            sell_price: parseFloat(document.getElementById('sellPriceUSD').value),
            wholesale_price: parseFloat(document.getElementById('wholeUSD').value)
        });
        renderTempList();
        resetFields();
    }

    function renderTempList() {
        document.getElementById('tempListBody').innerHTML = tempItems.map((item, index) => `
            <tr>
                <td>${item.item_name}</td>
                <td>${item.total_qty}</td>
                <td>$${item.buy_price}</td>
                <td>$${(item.total_qty * item.buy_price).toFixed(2)}</td>
                <td><button onclick="tempItems.splice(${index},1);renderTempList()">❌</button></td>
            </tr>
        `).join('');
    }

    async function finishInvoice() {
        if(tempItems.length === 0) return alert("وەسڵ بەتاڵە");
        const btn = document.getElementById('finishBtn');
        btn.disabled = true;

        for(let item of tempItems) {
            const { data: st } = await _supabase.from('purchases').select('quantity').eq('id', item.id).single();
            await _supabase.from('purchases').update({
                quantity: (st.quantity || 0) + item.total_qty,
                buy_price: item.buy_price,
                sell_price: item.sell_price,
                wholesale_price: item.wholesale_price,
                last_purchase_date: new Date() // مێژووی کڕین نوێ دەکاتەوە
            }).eq('id', item.id);
        }
        alert("سەرکەوتوو بوو ✅");
        location.reload();
    }

    function resetFields() {
        document.getElementById('searchInp').value = "";
        document.getElementById('itemName').value = "";
        document.getElementById('totalQty').value = "0";
        document.getElementById('historyDiv').style.display = 'none';
        document.getElementById('addBtn').disabled = true;
        document.getElementById('searchInp').focus();
    }
</script>
</body>
</html>
