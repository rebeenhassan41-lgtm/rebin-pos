<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەڕێوەبردنی کڕین - Rebin System</title>
    <style>
        :root { --main: #2d3436; --accent: #0984e3; --success: #00b894; --bg: #f5f6fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Form Section */
        .header-box { background: var(--main); color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 20px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .btn-save { background: var(--success); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 22px; }

        /* Advanced Search Section */
        .search-area { background: #eef2f3; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 15px; align-items: flex-end; }
        .search-input { border: 2px solid var(--accent) !important; font-size: 15px !important; }

        /* Table Design */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f1f2f6; padding: 12px; border-bottom: 2px solid #ddd; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }
        tr:hover { background: #f9f9f9; }

        .btn-action { border: none; padding: 8px; border-radius: 5px; cursor: pointer; color: white; margin: 2px; }
        .btn-p { background: #34495e; } .btn-d { background: #d63031; }
        .back-btn { color: white; text-decoration: none; font-size: 14px; border: 1px solid white; padding: 5px 10px; border-radius: 5px; }

        @media print { .no-print { display: none; } .print-area { display: block !important; } }
    </style>
</head>
<body>

<div class="container no-print">
    <div class="header-box">
        <h3 style="margin:0;">📥 داخڵکردنی کڕینی نوێ</h3>
        <a href="dashboard.html" class="back-btn">گەڕانەوە</a>
    </div>

    <div class="form-grid">
        <div><label>ناوی کاڵا</label><input type="text" id="itemName"></div>
        <div><label>کارتۆن</label><input type="number" id="qty"></div>
        <div><label>دانە/کارتۆن</label><input type="number" id="pcs"></div>
        <div><label>نرخی کارتۆن</label><input type="number" id="price"></div>
        <div><label>دراو</label>
            <select id="curr">
                <option value="USD">USD ($)</option>
                <option value="IQD">IQD (د.ع)</option>
                <option value="IRR">IRR (تمەن)</option>
            </select>
        </div>
        <button onclick="saveInv()" class="btn-save">تۆمارکردن</button>
    </div>

    <div class="search-area">
        <div>
            <label>🔎 گەڕانی خێرا (ناوی کاڵا یان نرخ)</label>
            <input type="text" id="textSearch" class="search-input" onkeyup="filterNow()" placeholder="بنووسە بۆ گەڕان...">
        </div>
        <div>
            <label>📅 فلتەری ڕۆژ</label>
            <input type="date" id="dateSearch" onchange="filterNow()">
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>بەروار</th>
                    <th>کاڵا</th>
                    <th>کارتۆن</th>
                    <th>کۆی دانە</th>
                    <th>نرخ</th>
                    <th>کردارەکان</th>
                </tr>
            </thead>
            <tbody id="listBody"></tbody>
        </table>
    </div>
</div>

<div id="printZone" class="print-area" style="display:none; direction:rtl;"></div>

<script>
    window.onload = loadInv;

    function saveInv() {
        const name = document.getElementById('itemName').value;
        const q = parseFloat(document.getElementById('qty').value) || 0;
        const p = parseFloat(document.getElementById('pcs').value) || 0;
        const pr = document.getElementById('price').value;
        const c = document.getElementById('curr').value;
        const d = new Date();
        const dateStr = d.toISOString().split('T')[0];
        const fullDate = d.toLocaleString('ku-IQ');

        if(!name || q <= 0) return alert("تکایە خانەکان پڕ بکەرەوە");

        let stock = JSON.parse(localStorage.getItem('rebinStock')) || {};
        stock[name] = { totalPcs: (stock[name]?.totalPcs || 0) + (q * p), price: pr, curr: c, pcsPerBox: p };
        localStorage.setItem('rebinStock', JSON.stringify(stock));

        let invs = JSON.parse(localStorage.getItem('rebinInvoices')) || [];
        invs.push({ id: Date.now(), name, q, p, pr, c, dateOnly: dateStr, fullDate });
        localStorage.setItem('rebinInvoices', JSON.stringify(invs));

        location.reload();
    }

    function loadInv() {
        renderTable(JSON.parse(localStorage.getItem('rebinInvoices')) || []);
    }

    function renderTable(data) {
        const body = document.getElementById('listBody');
        body.innerHTML = data.reverse().map(i => `
            <tr>
                <td style="font-size:11px;">${i.fullDate}</td>
                <td><b>${i.name}</b></td>
                <td>${i.q}</td>
                <td>${i.q * i.p}</td>
                <td>${i.pr} ${i.c}</td>
                <td>
                    <button class="btn-action btn-p" onclick="printThis(${i.id})">🖨️</button>
                    <button class="btn-action btn-d" onclick="deleteThis(${i.id})">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    function filterNow() {
        let text = document.getElementById('textSearch').value.toLowerCase();
        let date = document.getElementById('dateSearch').value;
        let invs = JSON.parse(localStorage.getItem('rebinInvoices')) || [];

        let filtered = invs.filter(i => {
            let matchText = i.name.toLowerCase().includes(text) || i.pr.toString().includes(text);
            let matchDate = date ? i.dateOnly === date : true;
            return matchText && matchDate;
        });

        renderTable(filtered.reverse()); // reverse دووبارە بۆ ئەوەی ڕیزبەندی تێکنەچێت
    }

    function deleteThis(id) {
        if(confirm("سڕینەوەی وەسڵ؟")){
            let invs = JSON.parse(localStorage.getItem('rebinInvoices')).filter(i => i.id !== id);
            localStorage.setItem('rebinInvoices', JSON.stringify(invs));
            loadInv();
        }
    }

    function printThis(id) {
        const i = JSON.parse(localStorage.getItem('rebinInvoices')).find(x => x.id === id);
        document.getElementById('printZone').innerHTML = `
            <div style="border:2px solid #000; padding:20px; text-align:center;">
                <h2>ڕێبین سیستم - وەسڵی کڕین</h2>
                <hr>
                <div style="text-align:right;">
                    <p>بەروار: ${i.fullDate}</p>
                    <p>کاڵا: ${i.name}</p>
                    <p>بڕ: ${i.q} کارتۆن (${i.q * i.p} دانە)</p>
                    <p>نرخ: ${i.pr} ${i.c}</p>
                </div>
            </div>`;
        window.print();
    }
</script>
</body>
</html>
