<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داخڵکردنی کڕین - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header-box { background: var(--main); color: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .btn-save { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        .table-wrap { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f1f2f6; padding: 12px; border-bottom: 2px solid #ddd; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }
        .btn-dash { background: #e67e22; color: white; text-decoration: none; padding: 8px 12px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h2 style="margin:0;">📥 کڕینی کاڵا (Purchases)</h2>
        <a href="dashboard.html" class="btn-dash">🏠 گەڕانەوە</a>
    </div>

    <div class="form-grid">
        <div><label>🔢 بارکۆد</label><input type="text" id="barcode"></div>
        <div><label>🧾 وەسڵ #</label><input type="text" id="invNo"></div>
        <div><label>بازرگان</label><input type="text" id="merchant"></div>
        <div><label>ناوی کاڵا</label><input type="text" id="itemName"></div>
        <div><label>کۆۆی دانە</label><input type="number" id="quantity" value="0"></div>
        <div><label>نرخی کڕین</label><input type="number" id="buyPrice" value="0"></div>
        <div><label>دراو</label>
            <select id="curr">
                <option value="USD">دۆلار ($)</option>
                <option value="IQD">دینار (ع.د)</option>
            </select>
        </div>
        <div><label>جۆری کڕین</label>
            <select id="payType">
                <option value="Cash">نەختینە (کاش)</option>
                <option value="Debt">بە قەرز</option>
            </select>
        </div>
    </div>
    <button onclick="savePurchase()" id="saveBtn" class="btn-save">تۆمارکردن لە کۆگا ☁️</button>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>بەروار</th>
                    <th>کاڵا</th>
                    <th>بڕ</th>
                    <th>نرخ</th>
                    <th>کردار</th>
                </tr>
            </thead>
            <tbody id="listBody">
                <tr><td colspan="5">هیچ داتایەک نییە...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function savePurchase() {
        const btn = document.getElementById('saveBtn');
        const itemName = document.getElementById('itemName').value;
        const qty = parseFloat(document.getElementById('quantity').value);
        const price = parseFloat(document.getElementById('buyPrice').value) || 0;
        const currency = document.getElementById('curr').value;
        const merchant = document.getElementById('merchant').value;
        const payType = document.getElementById('payType').value;
        const invNo = document.getElementById('invNo').value;

        if(!itemName || qty <= 0) {
            alert("تکایە ناوی کاڵا و بڕەکەی دیاری بکە");
            return;
        }

        btn.disabled = true;
        btn.innerText = "خەریکە تۆمار دەبێت...";

        // داتا بۆ خشتە نوێیەکە (purchases)
        const purchaseData = {
            inv_no: invNo,
            barcode: document.getElementById('barcode').value,
            merchant: merchant,
            item_name: itemName,
            quantity: qty,
            buy_price: price,
            currency: currency
        };

        // ١. تۆمارکردن لە خشتەی کڕینەکان
        const { error: pError } = await _supabase.from('purchases').insert([purchaseData]);

        if (pError) {
            alert("کێشە لە خشتەی کڕین: " + pError.message);
        } else {
            // ٢. ئەگەر بە قەرز بوو، داتا بنێرە بۆ merchant_debts
            if (payType === "Debt") {
                const debtData = {
                    merchant_name: merchant || "نادیار",
                    amount_usd: (currency === "USD") ? (qty * price) : 0,
                    amount_iqd: (currency === "IQD") ? (qty * price) : 0,
                    items_details: `${itemName} (${qty} دانە) - وەسڵی #${invNo}`
                };
                
                const { error: dError } = await _supabase.from('merchant_debts').insert([debtData]);
                if (dError) console.error("کێشە لە قەرز:", dError.message);
            }

            alert("سەرکەوتوو بوو! داتاکە تۆمار کرا.");
            document.getElementById('itemName').value = "";
            document.getElementById('quantity').value = "0";
            loadPurchases();
        }
        btn.disabled = false;
        btn.innerText = "تۆمارکردن لە کۆگا ☁️";
    }

    async function loadPurchases() {
        const { data, error } = await _supabase.from('purchases').select('*').order('created_at', { ascending: false });
        if (data) {
            const body = document.getElementById('listBody');
            body.innerHTML = data.map(i => `
                <tr>
                    <td>${new Date(i.created_at).toLocaleDateString('ku-IQ')}</td>
                    <td><b>${i.item_name}</b></td>
                    <td>${i.quantity} دانە</td>
                    <td>${i.buy_price} ${i.currency}</td>
                    <td><button onclick="deleteRow('${i.id}')" style="color:red; border:none; background:none; cursor:pointer;">🗑️</button></td>
                </tr>
            `).join('');
        }
    }

    async function deleteRow(id) {
        if(confirm("دڵنیای لە سڕینەوە؟")) {
            await _supabase.from('purchases').delete().eq('id', id);
            loadPurchases();
        }
    }

    window.onload = loadPurchases;
</script>
</body>
</html>
