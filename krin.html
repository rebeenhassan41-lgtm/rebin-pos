<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەڕێوەبردنی وەسڵەکان - Rebin System</title>
    <style>
        :root { --main: #0984e3; --success: #00b894; --bg: #dfe6e9; --text: #2d3436; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* شێوازی فۆرمەکە */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #f9f9f9; padding: 20px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 30px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; transition: 0.3s; }
        input:focus { border-color: var(--main); outline: none; box-shadow: 0 0 5px rgba(9, 132, 227, 0.2); }
        
        .btn-add { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 23px; }
        
        /* بەشی گەڕانی پڕۆفیشناڵ */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 15px 45px 15px 15px; border-radius: 50px; border: 2px solid var(--main); font-size: 16px; background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%230984e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat right 15px center; }

        /* خشتەی داتا */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 10px; overflow: hidden; }
        th { background: var(--main); color: white; padding: 15px; font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }
        tr:hover { background-color: #f1f2f6; }
        
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-qty { background: #e17055; color: white; }
        
        .actions button { padding: 8px; border: none; border-radius: 5px; cursor: pointer; margin: 0 2px; }
        .btn-print { background: #636e72; color: white; }
        .btn-del { background: #d63031; color: white; }

        .back-link { text-decoration: none; color: var(--main); font-weight: bold; display: inline-block; margin-bottom: 15px; }

        @media print { .no-print { display: none; } .print-only { display: block !important; } }
    </style>
</head>
<body>

<div class="container no-print">
    <a href="dashboard.html" class="back-link">⬅️ گەڕانەوە بۆ داشبۆرد</a>
    <h2 style="margin-top:0;">📦 بەڕێوەبردنی کڕین و ئەرشیفی زیرەک</h2>

    <div class="form-grid">
        <div><label>ناوی کاڵا</label><input type="text" id="itemName" placeholder="نموونە: مریشک"></div>
        <div><label>کارتۆن</label><input type="number" id="qty" placeholder="0"></div>
        <div><label>دانە لە کارتۆن</label><input type="number" id="pcs" placeholder="0"></div>
        <div><label>نرخی کڕین</label><input type="number" id="price" placeholder="0"></div>
        <div><label>دراو</label>
            <select id="currency">
                <option value="USD">دۆلار ($)</option>
                <option value="IQD">دینار (د.ع)</option>
            </select>
        </div>
        <div><button onclick="savePurchase()" class="btn-add">تۆمارکردنی وەسڵ</button></div>
    </div>

    <div class="search-container">
        <input type="text" id="smartSearch" class="search-bar" onkeyup="smartFilter()" placeholder="لێرە بگەڕێ (ناوی کاڵا، بەروار، یان نرخ)...">
    </div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>بەروار و کات</th>
                <th>ناوی کاڵا</th>
                <th>کارتۆن</th>
                <th>کۆی دانە</th>
                <th>نرخی کڕین</th>
                <th>کردارەکان</th>
            </tr>
        </thead>
        <tbody id="invoiceList"></tbody>
    </table>
</div>

<div id="printArea" class="print-only" style="display:none; direction:rtl;"></div>

<script>
    window.onload = loadData;

    function savePurchase() {
        const item = {
            id: Date.now(),
            name: document.getElementById('itemName').value.trim(),
            qty: parseFloat(document.getElementById('qty').value) || 0,
            pcs: parseFloat(document.getElementById('pcs').value) || 0,
            price: document.getElementById('price').value,
            curr: document.getElementById('currency').value,
            date: new Date().toLocaleString('ku-IQ')
        };

        if(!item.name || item.qty <= 0) return alert("تکایە زانیارییەکان تەواو بکە");

        // سەیڤکردن لە مەخزەن
        let stock = JSON.parse(localStorage.getItem('rebinStock')) || {};
        stock[item.name] = { 
            totalPcs: (stock[item.name]?.totalPcs || 0) + (item.qty * item.pcs),
            price: item.price, curr: item.curr, pcsPerBox: item.pcs 
        };
        localStorage.setItem('rebinStock', JSON.stringify(stock));

        // سەیڤکردن لە وەسڵەکان
        let invoices = JSON.parse(localStorage.getItem('rebinInvoices')) || [];
        invoices.push(item);
        localStorage.setItem('rebinInvoices', JSON.stringify(invoices));

        location.reload();
    }

    function loadData() {
        const invoices = JSON.parse(localStorage.getItem('rebinInvoices')) || [];
        const list = document.getElementById('invoiceList');
        list.innerHTML = invoices.reverse().map(inv => `
            <tr>
                <td style="font-size:12px;">${inv.date}</td>
                <td><strong>${inv.name}</strong></td>
                <td><span class="badge badge-qty">${inv.qty} کارتۆن</span></td>
                <td>${inv.qty * inv.pcs} دانە</td>
                <td>${inv.price} ${inv.curr}</td>
                <td class="actions">
                    <button class="btn-print" onclick="printMe(${inv.id})">🖨️</button>
                    <button class="btn-del" onclick="deleteMe(${inv.id})">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    function smartFilter() {
        let val = document.getElementById('smartSearch').value.toLowerCase();
        let rows = document.querySelectorAll('#invoiceList tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    function deleteMe(id) {
        if(confirm("ئایا دڵنیای لە سڕینەوە؟")){
            let invs = JSON.parse(localStorage.getItem('rebinInvoices')).filter(i => i.id !== id);
            localStorage.setItem('rebinInvoices', JSON.stringify(invs));
            loadData();
        }
    }

    function printMe(id) {
        const inv = JSON.parse(localStorage.getItem('rebinInvoices')).find(i => i.id === id);
        const area = document.getElementById('printArea');
        area.innerHTML = `
            <div style="border:3px double #000; padding:30px; text-align:center;">
                <h1>ڕێبین سیستم بۆ بازرگانی</h1>
                <p>وەسڵی کڕینی کاڵا</p>
                <hr>
                <div style="text-align:right;">
                    <p><b>بەروار:</b> ${inv.date}</p>
                    <p><b>ناوی کاڵا:</b> ${inv.name}</p>
                    <p><b>بڕ:</b> ${inv.qty} کارتۆن (${inv.qty * inv.pcs} دانە)</p>
                    <p><b>نرخ:</b> ${inv.price} ${inv.curr}</p>
                </div>
                <br><br>
                <p>واژووی کۆگا</p>
            </div>`;
        window.print();
    }
</script>
</body>
</html>
