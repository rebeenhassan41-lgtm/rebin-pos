<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ڕێبین سیستم | کڕینی کاڵای ناسێنراو</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f1f2f6; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 1300px; margin: auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .header-box { background: var(--main); color: white; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #555; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; }
        .read-only-input { background: #e9ecef; cursor: not-allowed; border-color: #dee2e6; }
        .item-section { background: #fffde7; border: 1px solid #fff59d; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        .btn-finish { background: var(--success); color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 18px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #eee; padding: 12px; border: 1px solid #ddd; }
        td { padding: 12px; border: 1px solid #eee; text-align: center; }
        .error-msg { color: var(--danger); font-size: 12px; display: none; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div>
            <h2 style="margin:0; font-size: 18px;">📥 کڕینی کاڵا (تەنها ناسێنراو)</h2>
            <small id="branchTag"></small>
        </div>
        <div id="invDisplay" style="background: #f1c40f; color: black; padding: 4px 10px; border-radius: 6px; font-weight: bold;">---</div>
    </div>

    <div class="form-grid">
        <div><label>👤 بازرگان</label><input type="text" id="merchant" placeholder="ناوی کۆمپانیا"></div>
        <div><label>💰 جۆری کڕین</label>
            <select id="payType">
                <option value="Cash">نەختینە (کاش)</option>
                <option value="Debt">بە قەرز</option>
            </select>
        </div>
        <div><label>💵 نرخی دۆلار</label><input type="number" id="dollarRate" value="1500"></div>
    </div>

    <div class="form-grid item-section">
        <div style="grid-column: span 2;">
            <label>🔢 بارکۆد (سکان بکە بۆ دۆزینەوە)</label>
            <input type="text" id="barcode" placeholder="بارکۆد لێرە لێبدە..." autofocus onkeypress="if(event.key==='Enter') fetchProductInfo()">
            <span id="barcodeError" class="error-msg">⚠️ ئەم کاڵایە پێشتر نەناسێنراوە!</span>
        </div>
        <div style="grid-column: span 2;">
            <label>📦 ناوی کاڵا (خۆکار)</label>
            <input type="text" id="itemName" class="read-only-input" readonly placeholder="سەرەتا بارکۆد لێبدە">
        </div>
        <div><label>📦 بڕ (کارتۆن)</label><input type="number" id="cartonQty" value="0" oninput="calcTotal()"></div>
        <div><label>🔢 دانە لە کارتۆن</label><input type="number" id="pcsPerCarton" class="read-only-input" readonly value="1"></div>
        <div><label>🧮 کۆی دانە</label><input type="number" id="totalQty" value="0" readonly class="read-only-input"></div>
        <div><label>💵 تێچووی دانە ($)</label><input type="number" id="buyPrice" value="0"></div>
        <div><label>🛒 فرۆشی ئێستا ($)</label><input type="number" id="saleRetail" class="read-only-input" readonly value="0"></div>
    </div>
    
    <button onclick="addToTempList()" id="addBtn" class="btn-add" disabled>زیادکردن بۆ وەسڵ ➕</button>

    <table>
        <thead>
            <tr><th>ناو</th><th>بڕی کڕدراو</th><th>نرخی کڕین</th><th>کۆ ($)</th><th>لابردن</th></tr>
        </thead>
        <tbody id="tempListBody"></tbody>
    </table>

    <button id="finishBtn" onclick="finishInvoice()" class="btn-finish">تەواوکردنی وەسڵی کڕین 💾</button>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let tempItems = [];
    let currentInvNo = "PUR-" + Date.now().toString().slice(-6);
    const userBranchId = localStorage.getItem("userBranchId");
    document.getElementById('invDisplay').innerText = currentInvNo;

    // دۆزینەوەی کاڵا لە خشتەی "باکۆدەکان" یان "ناساندن"
    async function fetchProductInfo() {
        const barcode = document.getElementById('barcode').value;
        const errorMsg = document.getElementById('barcodeError');
        const addBtn = document.getElementById('addBtn');
        
        // گریمانە دەکەین ناوی خشتەی ناساندنەکانت 'products' یان 'purchases' ە
        const { data, error } = await _supabase.from('purchases')
            .select('*')
            .eq('barcode', barcode)
            .eq('branch_id', userBranchId)
            .maybeSingle();

        if (data) {
            document.getElementById('itemName').value = data.item_name;
            document.getElementById('pcsPerCarton').value = data.pcs_in_carton || 1;
            document.getElementById('saleRetail').value = data.sale_price_retail;
            document.getElementById('buyPrice').value = data.buy_price;
            errorMsg.style.display = 'none';
            addBtn.disabled = false;
            document.getElementById('cartonQty').focus();
        } else {
            document.getElementById('itemName').value = "";
            errorMsg.style.display = 'block';
            addBtn.disabled = true;
            alert("⚠️ ئەم بارکۆدە نەناسێنراوە! تکایە سەرەتا لە بەشی 'ناساندنی کاڵا' تۆماری بکە.");
        }
    }

    function calcTotal() {
        const c = parseFloat(document.getElementById('cartonQty').value) || 0;
        const p = parseFloat(document.getElementById('pcsPerCarton').value) || 1;
        document.getElementById('totalQty').value = c * p;
    }

    function addToTempList() {
        const name = document.getElementById('itemName').value;
        const qty = parseFloat(document.getElementById('totalQty').value) || 0;
        const buy = parseFloat(document.getElementById('buyPrice').value) || 0;

        if(!name || qty <= 0) return;

        tempItems.push({
            barcode: document.getElementById('barcode').value,
            item_name: name,
            quantity: qty,
            buy_price: buy,
            sale_price_retail: parseFloat(document.getElementById('saleRetail').value)
        });

        renderTempList();
        resetFields();
    }

    function renderTempList() {
        document.getElementById('tempListBody').innerHTML = tempItems.map((item, index) => `
            <tr>
                <td>${item.item_name}</td>
                <td>${item.quantity} دانە</td>
                <td>$${item.buy_price}</td>
                <td>$${(item.quantity * item.buy_price).toFixed(2)}</td>
                <td><button onclick="tempItems.splice(${index},1);renderTempList()">❌</button></td>
            </tr>
        `).join('');
    }

    async function finishInvoice() {
        if(tempItems.length === 0) return alert("وەسڵەکە بەتاڵە");
        
        for(let item of tempItems) {
            // تەنها بڕ نوێ دەکەینەوە چونکە کاڵاکە دڵنیاین هەیە
            const { data: existing } = await _supabase.from('purchases')
                .select('quantity')
                .eq('barcode', item.barcode)
                .eq('branch_id', userBranchId)
                .single();

            await _supabase.from('purchases').update({
                quantity: existing.quantity + item.quantity,
                buy_price: item.buy_price,
                supplier: document.getElementById('merchant').value,
                inv_no: currentInvNo
            }).eq('barcode', item.barcode).eq('branch_id', userBranchId);
        }

        alert("کڕینەکە بە سەرکەوتوویی زیادکرا بۆ مەخزەن ✅");
        location.reload();
    }

    function resetFields() {
        document.getElementById('barcode').value = "";
        document.getElementById('itemName').value = "";
        document.getElementById('cartonQty').value = "0";
        document.getElementById('totalQty').value = "0";
        document.getElementById('addBtn').disabled = true;
        document.getElementById('barcode').focus();
    }
</script>
</body>
</html>
