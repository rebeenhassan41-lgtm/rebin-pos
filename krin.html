<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ڕێبین سیستم | بەڕێوەبردنی نرخ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f1f2f6; --danger: #e74c3c; --warning: #f39c12; --purple: #8e44ad; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .header-box { background: var(--main); color: white; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; }
        label { display: block; font-size: 11px; margin-bottom: 5px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); border-width: 2px; }
        .read-only-input { background: #e9ecef; color: #333; font-weight: bold; }
        .history-section { background: #e3f2fd; border: 1px solid #bbdefb; border-radius: 12px; padding: 10px; margin-bottom: 15px; }
        .buy-card { background: #fffde7; border-right: 5px solid var(--warning); }
        .sell-card { background: #e8f5e9; border-right: 5px solid var(--success); }
        .whole-card { background: #f3e5f5; border-right: 5px solid var(--purple); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #eee; padding: 10px; border: 1px solid #ddd; font-size: 12px; }
        td { padding: 8px; border: 1px solid #eee; text-align: center; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-add:disabled { background: #ccc; cursor: not-allowed; }
        .btn-finish { background: var(--success); color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 18px; margin-top: 20px; }
        .btn-back { background: var(--danger); color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <a href="dashboard.html" class="btn-back">🔙 گەڕانەوە</a>
        <h2 style="margin:0; font-size: 18px;">📥 کڕین و نوێکردنەوەی نرخ</h2>
        <div style="display: flex; align-items: center; gap: 10px;">
            <label style="color: white; margin: 0;">💵 100$ =</label>
            <input type="number" id="dollarRate" value="150000" oninput="updateAllCalculations()" style="width: 90px; padding: 5px;">
        </div>
    </div>

    <div class="form-grid" style="background: #fff; border: 2px solid var(--accent);">
        <div style="grid-column: span 2;">
            <label>🔍 گەڕان (ناو یان بارکۆد) + Enter</label>
            <input type="text" id="searchInp" placeholder="سێرچ بکە بۆ دۆزینەوەی کاڵا..." autofocus onkeypress="if(event.key==='Enter') fetchProductInfo()">
        </div>
        <div style="grid-column: span 2;">
            <label>📦 ناوی کاڵای دۆزراوە</label>
            <input type="text" id="itemName" class="read-only-input" readonly placeholder="پێویستە کاڵاکە بدۆزرێتەوە">
        </div>
    </div>

    <div id="historyDiv" class="history-section" style="display:none;">
        <label>🕒 نرخەکانی کۆتا کڕینی ئەم بابەتە:</label>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>تێچوو ($)</th>
                    <th>تاک ($)</th>
                    <th>جوملە ($)</th>
                    <th>کۆتا نوێکردنەوە</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <div class="form-grid buy-card">
        <div><label>📦 کارتۆن</label><input type="number" id="cartonQty" value="0" oninput="calcTotal()"></div>
        <div><label>🔢 لە کارتۆندا</label><input type="number" id="pcsPerCarton" value="1" oninput="calcTotal()"></div>
        <div><label>➕ دانەی زیادە</label><input type="number" id="extraPcs" value="0" oninput="calcTotal()"></div>
        <div><label>🧮 کۆی دانە</label><input type="number" id="totalQty" class="read-only-input" readonly></div>
        <div>
            <label>💵 تێچوو ($)</label>
            <input type="number" id="buyUSD" value="0" step="0.01" oninput="conv('buy', 'USD')">
        </div>
        <div>
            <label>🇮🇶 تێچوو (دینار)</label>
            <input type="number" id="buyIQD" value="0" oninput="conv('buy', 'IQD')">
        </div>
    </div>

    <div class="form-grid sell-card">
        <div style="grid-column: 1/-1; color: var(--success); font-weight: bold;">🛒 نرخی فرۆشی تاک (دانە):</div>
        <div>
            <label>💰 دۆلار ($)</label>
            <input type="number" id="sellUSD" value="0" step="0.01" oninput="conv('sell', 'USD')">
        </div>
        <div>
            <label>🇮🇶 دینار (IQD)</label>
            <input type="number" id="sellIQD" value="0" oninput="conv('sell', 'IQD')">
        </div>
    </div>

    <div class="form-grid whole-card">
        <div style="grid-column: 1/-1; color: var(--purple); font-weight: bold;">⚖️ نرخی فرۆشی جوملە (دانە):</div>
        <div>
            <label>🟣 دۆلار ($)</label>
            <input type="number" id="wholeUSD" value="0" step="0.01" oninput="conv('whole', 'USD')">
        </div>
        <div>
            <label>🇮🇶 دینار (IQD)</label>
            <input type="number" id="wholeIQD" value="0" oninput="conv('whole', 'IQD')">
        </div>
    </div>
    
    <button onclick="addToTempList()" id="addBtn" class="btn-add" disabled>کاڵاکە بناسێنە پاشان کلیک بکە ➕</button>

    <table id="mainTable">
        <thead>
            <tr>
                <th>ناوی کاڵا</th>
                <th>بڕی نوێ</th>
                <th>تێچوو ($)</th>
                <th>کۆی گشتی ($)</th>
                <th>کردار</th>
            </tr>
        </thead>
        <tbody id="tempListBody"></tbody>
    </table>

    <button id="finishBtn" onclick="finishInvoice()" class="btn-finish">پاشەکەوتکردنی کۆتایی 💾</button>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let tempItems = [];
    let currentProduct = null;
    const userBranchId = localStorage.getItem("userBranchId");

    async function fetchProductInfo() {
        const val = document.getElementById('searchInp').value.trim();
        if(!val) return;

        const { data, error } = await _supabase.from('purchases').select('*')
            .or(`barcode.eq."${val}",item_name.ilike."%${val}%"`)
            .eq('branch_id', userBranchId).limit(1).maybeSingle();

        if (data) {
            currentProduct = data;
            document.getElementById('searchInp').value = data.barcode;
            document.getElementById('itemName').value = data.item_name;
            document.getElementById('pcsPerCarton').value = data.pcs_in_carton || 1;
            
            // دانانی نرخەکانی ناو داتابەیس بۆ ناو خانەکان
            document.getElementById('buyUSD').value = data.buy_price || 0;
            document.getElementById('sellUSD').value = data.sell_price || 0;
            document.getElementById('wholeUSD').value = data.wholesale_price || 0;
            
            showHistory(data);
            document.getElementById('addBtn').disabled = false;
            document.getElementById('addBtn').innerText = "زیادکردن بۆ لیست ➕";
            updateAllCalculations();
            document.getElementById('cartonQty').focus();
        } else {
            currentProduct = null;
            document.getElementById('itemName').value = "";
            document.getElementById('addBtn').disabled = true;
            document.getElementById('addBtn').innerText = "ئەم کاڵایە بوونی نییە ❌";
            document.getElementById('historyDiv').style.display = 'none';
            alert("⚠️ ئاگاداری: ئەم کاڵایە یان بارکۆدە پێشتر پێناسە نەکراوە! تکایە سەرەتا لە بەشی داخلکردن زیادی بکە.");
        }
    }

    function showHistory(p) {
        document.getElementById('historyDiv').style.display = 'block';
        document.getElementById('historyBody').innerHTML = `
            <tr>
                <td style="color:var(--warning); font-weight:bold;">$${p.buy_price || 0}</td>
                <td style="color:var(--success); font-weight:bold;">$${p.sell_price || 0}</td>
                <td style="color:var(--purple); font-weight:bold;">$${p.wholesale_price || 0}</td>
                <td>${p.updated_at ? new Date(p.updated_at).toLocaleDateString() : 'تۆمار نەکراوە'}</td>
            </tr>
        `;
    }

    function conv(type, unit) {
        const rate = (parseFloat(document.getElementById('dollarRate').value) || 150000) / 100;
        const usdVal = document.getElementById(type + 'USD');
        const iqdVal = document.getElementById(type + 'IQD');

        if (unit === 'USD') {
            iqdVal.value = Math.round((parseFloat(usdVal.value) || 0) * rate);
        } else {
            usdVal.value = ((parseFloat(iqdVal.value) || 0) / rate).toFixed(2);
        }
    }

    function calcTotal() {
        const c = parseFloat(document.getElementById('cartonQty').value) || 0;
        const p = parseFloat(document.getElementById('pcsPerCarton').value) || 1;
        const e = parseFloat(document.getElementById('extraPcs').value) || 0;
        document.getElementById('totalQty').value = (c * p) + e;
    }

    function updateAllCalculations() {
        conv('buy', 'USD'); conv('sell', 'USD'); conv('whole', 'USD'); calcTotal();
    }

    function addToTempList() {
        if(!currentProduct) return;
        const qty = parseFloat(document.getElementById('totalQty').value) || 0;
        if(qty <= 0) return alert("تکایە بڕی کاڵاکە دیاری بکە!");

        tempItems.push({
            id: currentProduct.id,
            item_name: currentProduct.item_name,
            total_qty: qty,
            buy_price: parseFloat(document.getElementById('buyUSD').value),
            sell_price: parseFloat(document.getElementById('sellUSD').value),
            wholesale_price: parseFloat(document.getElementById('wholeUSD').value)
        });
        renderTempList();
        resetFields();
    }

    function renderTempList() {
        document.getElementById('tempListBody').innerHTML = tempItems.map((item, index) => `
            <tr>
                <td><b>${item.item_name}</b></td>
                <td>${item.total_qty} دانە</td>
                <td>$${item.buy_price.toFixed(2)}</td>
                <td>$${(item.total_qty * item.buy_price).toFixed(2)}</td>
                <td><button onclick="tempItems.splice(${index},1);renderTempList()" style="color:red; cursor:pointer;">لابردن ❌</button></td>
            </tr>
        `).join('');
    }

    async function finishInvoice() {
        if(tempItems.length === 0) return alert("لیستەکە بەتاڵە!");
        const btn = document.getElementById('finishBtn');
        btn.disabled = true; btn.innerText = "خەریکە پاشەکەوت دەکرێت...";

        for(let item of tempItems) {
            const { data: st } = await _supabase.from('purchases').select('quantity').eq('id', item.id).single();
            await _supabase.from('purchases').update({
                quantity: (st.quantity || 0) + item.total_qty,
                buy_price: item.buy_price,
                sell_price: item.sell_price,
                wholesale_price: item.wholesale_price,
                updated_at: new Date()
            }).eq('id', item.id);
        }
        alert("سەرکەوتوو بوو ✅ وەسڵەکە پاشەکەوت کرا و بڕی کاڵاکان نوێکرانەوە.");
        location.reload();
    }

    function resetFields() {
        document.getElementById('searchInp').value = "";
        document.getElementById('itemName').value = "";
        document.getElementById('cartonQty').value = "0";
        document.getElementById('extraPcs').value = "0";
        document.getElementById('totalQty').value = "0";
        document.getElementById('historyDiv').style.display = 'none';
        document.getElementById('addBtn').disabled = true;
        document.getElementById('addBtn').innerText = "زیادکردن بۆ لیست ➕";
        document.getElementById('searchInp').focus();
    }
</script>
</body>
</html>
