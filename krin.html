<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داخڵکردنی کڕین (Cloud) - Rebin System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header-box { background: var(--main); color: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .btn-save { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        .table-wrap { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f2f6; padding: 12px; border-bottom: 2px solid #ddd; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        @media screen and (max-width: 600px) {
            table thead { display: none; }
            table tr { display: block; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 10px; padding: 10px; }
            table td { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; }
            table td::before { content: attr(data-label); font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h2 style="margin:0;">📥 کڕین (سێرڤەری ئۆنلاین)</h2>
        <a href="index.html" style="color:white; text-decoration:none;">داشبۆرد</a>
    </div>

    <div class="form-grid">
        <div><label>🔢 بارکۆد</label><input type="text" id="barcode"></div>
        <div><label>🧾 وەسڵ #</label><input type="text" id="invNo"></div>
        <div><label>بازرگان</label><input type="text" id="merchant"></div>
        <div><label>بابەت</label><input type="text" id="itemName"></div>
        <div><label>کارتۆن</label><input type="number" id="qty" value="0"></div>
        <div><label>دانە</label><input type="number" id="pcs" value="1"></div>
        <div><label>کڕین</label><input type="number" id="buyPrice" value="0"></div>
        <div><label>دراو</label>
            <select id="curr">
                <option value="USD">دۆلار</option>
                <option value="IQD">دینار</option>
            </select>
        </div>
    </div>
    <button onclick="saveInvoice()" id="saveBtn" class="btn-save">پاشکەوتکردن لەسەر سێرڤەر ☁️</button>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>بەروار</th>
                    <th>وەسڵ</th>
                    <th>بابەت</th>
                    <th>بڕ</th>
                    <th>کردار</th>
                </tr>
            </thead>
            <tbody id="listBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 🔗 پەیوەندی بە سێرڤەر
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';

    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function saveInvoice() {
        const btn = document.getElementById('saveBtn');
        const invNo = document.getElementById('invNo').value;
        const itemName = document.getElementById('itemName').value;

        if(!invNo || !itemName) {
            alert("تکایە وەسڵ و ناوی بابەت پڕ بکەرەوە");
            return;
        }

        btn.disabled = true;
        btn.innerText = "خەریکە سەیڤ دەبێت...";

        const data = {
            inv_no: invNo,
            barcode: document.getElementById('barcode').value,
            merchant: document.getElementById('merchant').value,
            item_name: itemName,
            qty: parseFloat(document.getElementById('qty').value) || 0,
            pcs: parseFloat(document.getElementById('pcs').value) || 0,
            buy_price: parseFloat(document.getElementById('buyPrice').value) || 0,
            currency: document.getElementById('curr').value
        };

        const { error } = await _supabase.from('invoices').insert([data]);

        if (error) {
            alert("کێشە: " + error.message);
        } else {
            alert("تۆمار کرا!");
            document.getElementById('itemName').value = ""; 
            loadInvoices();
        }
        btn.disabled = false;
        btn.innerText = "پاشکەوتکردن لەسەر سێرڤەر ☁️";
    }

    async function loadInvoices() {
        const { data, error } = await _supabase
            .from('invoices')
            .select('*')
            .order('created_at', { ascending: false });

        if (data) {
            const body = document.getElementById('listBody');
            body.innerHTML = data.map(i => `
                <tr>
                    <td data-label="بەروار">${new Date(i.created_at).toLocaleDateString()}</td>
                    <td data-label="وەسڵ">${i.inv_no || ''}</td>
                    <td data-label="بابەت">${i.item_name || ''}</td>
                    <td data-label="بڕ">${i.qty || 0}</td>
                    <td><button onclick="deleteInvoice(${i.id})" style="color:red; border:none; background:none; cursor:pointer;">🗑️</button></td>
                </tr>
            `).join('');
        }
    }

    async function deleteInvoice(id) {
        if(confirm("دڵنیای لە سڕینەوە؟")) {
            await _supabase.from('invoices').delete().eq('id', id);
            loadInvoices();
        }
    }

    window.onload = loadInvoices;
</script>
</body>
</html>
