<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کڕینی پێشکەوتوو - Rebin POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f1f2f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 1300px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .rate-bar { background: #fff3e0; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border: 1px solid #ffe0b2; }
        .rate-bar input { width: 100px; padding: 5px; border: 1px solid #ff9800; text-align: center; font-weight: bold; }
        .header-box { background: var(--main); color: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; padding: 15px; background: #f8f9fa; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 15px; }
        label { display: block; font-size: 11px; margin-bottom: 4px; color: #555; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .item-section { background: #e3f2fd; border: 1px solid #bbdefb; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-finish { background: var(--success); color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 18px; margin-top: 20px; }
        .table-wrap { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #ecf0f1; padding: 12px; border: 1px solid #ddd; font-size: 12px; }
        td { padding: 10px; border: 1px solid #eee; text-align: center; font-size: 13px; }
        .inv-badge { background: #f1c40f; color: black; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="rate-bar">
        <span>💵 نرخی دۆلار:</span>
        <input type="number" id="dollarRate" value="1500">
        <button onclick="createNewInvoice()" style="margin-right:auto; padding:5px 15px; border-radius:5px; cursor:pointer;">🆕 وەسڵی نوێ</button>
    </div>

    <div class="header-box">
        <h2 style="margin:0;">📥 داخڵکردنی وەسڵی کڕین</h2>
        <div>وەسڵ: <span id="invDisplay" class="inv-badge">---</span></div>
        <a href="dashboard.html" style="color:white; text-decoration:none;">🏠 گەڕانەوە</a>
    </div>

    <div class="form-grid">
        <div><label>👤 بازرگان/کۆمپانیا</label><input type="text" id="merchant" placeholder="ناوی کۆمپانیا"></div>
        <div><label>💰 جۆری کڕین</label>
            <select id="payType">
                <option value="Cash">نەختینە (کاش)</option>
                <option value="Debt">بە قەرز</option>
            </select>
        </div>
        <div><label>🏳️ دراو</label>
            <select id="curr">
                <option value="USD">دۆلار ($)</option>
                <option value="IQD">دینار (ع.د)</option>
            </select>
        </div>
    </div>

    <div class="form-grid item-section">
        <div><label>🔢 بارکۆد</label><input type="text" id="barcode" onkeypress="if(event.key==='Enter') focusNext('itemName')"></div>
        <div><label>📦 ناوی کاڵا</label><input type="text" id="itemName"></div>
        <div><label>📦 کارتۆن</label><input type="number" id="cartonQty" value="0" oninput="calcTotal()"></div>
        <div><label>🔢 دانە لە کارتۆن</label><input type="number" id="pcsPerCarton" value="1" oninput="calcTotal()"></div>
        <div><label>🧮 کۆی دانە</label><input type="number" id="totalQty" value="0" readonly style="background:#eee;"></div>
        <div><label>💵 کڕین (دانە)</label><input type="number" id="buyPrice" value="0"></div>
        <div><label>🛒 فرۆشی تاک</label><input type="number" id="saleRetail" value="0"></div>
    </div>
    
    <button onclick="addToTempList()" class="btn-add">زیادکردن بۆ ناو وەسڵ ➕</button>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>بارکۆد</th>
                    <th>ناو</th>
                    <th>بڕ (دانە)</th>
                    <th>نرخی کڕین</th>
                    <th>کۆی گشتی</th>
                    <th>کردار</th>
                </tr>
            </thead>
            <tbody id="tempListBody"></tbody>
        </table>
    </div>

    <button onclick="finishInvoice()" class="btn-finish">تەواوکردنی وەسڵ و ناردن بۆ کۆگا ✅</button>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let tempItems = [];
    let currentInvNo = "";

    window.onload = createNewInvoice;

    function createNewInvoice() {
        currentInvNo = "PUR-" + Math.floor(10000 + Math.random() * 90000);
        document.getElementById('invDisplay').innerText = currentInvNo;
        tempItems = [];
        renderTempList();
    }

    function calcTotal() {
        const c = parseFloat(document.getElementById('cartonQty').value) || 0;
        const p = parseFloat(document.getElementById('pcsPerCarton').value) || 0;
        document.getElementById('totalQty').value = c * p;
    }

    function addToTempList() {
        const item = {
            barcode: document.getElementById('barcode').value,
            item_name: document.getElementById('itemName').value,
            quantity: parseFloat(document.getElementById('totalQty').value) || 0,
            buy_price: parseFloat(document.getElementById('buyPrice').value) || 0,
            sale_price_retail: parseFloat(document.getElementById('saleRetail').value) || 0,
            carton_qty: parseFloat(document.getElementById('cartonQty').value) || 0,
            currency: document.getElementById('curr').value
        };

        if(!item.item_name || item.quantity <= 0) return alert("زانیارییەکان تەواو نین");

        tempItems.push(item);
        renderTempList();
        clearInputs();
    }

    function renderTempList() {
        const body = document.getElementById('tempListBody');
        body.innerHTML = tempItems.map((item, index) => `
            <tr>
                <td>${item.barcode}</td>
                <td>${item.item_name}</td>
                <td>${item.quantity}</td>
                <td>${item.buy_price} ${item.currency}</td>
                <td>${(item.quantity * item.buy_price).toFixed(2)}</td>
                <td><button onclick="tempItems.splice(${index},1);renderTempList()">🗑️</button></td>
            </tr>
        `).join('');
    }

    async function finishInvoice() {
        if(tempItems.length === 0) return alert("وەسڵەکە بەتاڵە!");
        
        const merchant = document.getElementById('merchant').value || "گشتی";
        const payType = document.getElementById('payType').value;
        const rate = parseFloat(document.getElementById('dollarRate').value);

        for(let item of tempItems) {
            // ١. پشکنین: ئایا کاڵاکە پێشتر هەیە؟
            const { data: existing } = await _supabase.from('purchases')
                .select('*').eq('barcode', item.barcode).maybeSingle();

            if(existing) {
                // ئەگەر هەبوو: بڕەکەی زیاد بکە و نرخەکەی نوێ بکەرەوە
                await _supabase.from('purchases').update({
                    quantity: existing.quantity + item.quantity,
                    buy_price: item.buy_price,
                    sale_price_retail: item.sale_price_retail,
                    merchant: merchant,
                    inv_no: currentInvNo
                }).eq('id', existing.id);
            } else {
                // ئەگەر نەبوو: وەک کاڵای نوێ داخڵی بکە
                await _supabase.from('purchases').insert([{
                    ...item,
                    inv_no: currentInvNo,
                    merchant: merchant
                }]);
            }
        }

        // ٢. ئەگەر قەرز بوو، تۆماری بکە (نموونەیی)
        if(payType === "Debt") {
            const totalUSD = tempItems.reduce((s, i) => s + (i.currency === "USD" ? i.quantity * i.buy_price : 0), 0);
            await _supabase.from('merchant_debts').insert([{
                merchant_name: merchant,
                amount_usd: totalUSD,
                dollar_rate_at_time: rate
            }]);
        }

        alert("وەسڵەکە بە سەرکەوتوویی نێردرا بۆ کۆگا ✅");
        createNewInvoice();
    }

    function clearInputs() {
        document.getElementById('barcode').value = "";
        document.getElementById('itemName').value = "";
        document.getElementById('cartonQty').value = "0";
        document.getElementById('totalQty').value = "0";
        document.getElementById('buyPrice').value = "0";
        document.getElementById('saleRetail').value = "0";
        document.getElementById('barcode').focus();
    }
</script>
</body>
</html>
