<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پڕۆفایلی بازرگانان | ڕێبین سیستم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #1a1a2e; --s: #3498db; --bg: #f8f9fa; --danger: #e74c3c; --success: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); direction: rtl; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        
        .supplier-grid { display: grid; grid-template-columns: 320px 1fr; gap: 25px; margin-top: 20px; }
        
        /* لای ڕاست - لیستی بازرگانەکان */
        .sidebar { background: white; padding: 0; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: var(--p); color: white; border-radius: 15px 15px 0 0; }
        #supplierList { overflow-y: auto; flex-grow: 1; }
        .sup-item { padding: 15px 20px; border-bottom: 1px solid #f1f1f1; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: space-between; }
        .sup-item:hover { background: #f0f7ff; padding-right: 30px; }
        .sup-item.active { background: var(--s); color: white; border-left: 5px solid var(--p); }

        /* لای چەپ - وردەکارییەکان */
        .main-content { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 85vh; }
        
        .stats-banner { display: flex; gap: 20px; margin-bottom: 30px; background: #f1f3f8; padding: 20px; border-radius: 12px; }
        .stat-box { flex: 1; text-align: center; }
        .stat-box span { font-size: 14px; color: #666; display: block; }
        .stat-box strong { font-size: 22px; color: var(--p); }

        .invoice-card { 
            border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 15px; 
            display: flex; justify-content: space-between; align-items: center;
            border-right: 6px solid #ccc; transition: 0.2s;
        }
        .invoice-card:hover { transform: scale(1.01); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .debt-border { border-right-color: var(--danger); background: #fffcfc; }
        .paid-border { border-right-color: var(--success); background: #fcfdfc; }

        .badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .unpaid { background: #fee2e2; color: #dc2626; }
        .paid { background: #dcfce7; color: #16a34a; }
        
        .btn-back { padding: 10px 20px; border-radius: 8px; border: none; background: var(--p); color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="color:var(--p);">🤝 مێژووی مامەڵەی بازرگانان</h2>
        <button class="btn-back" onclick="location.href='dashboard.html'">🏠 گەڕانەوە بۆ داشبۆرد</button>
    </div>

    <div class="supplier-grid">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3 style="margin:0;">لیستی بازرگانەکان</h3>
            </div>
            <div id="supplierList">
                <div style="padding:20px; text-align:center
