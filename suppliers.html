<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پڕۆفایلی بازرگانان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --success: #27ae60; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 20px; margin: 0; }
        .container { max-width: 1300px; margin: auto; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        
        /* Sidebar List */
        .sidebar { background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: 85vh; overflow-y: auto; }
        .sidebar-header { padding: 20px; background: var(--p); color: white; border-radius: 15px 15px 0 0; position: sticky; top: 0; }
        .sup-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .sup-item:hover { background: #f0f7ff; }
        .sup-item.active { background: var(--s); color: white; }

        /* Content Area */
        .main-content { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-height: 85vh; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-box { flex: 1; padding: 15px; background: #f8f9fa; border-radius: 10px; text-align: center; border: 1px solid #eee; }
        
        .invoice-card { border: 1px solid #eee; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 5px solid #ccc; }
        .debt { border-right-color: var(--danger); }
        .paid { border-right-color: var(--success); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .unpaid-bg { background: #fee2e2; color: #dc2626; }
        .paid-bg { background: #dcfce7; color: #16a34a; }
    </style>
</head>
<body>

<div style="max-width:1300px; margin: 0 auto 15px auto; display:flex; justify-content:space-between; align-items:center;">
    <h2 style="margin:0;">👥 بەڕێوەبردنی حیساباتی بازرگانان</h2>
    <button onclick="location.href='dashboard.html'" style="padding:10px 20px; border-radius:8px; border:none; background:var(--p); color:white; cursor:pointer;">🏠 گەڕانەوە</button>
</div>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">بازرگانە تۆمارکراوەکان</div>
        <div id="supplierList">بار دەکرێت...</div>
    </div>

    <div class="main-content" id="detailsArea">
        <div style="text-align:center; margin-top:150px; color:#999;">
            <h3>تکایە بازرگانێک هەڵبژێرە بۆ بینینی کەشف حیساب</h3>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // ١. هێنانی هەموو بازرگانەکان لە خشتەی suppliers
    async function loadSuppliers() {
        const { data: suppliers, error } = await _supabase.from('suppliers').select('*').order('name');
        if (error) return console.error(error);

        const listDiv = document.getElementById('supplierList');
        listDiv.innerHTML = suppliers.map(s => `
            <div class="sup-item" onclick="viewProfile('${s.name}', this)">
                <strong>${s.name}</strong>
                <div style="font-size:11px; opacity:0.7;">${s.category || 'گشتی'}</div>
            </div>
        `).join('');

        // پشکنین: ئەگەر لە لاپەڕەی ناساندنەوە هاتبێت بە ناوێکەوە
        const urlParams = new URLSearchParams(window.location.search);
        const autoName = urlParams.get('name');
        if (autoName) {
            viewProfile(autoName);
        }
    }

    // ٢. بینینی پڕۆفایل و مێژووی مامەڵەکان
    async function viewProfile(name, element) {
        if(element) {
            document.querySelectorAll('.sup-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        const detailsArea = document.getElementById('detailsArea');
        detailsArea.innerHTML = "<h4>خەریکە مێژووی مامەڵەکان دەهێنرێن...</h4>";

        // هێنانی کڕینەکان لە خشتەی purchases
        const { data: invoices } = await _supabase.from('purchases')
            .select('*')
            .eq('supplier_name', name)
            .order('created_at', { ascending: false });

        let totalPurchases = 0;
        let totalDebt = 0;

        let html = invoices.map(inv => {
            totalPurchases += inv.total_price_usd;
            if(inv.is_debt) totalDebt += inv.total_price_usd;
            
            return `
                <div class="invoice-card ${inv.is_debt ? 'debt' : 'paid'}">
                    <div>
                        <strong>📦 ${inv.item_name}</strong><br>
                        <small>📅 ${new Date(inv.created_at).toLocaleDateString()}</small>
                    </div>
                    <div style="text-align:left;">
                        <span style="font-weight:bold;">${inv.total_price_usd.toLocaleString()} $</span><br>
                        <span class="badge ${inv.is_debt ? 'unpaid-bg' : 'paid-bg'}">${inv.is_debt ? 'قەرز' : 'نەقد'}</span>
                    </div>
                </div>
            `;
        }).join('');

        detailsArea.innerHTML = `
            <div style="border-bottom:2px solid #eee; padding-bottom:15px; margin-bottom:20px;">
                <h2 style="margin:0; color:var(--p);">${name}</h2>
            </div>
            
            <div class="stats">
                <div class="stat-box"><span>کۆی کڕین</span><br><strong>${totalPurchases.toLocaleString()} $</strong></div>
                <div class="stat-box" style="color:var(--danger)"><span>قەرزی ماوە</span><br><strong>${totalDebt.toLocaleString()} $</strong></div>
                <div class="stat-box"><span>وەسڵەکان</span><br><strong>${invoices.length}</strong></div>
            </div>

            <h3 style="margin-bottom:15px;">📜 مێژووی مامەڵەکان</h3>
            <div style="max-height: 500px; overflow-y: auto;">
                ${html || '<p style="text-align:center; color:#999; margin-top:50px;">هیچ مامەڵەیەک تۆمار نەکراوە بۆ ئەم بازرگانە.</p>'}
            </div>
        `;
    }

    window.onload = loadSuppliers;
</script>
</body>
</html>
