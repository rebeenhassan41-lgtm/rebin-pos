<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ناساندنی کەرەستە</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #8e44ad; --bg: #f4f7f6; --text: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; direction: rtl; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        h2 { color: var(--p); text-align: center; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text); }
        input, select { 
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; 
            box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--p); }

        .img-preview {
            width: 100%; height: 180px; border: 2px dashed #ccc; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 15px; cursor: pointer; overflow: hidden; background: #fafafa;
        }
        .img-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .btn { 
            width: 100%; padding: 15px; background: var(--p); color: white; border: none; 
            border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn:active { transform: scale(0.98); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📦 ناساندنی کاڵای نوێ</h2>
        
        <div class="img-preview" onclick="document.getElementById('itemImg').click()">
            <span id="placeholderText">📸 وێنەی کاڵا باربکە</span>
            <img id="preview" src="">
        </div>
        <input type="file" id="itemImg" hidden accept="image/*" onchange="previewImage(event)">

        <div class="input-group">
            <label>ناوی کاڵا</label>
            <input type="text" id="itemName" placeholder="بۆ نموونە: مۆبایل">
        </div>

        <div class="input-group">
            <label>بارکۆد</label>
            <input type="text" id="itemBarcode" placeholder="بارکۆد لێبدە یان بنووسە">
        </div>

        <div class="input-group">
            <label>نرخی کڕین ($)</label>
            <input type="number" id="buyPrice" placeholder="0.00">
        </div>

        <div class="input-group">
            <label>نرخی فرۆشتن ($)</label>
            <input type="number" id="sellPrice" placeholder="0.00">
        </div>

        <button class="btn" id="saveBtn" onclick="saveItem()">تۆمارکردنی کاڵا ✅</button>
        
        <a href="dashboard.html" class="back-link">گەڕانەوە بۆ سەرەکی</a>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // پیشاندانی وێنەکە پێش بارکردن
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('placeholderText').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    async function saveItem() {
        const name = document.getElementById('itemName').value.trim();
        const barcode = document.getElementById('itemBarcode').value.trim();
        const buy = document.getElementById('buyPrice').value;
        const sell = document.getElementById('sellPrice').value;
        const file = document.getElementById('itemImg').files[0];
        const branchId = localStorage.getItem("userBranchId") || 1;

        if (!name || !buy || !sell) return alert("تکایە زانیارییەکان پڕ بکەرەوە");

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = "خەریکی تۆمارکردنە...";

        let imageUrl = "";

        // 1. بارکردنی وێنە ئەگەر هەبوو
        if (file) {
            const fileName = Date.now() + "_" + file.name;
            const { data: imgData, error: imgErr } = await _supabase.storage
                .from('item-images')
                .upload(fileName, file);
            
            if (!imgErr) {
                const { data: urlData } = _supabase.storage.from('item-images').getPublicUrl(fileName);
                imageUrl = urlData.publicUrl;
            }
        }

        // 2. پاشەکەوتکردن لە داتابەیس
        const { error } = await _supabase.from('items').insert([{
            item_name: name,
            barcode: barcode,
            buy_price: parseFloat(buy),
            sell_price: parseFloat(sell),
            image_url: imageUrl,
            branch_id: parseInt(branchId)
        }]);

        if (error) {
            alert("هەڵە ڕوویدا: " + error.message);
        } else {
            alert("کاڵا بە سەرکەوتوویی تۆمارکرا 📦");
            location.reload();
        }
        
        btn.disabled = false;
        btn.innerText = "تۆمارکردنی کاڵا ✅";
    }
</script>
</body>
</html>
