<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ناساندنی کەرەستە - ڕێبین سیستم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #3498db; --bg: #f4f7f6; --success: #27ae60; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 20px; margin: 0; }
        .btn-back { background: var(--p); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        .form-card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .form-card h2 { text-align: center; color: var(--p); margin-top: 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--p); font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; outline-color: var(--s); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-save { width: 100%; padding: 15px; background: var(--success); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 18px; margin-top: 30px; font-weight: bold; transition: 0.3s; }
        .btn-save:hover { background: #219150; transform: translateY(-2px); }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-back">🔙 گەڕانەوە</a>

    <div class="form-card">
        <h2>📦 ناساندنی کەرەستەی نوێ</h2>
        
        <label>🔍 بارکۆدی کەرەستە (Barcode):</label>
        <input type="text" id="barcode" placeholder="بارکۆد سکان بکە یان بنووسە" autofocus>

        <label>📝 ناوی کەرەستە:</label>
        <input type="text" id="itemName" placeholder="ناوی کاڵاکە بنووسە...">

        <div class="grid">
            <div>
                <label>📂 کاتیگۆری:</label>
                <select id="itemCat">
                    <option value="گشتی">گشتی</option>
                    <option value="خۆراک">خۆراک</option>
                    <option value="کارەبایی">کارەبایی</option>
                    <option value="کۆسمێتیک">کۆسمێتیک</option>
                </select>
            </div>
            <div>
                <label>🏷️ براند (Brand):</label>
                <input type="text" id="brand" placeholder="بۆ نموونە: LG, Apple...">
            </div>
        </div>

        <button class="btn-save" id="saveBtn" onclick="saveItem()">تۆمارکردن لە لیست ✅</button>
    </div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function saveItem() {
        const barcode = document.getElementById('barcode').value.trim();
        const name = document.getElementById('itemName').value.trim();
        const cat = document.getElementById('itemCat').value;
        const brand = document.getElementById('brand').value.trim();
        const btn = document.getElementById('saveBtn');

        if(!barcode || !name) return alert("تکایە ناو و بارکۆد پڕ بکەرەوە!");

        btn.disabled = true;
        btn.innerText = "خەریکی پشکنینە...";

        try {
            // ١. پشکنینی دووبارە نەبوونەوە
            const { data: existing } = await _supabase
                .from('purchases')
                .select('id')
                .eq('barcode', barcode)
                .maybeSingle();
            
            if (existing) {
                alert("ئەم بارکۆدە پێشتر ناسێنراوە!");
                btn.disabled = false;
                btn.innerText = "تۆمارکردن لە لیست ✅";
                return;
            }

            // ٢. دروستکردنی داتا بۆ ناردن (بەتەنها ئەو ستوونانەی دڵنیاین هەن)
            const payload = {
                barcode: barcode,
                item_name: name,
                quantity: 0,
                cost_price_usd: 0,
                sale_price_retail: 0,
                sale_price_wholesale: 0,
                category: cat, // دڵنیابەوە لە Supabase پیتەکان بچوکن
                brand: brand   // دڵنیابەوە لە Supabase پیتەکان بچوکن
            };

            // ٣. ناردن بۆ داتابەیس
            const { error } = await _supabase.from('purchases').insert([payload]);

            if(!error) {
                alert("کەرەستەی (" + name + ") بە سەرکەوتوویی تۆمار کرا ✅");
                location.reload();
            } else {
                console.error("Supabase Error:", error);
                alert("کێشەیەک لە ستوونەکان هەیە: " + error.message);
                btn.disabled = false;
                btn.innerText = "تۆمارکردن لە لیست ✅";
            }
        } catch (err) {
            alert("هەڵەیەکی چاوەڕواننەکراو: " + err.message);
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
