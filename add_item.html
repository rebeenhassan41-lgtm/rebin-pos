<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تۆمارکردنی کەرەستە - ڕێبین سیستم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .section-title { background: #eee; padding: 10px; border-radius: 8px; margin-top: 25px; color: var(--p); font-weight: bold; border-right: 5px solid var(--s); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        
        /* شێوازی نوێ بۆ بەشی کاتیگۆری */
        .flex-row { display: flex; gap: 5px; }
        .btn-plus { background: var(--s); color: white; border: none; border-radius: 8px; width: 40px; cursor: pointer; font-weight: bold; font-size: 20px; }
        
        .btn-save { width: 100%; padding: 20px; background: #27ae60; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 20px; font-weight: bold; margin-top: 30px; transition: 0.3s; }
        .btn-save:hover { background: #219150; }
        .checkbox-grid { display: flex; gap: 20px; align-items: center; margin-top: 20px; background: #fdfdfd; padding: 15px; border-radius: 10px; border: 1px dashed #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items: center;">
        <h2>📦 دروستکردنی کەرەستەی نوێ</h2>
        <a href="dashboard.html" style="text-decoration:none; color:#e74c3c; font-weight:bold; border: 1px solid #e74c3c; padding: 5px 15px; border-radius: 8px;">گه‌ڕانه‌وه‌ 🔙</a>
    </div>

    <div class="section-title">📝 زانیاری گشتی</div>
    <div class="grid">
        <div><label>ناو*</label><input type="text" id="itemName"></div>
        <div><label>ناوی زانستی</label><input type="text" id="sciName"></div>
        <div><label>کۆد (بارکۆد)*</label><input type="text" id="barcode" autofocus></div>
        <div><label>ئایدی</label><input type="text" id="itemId" placeholder="بە شێوەی خۆکار"></div>
    </div>
    <div class="grid">
        <div>
            <label>کاتیگۆری</label>
            <div class="flex-row">
                <select id="cat">
                    <option value="گشتی">گشتی</option>
                    <option value="دەرمان">دەرمان</option>
                    <option value="خۆراک">خۆراک</option>
                </select>
                <button class="btn-plus" onclick="addNewCategory()" title="زیادکردنی کاتیگۆری نوێ">+</button>
            </div>
        </div>
        <div><label>براند</label><input type="text" id="brand" placeholder="بێ براند"></div>
        <div><label>دابینکەر (Supplier)</label><input type="text" id="supplier"></div>
    </div>

    <div class="section-title">📅 بەسەرچوون و پاراستن</div>
    <div class="grid">
        <div><label>ڕێکەوتی بەسەرچوون</label><input type="date" id="expiryDate"></div>
        <div><label>ئاگادارکردنەوە پێش (ڕۆژ)</label><input type="number" id="expiryAlertDays" value="30"></div>
    </div>

    <div class="section-title">💰 نرخ و پێوانە</div>
    <div class="grid">
        <div><label>نرخی کڕین</label><input type="number" id="buyPrice"></div>
        <div><label>نرخی فرۆش (تاک)</label><input type="number" id="sellPrice"></div>
        <div><label>نرخی فرۆشی کۆ</label><input type="number" id="wholesalePrice"></div>
    </div>
    <div class="grid">
        <div><label>یەکە (Unit)</label><select id="unit"><option>دانە</option><option>کارتۆن</option></select></div>
        <div><label>بڕی یەکە لەناو کارتۆن</label><input type="number" id="pcsInCarton" value="1"></div>
        <div><label>کەمترین بڕی ئاگادارکردنەوە</label><input type="number" id="alertQty" value="5"></div>
    </div>

    <div class="checkbox-grid">
        <label><input type="checkbox" id="isService"> خزمەتگوزارییە</label>
        <label><input type="checkbox" id="hasExpiry" checked> ئیکسپایەر دەبێت</label>
        <label><input type="checkbox" id="isActive" checked> چالاکە</label>
    </div>

    <button class="btn-save" onclick="saveFullItem()">تۆمارکردن لە کۆگا ✅</button>
</div>

<script>
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // فەنکشن بۆ زیادکردنی کاتیگۆری نوێ بە شێوەی کاتی
    function addNewCategory() {
        const newCat = prompt("ناوی کاتیگۆرییە نوێیەکە بنووسە:");
        if (newCat && newCat.trim() !== "") {
            const select = document.getElementById('cat');
            const option = document.createElement("option");
            option.text = newCat;
            option.value = newCat;
            select.add(option);
            select.value = newCat; // یەکسەر هەڵبژێردرێت
        }
    }

    async function saveFullItem() {
        const payload = {
            item_name: document.getElementById('itemName').value,
            scientific_name: document.getElementById('sciName').value,
            barcode: document.getElementById('barcode').value,
            category: document.getElementById('cat').value,
            brand: document.getElementById('brand').value,
            supplier: document.getElementById('supplier').value,
            expiry_date: document.getElementById('expiryDate').value || null,
            expiry_alert_days: document.getElementById('expiryAlertDays').value || 30,
            cost_price_usd: document.getElementById('buyPrice').value || 0,
            sale_price_retail: document.getElementById('sellPrice').value || 0,
            sale_price_wholesale: document.getElementById('wholesalePrice').value || 0,
            unit: document.getElementById('unit').value,
            pcs_in_carton: document.getElementById('pcsInCarton').value || 1,
            alert_quantity: document.getElementById('alertQty').value || 5,
            is_service: document.getElementById('isService').checked,
            has_expiry: document.getElementById('hasExpiry').checked,
            is_active: document.getElementById('isActive').checked
        };

        if(!payload.item_name || !payload.barcode) return alert("تکایە ناو و بارکۆد بەتاڵ مەکە!");

        const { error } = await _supabase.from('purchases').insert([payload]);

        if(!error) {
            alert("کاڵای (" + payload.item_name + ") بە سەرکەوتوویی پاشەکەوت کرا! 🚀");
            location.reload();
        } else {
            alert("هەڵە: " + error.message);
        }
    }
</script>
</body>
</html>
