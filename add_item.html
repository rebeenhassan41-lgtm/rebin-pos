<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ناساندنی کەرەستە - ڕێبین سیستم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #2c3e50; --s: #3498db; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); direction: rtl; padding: 20px; margin: 0; }
        
        .top-nav { max-width: 700px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; }
        .btn-back { background: var(--p); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-back:hover { background: #34495e; }

        .form-card { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-card h2 { text-align: center; color: var(--p); margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--p); font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-family: inherit; outline-color: var(--s); }
        
        .btn-save { width: 100%; padding: 15px; background: var(--success); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; margin-top: 25px; font-weight: bold; transition: 0.3s; }
        .btn-save:hover { background: #219150; transform: translateY(-2px); }
        
        .info-note { background: #e8f4fd; color: #2980b9; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="top-nav">
        <h3 style="margin:0;">ڕێبین سیستم</h3>
        <a href="dashboard.html" class="btn-back">🔙 گەڕانەوە بۆ داشبۆرد</a>
    </div>

    <div class="form-card">
        <h2>📦 ناساندنی کەرەستەی نوێ</h2>

        <label>🔍 بارکۆدی کەرەستە (Barcode):</label>
        <input type="text" id="barcode" placeholder="بارکۆد سکان بکە یان لێرە بنووسە" autofocus>

        <label>📝 ناوی کەرەستە:</label>
        <input type="text" id="itemName" placeholder="بۆ نموونە: تایت، زەیت، موبایل...">

        <div class="grid">
            <div>
                <label>💰 نرخی فرۆشی تاک ($):</label>
                <input type="number" id="retailPrice" step="0.01" placeholder="0.00">
            </div>
            <div>
                <label>🏢 نرخی فرۆشی کۆ ($):</label>
                <input type="number" id="wholesalePrice" step="0.01" placeholder="0.00">
            </div>
        </div>

        <label>📂 کاتیگۆری (جۆری کاڵا):</label>
        <select id="itemCat">
            <option value="گشتی">گشتی</option>
            <option value="خۆراک">خۆراک</option>
            <option value="کارەبایی">کارەبایی</option>
            <option value="کۆسمێتیک">کۆسمێتیک</option>
            <option value="پێڵاو و جلی">پێڵاو و جل</option>
        </select>

        <p class="info-note">کاتێک کەرەستەیەک لێرە دەناسێنیت، بڕەکەی لە کۆگا بە (سفر) تۆمار دەبێت تا کڕینی بۆ دەکەیت.</p>

        <button class="btn-save" id="saveBtn" onclick="saveItem()">تۆمارکردن لە سیستم ✅</button>
    </div>

<script>
    // کۆنفیگۆریتی داتابەیس
    const SB_URL = 'https://kgwgwymiucelrdeefzca.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnd2d3eW1pdWNlbHJkZWVmemNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMDAyMDMsImV4cCI6MjA4Mjg3NjIwM30.3lPJzLqkSD-Z6nRB7Dai9DzsUy6kNLRGUQGFY4ef8bI';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function saveItem() {
        const barcode = document.getElementById('barcode').value.trim();
        const name = document.getElementById('itemName').value.trim();
        const retail = document.getElementById('retailPrice').value;
        const wholesale = document.getElementById('wholesalePrice').value;
        const cat = document.getElementById('itemCat').value;
        const btn = document.getElementById('saveBtn');

        // ١. پشکنینی خانە بەتاڵەکان
        if(!barcode || !name) {
            alert("تکایە ناو و بارکۆد بە دروستی پڕ بکەرەوە!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "خەریکی پشکنین و سەیڤکردنە...";

        try {
            // ٢. پشکنینی دووبارە نەبوونەوەی بارکۆد
            const { data: existing, error: checkError } = await _supabase
                .from('purchases')
                .select('id')
                .eq('barcode', barcode)
                .maybeSingle();

            if (existing) {
                alert("ئەم بارکۆدە پێشتر تۆمار کراوە! تکایە بارکۆدێکی تر بەکاربهێنە.");
                btn.disabled = false;
                btn.innerText = "تۆمارکردن لە سیستم ✅";
                return;
            }

            // ٣. ناردنی زانیارییەکان بۆ داتابەیس
            const { error: insertError } = await _supabase.from('purchases').insert([{
                barcode: barcode,
                item_name: name,
                sale_price_retail: parseFloat(retail) || 0,
                sale_price_wholesale: parseFloat(wholesale) || 0,
                category: cat,
                quantity: 0, 
                cost_price_usd: 0,
                currency: 'USD'
            }]);

            if(!insertError) {
                alert("کەرەستەی (" + name + ") بە سەرکەوتوویی ناسێندرا ✅");
                location.reload(); 
            } else {
                throw insertError;
            }

        } catch (err) {
            alert("هەڵەیەک ڕوویدا: " + err.message);
            btn.disabled = false;
            btn.innerText = "تۆمارکردن لە سیستم ✅";
        }
    }
</script>
</body>
</html>
